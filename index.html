<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-sm.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Python runs in the browser via Pyodide, fetched from this CDN. Opening
         the connection during page parse saves the DNS + TLS round trips from
         the runtime download that starts as soon as the app mounts. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <title>Kodetika</title>
    <script>
      // Paint the saved theme before React arrives, or every load flashes the
      // light default. The dark-id list is a copy of the `dark` flags in
      // src/lib/themes.js; tests/themes.test.js fails if the two drift apart.
      (function() {
        var darkIds = ["dark", "midnight", "forest", "synthwave"];
        var t = localStorage.getItem("theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
        if (darkIds.indexOf(t) >= 0) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
