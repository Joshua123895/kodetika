# The hand-written half of the handbook: language reference and local-setup
# guides. The other half (per-level concepts) is generated from the tracks.
#
# House style for entries: `sig` is what you type, `desc` is one sentence in
# the product's voice (backticks become code, no em-dashes), `ex` is a one or
# two line snippet. Claimed outputs appear only in comments and only when they
# are beyond doubt. Scope follows the tracks: if no level touches it, it earns
# a place here only when someone would reach for it in the very next breath.

topics:
  - slug: python
    name: Python
    blurb: 'The built-ins and methods the Python tracks lean on, in one place.'
    groups:
      - name: Built-in functions
        entries:
          - sig: print(*values)
            desc: 'Writes values to the console, separated by spaces.'
            ex: 'print("score:", 42)'
          - sig: len(x)
            desc: 'How many items a string, list, or other container holds.'
            ex: 'len("hello")  # 5'
          - sig: input(prompt)
            desc: 'Shows the prompt and waits for a line of typing. Always returns text.'
            ex: 'age = int(input("Age? "))'
          - sig: range(start, stop, step)
            desc: 'The numbers from `start` up to but not including `stop`. One argument means from 0.'
            ex: 'for i in range(3): print(i)  # 0 1 2'
          - sig: int(x) / float(x) / str(x)
            desc: 'Converts between numbers and text. `int("7")` is 7; `str(7)` is `"7"`.'
            ex: 'total = int("21") * 2'
          - sig: type(x)
            desc: 'Which type a value is. Mostly for checking your assumptions.'
            ex: 'type(3.5)  # <class ''float''>'
          - sig: sorted(xs)
            desc: 'A new sorted list, leaving the original alone. `reverse=True` flips it.'
            ex: 'sorted([3, 1, 2])  # [1, 2, 3]'
          - sig: sum(xs) / min(xs) / max(xs)
            desc: 'The total, smallest, or largest of the numbers in a container.'
            ex: 'max([4, 9, 2])  # 9'
          - sig: abs(x) / round(x, n)
            desc: 'Distance from zero, and rounding to `n` decimal places.'
            ex: 'round(3.14159, 2)  # 3.14'
          - sig: enumerate(xs)
            desc: 'Pairs each item with its index, for loops that need both.'
            ex: 'for i, name in enumerate(names): print(i, name)'
          - sig: zip(a, b)
            desc: 'Walks two containers side by side, pairing their items.'
            ex: 'for name, score in zip(names, scores): ...'
      - name: Strings
        entries:
          - sig: s.upper() / s.lower()
            desc: 'The same text in one case. Originals are never changed; strings cannot be.'
            ex: '"Hey".upper()  # "HEY"'
          - sig: s.strip()
            desc: 'The text without whitespace at either end.'
            ex: '"  hi  ".strip()  # "hi"'
          - sig: s.split(sep)
            desc: 'Cuts the string into a list. With no argument it splits on whitespace.'
            ex: '"a,b,c".split(",")  # ["a", "b", "c"]'
          - sig: sep.join(xs)
            desc: 'The opposite of split: glues a list of strings with `sep` between them.'
            ex: '", ".join(["a", "b"])  # "a, b"'
          - sig: s.replace(old, new)
            desc: 'A copy with every `old` swapped for `new`.'
            ex: '"2026-08-20".replace("-", "/")'
          - sig: s.find(sub)
            desc: 'The index where `sub` first appears, or -1 when it does not.'
            ex: '"banana".find("na")  # 2'
          - sig: sub in s
            desc: 'Whether the text contains `sub`. Case sensitive, which catches people out.'
            ex: '"an" in "Hanna"  # True'
          - sig: s.startswith(x) / s.endswith(x)
            desc: 'Whether the text begins or ends with `x`.'
            ex: 'name.endswith(".py")'
          - sig: s.count(sub)
            desc: 'How many times `sub` appears.'
            ex: '"banana".count("a")  # 3'
          - sig: f"..."
            desc: 'An f-string: expressions inside `{}` are evaluated into the text.'
            ex: 'f"{name} is {age}"'
          - sig: s[i] and s[a:b]
            desc: 'One character by index, or a slice from `a` up to but not including `b`. Negatives count from the end.'
            ex: '"python"[0], "python"[-1], "python"[1:4]  # "p", "n", "yth"'
      - name: Lists
        entries:
          - sig: xs.append(x)
            desc: 'Adds one item to the end, in place.'
            ex: 'names.append("Ada")'
          - sig: xs.insert(i, x)
            desc: 'Puts `x` at index `i`, shifting everything after it.'
            ex: 'names.insert(0, "first")'
          - sig: xs.pop(i)
            desc: 'Removes and returns the item at `i`; the last one when no index is given.'
            ex: 'last = names.pop()'
          - sig: xs.remove(x)
            desc: 'Removes the first item equal to `x`. Errors when it is not there.'
            ex: 'names.remove("Ada")'
          - sig: xs.sort()
            desc: 'Sorts the list in place. `sorted(xs)` is the copy-making alternative.'
            ex: 'scores.sort(reverse=True)'
          - sig: xs.index(x)
            desc: 'Where `x` first appears. Errors when it is not there, unlike a string''s find.'
            ex: 'names.index("Ada")'
          - sig: xs.extend(more) or xs + more
            desc: 'Appends every item of another list.'
            ex: 'names.extend(["Bo", "Cy"])'
          - sig: x in xs
            desc: 'Whether the list contains `x`.'
            ex: 'if "Ada" in names: ...'
          - sig: '[expr for x in xs if cond]'
            desc: 'A list comprehension: build a new list by transforming and filtering another.'
            ex: 'squares = [n * n for n in range(5)]'
      - name: Dictionaries
        entries:
          - sig: d[key] and d[key] = value
            desc: 'Read or set one entry. Reading a missing key errors; setting one creates it.'
            ex: 'ages["Ada"] = 36'
          - sig: d.get(key, default)
            desc: 'Read an entry, with a fallback instead of an error when it is missing.'
            ex: 'ages.get("Bo", 0)'
          - sig: key in d
            desc: 'Whether the key exists.'
            ex: 'if "Ada" in ages: ...'
          - sig: d.keys() / d.values() / d.items()
            desc: 'The keys, the values, or `(key, value)` pairs, for looping.'
            ex: 'for name, age in ages.items(): ...'
          - sig: d.pop(key)
            desc: 'Removes an entry and returns its value.'
            ex: 'ages.pop("Ada")'
          - sig: d.update(other)
            desc: 'Copies every entry from another dictionary in, overwriting on clashes.'
            ex: 'settings.update(overrides)'
      - name: Sets and tuples
        entries:
          - sig: set(xs)
            desc: 'The unique items, in no particular order. Fast membership checks.'
            ex: 'len(set([1, 2, 2, 3]))  # 3'
          - sig: a | b, a & b, a - b
            desc: 'Union, intersection, and difference of two sets.'
            ex: 'wants & haves'
          - sig: (a, b)
            desc: 'A tuple: like a list, but frozen. What multiple return values really are.'
            ex: 'lo, hi = min(xs), max(xs)'
      - name: Math and randomness
        entries:
          - sig: '+ - * / // % **'
            desc: 'The operators. `/` always gives a float, `//` floors, `%` is the remainder, `**` is power.'
            ex: '7 // 2, 7 % 2, 2 ** 10  # 3, 1, 1024'
          - sig: import math
            desc: '`math.sqrt`, `math.floor`, `math.ceil`, `math.pi` and friends.'
            ex: 'math.sqrt(16)  # 4.0'
          - sig: import random
            desc: '`random.randint(a, b)` for a whole number in a range, `random.choice(xs)` to pick one, `random.shuffle(xs)` to reorder in place.'
            ex: 'roll = random.randint(1, 6)'
      - name: Files
        entries:
          - sig: with open(path) as f
            desc: 'Opens for reading and closes automatically at the end of the block.'
            ex: |-
              with open("notes.txt") as f:
                  text = f.read()
          - sig: open(path, "w") / open(path, "a")
            desc: '`"w"` starts the file over; `"a"` appends to the end.'
            ex: |-
              with open("log.txt", "a") as f:
                  f.write("done\n")
          - sig: f.read() / f.readlines() / iterating f
            desc: 'The whole file as one string, as a list of lines, or line by line in a loop.'
            ex: |-
              for line in f:
                  print(line.strip())
      - name: When things go wrong
        entries:
          - sig: try / except
            desc: 'Runs the block; if the named error happens, runs the handler instead of crashing.'
            ex: |-
              try:
                  n = int(text)
              except ValueError:
                  n = 0
          - sig: raise
            desc: 'Throws an error of your own, for callers to catch.'
            ex: 'raise ValueError("age cannot be negative")'
          - sig: 'The usual suspects'
            desc: '`ValueError` for a bad value, `TypeError` for a bad type, `KeyError` for a missing dict key, `IndexError` for a bad list index, `ZeroDivisionError` for the obvious.'
            ex: 'except (ValueError, TypeError):'

  - slug: javascript
    name: JavaScript
    blurb: 'Strings, arrays, the page, and fetch: the lookups the web tracks need.'
    groups:
      - name: Strings
        entries:
          - sig: s.length
            desc: 'How many characters. A property, not a method: no parentheses.'
            ex: '"hello".length  // 5'
          - sig: s.toUpperCase() / s.toLowerCase()
            desc: 'The same text in one case.'
            ex: '"Hey".toLowerCase()  // "hey"'
          - sig: s.trim()
            desc: 'Without whitespace at either end.'
            ex: '"  hi  ".trim()  // "hi"'
          - sig: s.includes(sub)
            desc: 'Whether the text contains `sub`. Case sensitive.'
            ex: '"Hanna".includes("an")  // true'
          - sig: s.split(sep)
            desc: 'Cuts the string into an array.'
            ex: '"a,b".split(",")  // ["a", "b"]'
          - sig: s.slice(a, b)
            desc: 'The characters from `a` up to but not including `b`. Negatives count from the end.'
            ex: '"python".slice(1, 4)  // "yth"'
          - sig: s.replace(old, new) / s.replaceAll(old, new)
            desc: '`replace` swaps the first match only; `replaceAll` swaps every one.'
            ex: '"a-b-c".replaceAll("-", "/")'
          - sig: '`text ${expr}`'
            desc: 'A template literal: backticks, with expressions inside `${}`.'
            ex: '`${name}, table ${n}`'
      - name: Arrays
        entries:
          - sig: xs.push(x) / xs.pop()
            desc: 'Add to or remove from the end, in place.'
            ex: 'list.push("new")'
          - sig: xs.map(fn)
            desc: 'A new array with `fn` applied to every item.'
            ex: 'ns.map(n => n * 2)'
          - sig: xs.filter(fn)
            desc: 'A new array keeping only the items `fn` says yes to.'
            ex: 'ns.filter(n => n > 0)'
          - sig: xs.find(fn)
            desc: 'The first item `fn` says yes to, or `undefined`.'
            ex: 'users.find(u => u.id === 7)'
          - sig: xs.reduce(fn, start)
            desc: 'Folds the array into one value, feeding each item into an accumulator.'
            ex: 'ns.reduce((total, n) => total + n, 0)'
          - sig: xs.includes(x) / xs.indexOf(x)
            desc: 'Whether an item is there, and where it first appears (-1 when absent).'
            ex: 'names.includes("Ada")'
          - sig: xs.join(sep)
            desc: 'Glues the items into one string.'
            ex: '["a", "b"].join(", ")  // "a, b"'
          - sig: xs.sort(fn)
            desc: 'Sorts in place. Without `fn`, numbers sort as text: pass `(a, b) => a - b`.'
            ex: 'ns.sort((a, b) => a - b)'
          - sig: xs.forEach(fn) and for...of
            desc: 'Run something for every item. `for (const x of xs)` is the loop form.'
            ex: 'for (const n of ns) { console.log(n); }'
          - sig: xs.slice(a, b) / xs.splice(i, n)
            desc: '`slice` copies a range out; `splice` cuts items out of the original.'
            ex: 'const firstThree = xs.slice(0, 3);'
      - name: Objects
        entries:
          - sig: obj.key and obj[key]
            desc: 'Read a property by name, or by a name held in a variable.'
            ex: 'user.name, user[field]'
          - sig: Object.keys(o) / Object.values(o) / Object.entries(o)
            desc: 'The keys, the values, or `[key, value]` pairs as arrays.'
            ex: 'for (const [k, v] of Object.entries(o)) ...'
          - sig: '{ ...a, ...b }'
            desc: 'Spread: a new object with the properties of both, `b` winning clashes.'
            ex: 'const updated = { ...user, age: 20 };'
          - sig: const { a, b } = obj
            desc: 'Destructuring: pull properties straight into variables.'
            ex: 'const { text, id } = note;'
      - name: Numbers and JSON
        entries:
          - sig: Number(s) / parseInt(s) / parseFloat(s)
            desc: 'Text to number. `Number("")` is 0; a failed parse is `NaN`.'
            ex: 'const n = Number(input.value);'
          - sig: n.toFixed(d)
            desc: 'The number as text with `d` decimal places.'
            ex: '(2 / 3).toFixed(2)  // "0.67"'
          - sig: Math.round / floor / ceil / max / min / random
            desc: 'Rounding each way, extremes, and `Math.random()` for 0 up to (not including) 1.'
            ex: 'Math.floor(Math.random() * 6) + 1'
          - sig: JSON.parse(s) / JSON.stringify(x)
            desc: 'Text to data and back. What `fetch` bodies and storage are made of.'
            ex: 'localStorage.setItem("save", JSON.stringify(state))'
      - name: The page
        entries:
          - sig: document.querySelector(sel)
            desc: 'The first element matching a CSS selector, or `null`. `querySelectorAll` for all of them.'
            ex: 'const box = document.querySelector("#search");'
          - sig: el.textContent / el.innerHTML
            desc: 'The element''s text, or its HTML. Prefer `textContent` for anything a user typed.'
            ex: 'count.textContent = `${n} items`;'
          - sig: el.addEventListener(type, fn)
            desc: 'Runs `fn` when the event happens: `"click"`, `"input"`, `"submit"`, `"keydown"`.'
            ex: 'btn.addEventListener("click", () => { ... });'
          - sig: event.preventDefault()
            desc: 'Stops the browser''s own reaction, like a form submit reloading the page.'
            ex: 'form.addEventListener("submit", (e) => { e.preventDefault(); ... });'
          - sig: document.createElement(tag) and el.appendChild(child)
            desc: 'Build an element, then attach it to the page.'
            ex: |-
              const li = document.createElement("li");
              list.appendChild(li);
          - sig: el.classList.add / remove / toggle
            desc: 'Change an element''s classes without touching the others.'
            ex: 'panel.classList.toggle("open")'
          - sig: input.value
            desc: 'What is currently typed in an input, always as text.'
            ex: 'const name = document.querySelector("#name").value;'
      - name: Fetch and async
        entries:
          - sig: fetch(url)
            desc: 'Starts a request and returns a promise of the response.'
            ex: 'const response = await fetch("/api/notes");'
          - sig: response.ok / response.status
            desc: 'Whether it worked, and the exact status code. Check before reading the body.'
            ex: 'if (!response.ok) throw new Error(`bad status: ${response.status}`);'
          - sig: await response.json()
            desc: 'The body, parsed from JSON. Also a promise, hence the await.'
            ex: 'const notes = await response.json();'
          - sig: async function / await
            desc: '`await` pauses inside an `async` function until a promise settles.'
            ex: |-
              async function load() {
                const r = await fetch(url);
              }
          - sig: try / catch
            desc: 'Catches a thrown error, including a failed await.'
            ex: |-
              try { await load(); }
              catch (error) { msg.textContent = error.message; }
          - sig: fetch(url, { method, headers, body })
            desc: 'A POST: say the method, declare JSON, and stringify the body.'
            ex: |-
              fetch("/api/notes", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text }),
              })

  - slug: sql
    name: SQL
    blurb: 'Every clause the SQL track teaches, with the shape of each.'
    groups:
      - name: Reading rows
        entries:
          - sig: SELECT cols FROM table
            desc: 'The columns you want, from the table that has them. `*` means every column.'
            ex: 'SELECT title, year FROM books;'
          - sig: SELECT DISTINCT col
            desc: 'Each value once, however many rows carry it.'
            ex: 'SELECT DISTINCT genre FROM books;'
          - sig: ORDER BY col ASC|DESC
            desc: 'Sorts the results. `DESC` for largest first; sort text alphabetically the same way.'
            ex: 'ORDER BY pages DESC'
          - sig: LIMIT n
            desc: 'Only the first `n` rows of the sorted result.'
            ex: 'ORDER BY year LIMIT 3'
      - name: Filtering
        entries:
          - sig: WHERE condition
            desc: 'Keeps only the rows where the condition holds. Runs before grouping.'
            ex: 'WHERE year > 1960'
          - sig: 'AND / OR / NOT'
            desc: 'Combine conditions. Parentheses when mixing, so the meaning is yours and not the parser''s.'
            ex: 'WHERE genre = ''Fiction'' AND pages > 200'
          - sig: LIKE pattern
            desc: 'Text matching: `%` is any run of characters, `_` any single one.'
            ex: 'WHERE title LIKE ''The %'''
          - sig: IN (a, b, c)
            desc: 'True when the value is any of the listed ones.'
            ex: 'WHERE genre IN (''Fantasy'', ''Fiction'')'
          - sig: BETWEEN a AND b
            desc: 'True from `a` to `b`, both ends included.'
            ex: 'WHERE year BETWEEN 1960 AND 1970'
          - sig: IS NULL / IS NOT NULL
            desc: 'The only way to test for missing values; `= NULL` never matches anything.'
            ex: 'WHERE author_id IS NOT NULL'
      - name: Aggregating
        entries:
          - sig: COUNT(*) / SUM(col) / AVG(col) / MIN(col) / MAX(col)
            desc: 'One number from many rows. `COUNT(col)` skips NULLs; `COUNT(*)` counts rows.'
            ex: 'SELECT COUNT(*), AVG(pages) FROM books;'
          - sig: GROUP BY col
            desc: 'One result row per distinct value, with aggregates computed per group.'
            ex: 'SELECT genre, COUNT(*) FROM books GROUP BY genre;'
          - sig: HAVING condition
            desc: 'A `WHERE` for the groups. Runs after grouping, so it can see the aggregates.'
            ex: 'GROUP BY genre HAVING COUNT(*) > 1'
      - name: Joining
        entries:
          - sig: JOIN t ON a.col = b.col
            desc: 'Pairs rows from two tables where the condition matches. Rows with no partner vanish.'
            ex: 'FROM books JOIN authors ON books.author_id = authors.id'
          - sig: LEFT JOIN t ON ...
            desc: 'Like JOIN, but keeps every row of the left table, with NULLs where nothing matched.'
            ex: 'FROM authors LEFT JOIN books ON books.author_id = authors.id'
      - name: Changing data
        entries:
          - sig: INSERT INTO t (cols) VALUES (vals)
            desc: 'Adds a row. Name the columns; positional inserts break when the table changes.'
            ex: 'INSERT INTO books (title, year) VALUES (''Dune'', 1965);'
          - sig: UPDATE t SET col = val WHERE ...
            desc: 'Changes matching rows. Without the WHERE it changes every row, which is rarely the plan.'
            ex: 'UPDATE books SET copies = copies - 1 WHERE id = 3;'
          - sig: DELETE FROM t WHERE ...
            desc: 'Removes matching rows. The same WHERE warning, doubled.'
            ex: 'DELETE FROM books WHERE copies = 0;'
          - sig: CREATE TABLE t (col TYPE, ...)
            desc: 'A new table. `INTEGER PRIMARY KEY` numbers rows for you in SQLite.'
            ex: 'CREATE TABLE notes (id INTEGER PRIMARY KEY, text TEXT);'

  - slug: html
    name: HTML
    blurb: 'The tags the HTML track builds pages from.'
    groups:
      - name: Text
        entries:
          - sig: <h1> to <h6>
            desc: 'Headings, biggest to smallest. One `h1` per page; do not skip levels for looks.'
            ex: '<h2>Chapter Two</h2>'
          - sig: <p>
            desc: 'A paragraph. The default home for prose.'
            ex: '<p>Twelve walks within an hour of town.</p>'
          - sig: <strong> and <em>
            desc: 'Importance and emphasis. Styling comes from CSS; these carry meaning.'
            ex: '<p>This is <strong>required</strong>.</p>'
      - name: Links and media
        entries:
          - sig: <a href="...">
            desc: 'A link. `href` is where it goes; the text is what people click.'
            ex: '<a href="/gear">See the gear list</a>'
          - sig: <img src="..." alt="...">
            desc: 'An image. `alt` describes it for anyone who cannot see it, and is not optional in spirit.'
            ex: '<img src="trail.jpg" alt="A forest path at dawn">'
      - name: Lists and tables
        entries:
          - sig: <ul> / <ol> with <li>
            desc: 'Bulleted or numbered lists; each item is an `li`.'
            ex: '<ul><li>Loops</li><li>Strings</li></ul>'
          - sig: <table> with <tr>, <th>, <td>
            desc: 'Rows of cells: `tr` per row, `th` for headers, `td` for data.'
            ex: '<tr><th>Name</th><th>Score</th></tr>'
      - name: Forms
        entries:
          - sig: <form>
            desc: 'Wraps controls; submitting fires the `submit` event (and reloads unless JavaScript prevents it).'
            ex: '<form id="add-form">...</form>'
          - sig: <input type="...">
            desc: '`text`, `number`, `checkbox`, `password` and more, chosen by `type`.'
            ex: '<input type="text" id="name" placeholder="Name">'
          - sig: <label for="id">
            desc: 'Names a control; clicking the label focuses it. `for` matches the input''s `id`.'
            ex: '<label for="name">Your name</label>'
          - sig: <button>
            desc: 'A button. Inside a form its default type is `submit`, which surprises people.'
            ex: '<button type="submit">Add</button>'
          - sig: <select> with <option>
            desc: 'A dropdown; each choice is an `option`.'
            ex: '<select><option>Small</option><option>Large</option></select>'
      - name: Structure
        entries:
          - sig: <header>, <nav>, <main>, <footer>
            desc: 'The page''s landmark regions. One `main` per page.'
            ex: '<main><section class="info">...</section></main>'
          - sig: <section> and <article>
            desc: 'A themed grouping, and a self-contained piece that would make sense on its own.'
            ex: '<section class="card">...</section>'
          - sig: <div> and <span>
            desc: 'Meaningless boxes, block and inline, for when no semantic tag fits. Style hooks, mostly.'
            ex: '<div class="row">...</div>'
          - sig: class and id
            desc: '`class` groups many elements for styling; `id` names exactly one, for CSS or JavaScript.'
            ex: '<ul id="board" class="menu">'

  - slug: css
    name: CSS
    blurb: 'Selectors and the properties the styling levels grade on.'
    groups:
      - name: Selectors
        entries:
          - sig: element, .class, "#id"
            desc: 'By tag name, by class, by id. Classes are the everyday one.'
            ex: '.card { ... }'
          - sig: A B (descendant)
            desc: 'Any `B` anywhere inside an `A`.'
            ex: '.info ul { list-style-type: square; }'
          - sig: 'A:hover and li:first-child'
            desc: 'Pseudo-classes: state (`hover`, `focus`) and position (`first-child`, `nth-child(2)`).'
            ex: 'a:hover { color: #2f6f4f; }'
      - name: Text
        entries:
          - sig: 'font-size / font-weight / font-family'
            desc: 'Size in `px` or `rem`, weight from `400` (normal) to `700` (bold), and the typeface stack.'
            ex: 'h1 { font-size: 32px; font-weight: 700; }'
          - sig: 'text-align'
            desc: '`left`, `center`, or `right`, applied to the block the text lives in.'
            ex: 'h1 { text-align: center; }'
          - sig: 'line-height'
            desc: 'Space between lines. A unitless number like `1.5` scales with the font.'
            ex: 'p { line-height: 1.6; }'
      - name: Color and background
        entries:
          - sig: 'color / background-color'
            desc: 'Text colour and the box behind it. Hex like `#2f6f4f` or `rgb(...)`.'
            ex: '.info { background-color: #f4f1ea; }'
      - name: The box
        entries:
          - sig: 'padding / margin'
            desc: 'Space inside the border, and space outside it. One value for all sides, or top right bottom left.'
            ex: '.card { padding: 16px; margin: 8px 0; }'
          - sig: 'border / border-radius'
            desc: 'The edge line (`width style color`) and how rounded its corners are.'
            ex: '.card { border: 1px solid #ccc; border-radius: 8px; }'
          - sig: 'width / max-width'
            desc: 'A fixed width, or a ceiling that still lets the box shrink on small screens.'
            ex: '.page { max-width: 600px; }'
      - name: Layout
        entries:
          - sig: 'display: flex'
            desc: 'The parent lays its children out in a row. The parent owns the layout, not the children.'
            ex: '.row { display: flex; gap: 16px; }'
          - sig: 'justify-content / align-items'
            desc: 'Where flex children sit along the row, and how they line up across it.'
            ex: '.row { justify-content: space-between; align-items: center; }'
          - sig: 'flex-direction: column'
            desc: 'The same flex, stacked vertically instead.'
            ex: '.stack { display: flex; flex-direction: column; }'
          - sig: 'gap'
            desc: 'Space between flex or grid children, without margins on the children themselves.'
            ex: 'gap: 16px;'
          - sig: 'display: none'
            desc: 'The element is gone from layout entirely, not just invisible.'
            ex: '.hidden { display: none; }'

guides:
  - slug: install-python
    name: Install Python on your own computer
    blurb: 'Kodetika runs Python in your browser. Here is the step to your own machine.'
    body: |
      Everything you have written here runs the same way on a real install. The
      only new ideas are the terminal and files.

      **Windows**

      1. Download the installer from `python.org/downloads` and run it.
      2. Tick **Add python.exe to PATH** on the first screen. This is the step everyone misses, and it is what makes the `python` command work.
      3. Open PowerShell and check: `python --version`.

      **Mac**

      1. Download from `python.org/downloads` and run the installer, or `brew install python` if you use Homebrew.
      2. Open Terminal and check: `python3 --version`. On a Mac the command is `python3`.

      **Run your first file**

      1. Make a file called `hello.py` containing any level solution you are proud of.
      2. In the terminal, in the same folder: `python hello.py` (or `python3 hello.py` on a Mac).

      **Installing packages**

      `pip install requests` fetches a library from the Python Package Index.
      The standard library you used here (`math`, `random`, `sqlite3`) needs no
      installing; it came with Python.

      The official tutorial lives at `docs.python.org/3/tutorial` and is worth
      an evening once the basics feel comfortable.
  - slug: run-javascript
    name: Run JavaScript outside the browser
    blurb: 'Two homes for JavaScript: the page you already know, and Node.'
    body: |
      **In any browser, right now**

      Press `F12` (or right-click and Inspect) and open the **Console** tab.
      That is a JavaScript prompt wired to the page you are looking at. Try
      `document.querySelector("h1").textContent` on any site.

      **On your machine with Node**

      1. Install the LTS version from `nodejs.org`, clicking through the defaults.
      2. Open a terminal and check: `node --version`.
      3. Put some code in `app.js` and run it: `node app.js`.

      Node has no `document` and no pages; it is JavaScript for servers and
      tools. Everything about strings, arrays, objects and `async` works
      exactly as it did here.

      The reference the whole industry uses is MDN, at `developer.mozilla.org`.
      Searching any method name with "mdn" in front is the fastest way in.
  - slug: sql-locally
    name: Use SQLite on your own computer
    blurb: 'The database in the SQL track is SQLite, and it runs anywhere.'
    body: |
      Every query you wrote here ran on a real SQLite database built in your
      browser's memory. The same engine runs as a single small program with no
      server to set up.

      **The friendly way**

      Download **DB Browser for SQLite** from `sqlitebrowser.org`. It opens a
      window where you can create a database file, make tables, and run the
      exact queries from the track in an editor.

      **The terminal way**

      1. On Windows, download the `sqlite-tools` zip from `sqlite.org/download.html` and unzip it; on a Mac, `sqlite3` is already installed.
      2. Run `sqlite3 library.db` to open (or create) a database file.
      3. Type SQL ending in `;` and it runs. `.tables` lists tables, `.quit` leaves.

      A database in a file behaves exactly like the one in the track, except it
      is still there tomorrow.
  - slug: code-editor
    name: A real code editor
    blurb: 'The editor here is CodeMirror in a page. On your machine, use VS Code.'
    body: |
      1. Install **Visual Studio Code** from `code.visualstudio.com`.
      2. Open a folder, not a file: `File > Open Folder`. Everything in an editor works per-project.
      3. Install the **Python** extension (by Microsoft) from the Extensions panel for Python work; JavaScript needs nothing extra.
      4. Open a terminal inside the editor with `` Ctrl+` `` and run files exactly as the install guides describe.

      Two habits worth importing from Kodetika: keep solutions short, and read
      the error message before touching the code. The red underlines here were
      training for the same underlines there.
