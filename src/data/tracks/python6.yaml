      - name: Pointer Coordinates
        game: true
        obj: '`pygame.mouse.get_pos()` returns the pointer position as an `(x, y)` pair expressed in surface coordinates. Reading it once per frame is enough to track the pointer continuously. GOAL: bind the marker to the pointer by assigning `mx, my = pygame.mouse.get_pos()`.'
        hint: 'Replace the fixed assignment with a call to `pygame.mouse.get_pos()`, then move the pointer over the game.'
        checks:
          has: ['get_pos\(\)']
          msg: 'Not yet. Read the pointer with pygame.mouse.get_pos().'
        start: |-
