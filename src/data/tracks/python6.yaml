      - name: Intersection Tests
        game: true
        obj: 'Two axis-aligned rectangles intersect when they overlap on both axes simultaneously. `a.colliderect(b)` performs that test and returns a boolean. GOAL: assign `touching = player.colliderect(target)` so the target reacts when the two meet. Move the player with the arrow keys to verify.'
        hint: 'Replace the constant `False` with the call `player.colliderect(target)`.'
        checks:
          has: ['colliderect']
          msg: 'Not yet. Use player.colliderect(target) to test for overlap.'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Intersection Tests")

              player = pygame.Rect(60, 140, 50, 50)
              target = pygame.Rect(300, 130, 70, 70)
              running = True

              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  keys = pygame.key.get_pressed()
                  if keys[pygame.K_LEFT]:
                      player.x -= 5
                  if keys[pygame.K_RIGHT]:
                      player.x += 5
                  if keys[pygame.K_UP]:
                      player.y -= 5
                  if keys[pygame.K_DOWN]:
                      player.y += 5

