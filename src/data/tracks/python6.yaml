      - name: Velocity Components
        game: true
        obj: 'Introduce a vertical component by setting `dx, dy = 3, 2`.'
        expl: 'Velocity separates into independent components: `dx` along the horizontal axis and `dy` along the vertical. Applying both on each frame produces diagonal motion, and the two are updated separately.'
        hint: 'The body currently has `dy = 0`, so it never moves vertically.'
        checks:
          has: ['dx,\s*dy\s*=\s*3,\s*2']
          msg: 'Not yet. Set dx, dy = 3, 2.'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Velocity Components")

              x, y = 60, 60
              dx, dy = 3, 0
              running = True

              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  x += dx
                  y += dy
                  if x > 500:
                      x, y = -20, 60

                  screen.fill((25, 25, 35))
                  pygame.draw.circle(screen, (120, 200, 200), (x, y), 18)
                  pygame.display.flip()

