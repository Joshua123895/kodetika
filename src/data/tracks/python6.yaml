      - name: Collision Response
        game: true
        obj: 'Detection is only half of a collision; the response defines what follows it. Reversing the vertical component on contact makes the ball rebound from the paddle rather than passing through it. GOAL: negate `by` when the ball meets the paddle. Move the paddle with the left and right arrow keys.'
        hint: 'The contact test is already written. Replace `pass` with `by = -by`.'
        checks:
          has: ['colliderect\(paddle\):\s*by\s*=\s*-by']
          msg: 'Not yet. Inside the "if ball.colliderect(paddle):" branch, replace pass with by = -by.'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Collision Response")

              paddle = pygame.Rect(200, 290, 90, 14)
              ball = pygame.Rect(236, 40, 14, 14)
              bx, by = 3, 3
              running = True

              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  keys = pygame.key.get_pressed()
                  if keys[pygame.K_LEFT]:
                      paddle.x -= 6
                  if keys[pygame.K_RIGHT]:
                      paddle.x += 6
                  paddle.left = max(0, paddle.left)
                  paddle.right = min(480, paddle.right)

                  ball.x += bx
                  ball.y += by
                  if ball.left < 0 or ball.right > 480:
                      bx = -bx
                  if ball.top < 0:
                      by = -by
                  if ball.colliderect(paddle):
                      pass
                  if ball.top > 320:
                      ball.x, ball.y = 236, 40
                      by = 3

                  screen.fill((18, 18, 26))
                  pygame.draw.rect(screen, (90, 200, 130), paddle)
                  pygame.draw.rect(screen, (240, 240, 240), ball)
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
