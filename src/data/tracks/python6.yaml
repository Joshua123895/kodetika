name: Game Development
slug: game-dev
icon: game
desc: 'A structured introduction to real-time graphics programming in Python. Each level isolates a single concept, from the display surface and coordinate geometry through motion, input, and collision, culminating in three complete games.'
difficulty: 3
chapters:
  - name: Display Fundamentals
    icon: output
    levels:
      - name: The Display Surface
        game: true
        obj: 'Change the surface color to `(240, 140, 60)`.'
        expl: '`pygame` is a library: a collection of ready-made tools for drawing, input, and timing. `pygame.init()` prepares those tools. `pygame.display.set_mode((480, 320))` creates the drawing surface, 480 pixels wide and 320 tall, and hands it back as `screen`. `screen.fill(...)` paints every pixel of that surface a single color, and `pygame.display.flip()` presents the finished result. Six lines is a complete pygame program.'
        hint: 'The color is the one argument to `screen.fill(...)`, written as three numbers inside parentheses.'
        checks:
          has: ['240,\s*140,\s*60']
          msg: 'Not yet. Set the argument of screen.fill to (240, 140, 60).'
        start: |-
          import pygame

          pygame.init()
          screen = pygame.display.set_mode((480, 320))

          screen.fill((90, 160, 230))
          pygame.display.flip()
      - name: Color Channels
        game: true
        obj: 'Make the surface pure blue, using no red, no green, and full blue: `(0, 0, 255)`.'
        expl: 'A color is three numbers: the amount of red, green, and blue light, each from 0 (none) to 255 (full). Equal amounts of all three produce gray, which is why `(150, 150, 150)` looks colorless. Raising one channel above the others tints the result toward that color.'
        hint: 'The order is always (red, green, blue). Pure blue is (0, 0, 255).'
        checks:
          has: ['0,\s*0,\s*255']
          msg: 'Not yet. Pure blue is (0, 0, 255): no red, no green, full blue.'
        start: |-
          import pygame

          pygame.init()
          screen = pygame.display.set_mode((480, 320))

          screen.fill((150, 150, 150))
          pygame.display.flip()
      - name: The Coordinate Plane
        game: true
        obj: 'Move the marker from the upper-left region to `(360, 240)`, which lies below and to the right of the center.'
        expl: 'Every position on the surface is a pair `(x, y)` counted in pixels from the top-left corner. `x` increases to the right and `y` increases downward, which is the opposite of the vertical axis used in mathematics. The faint lines below cross at the middle of this 480 by 320 surface.'
        hint: 'The pair `(100, 80)` is the marker''s center. Increase x to move right, and increase y to move down.'
        checks:
          has: ['360,\s*240']
          msg: 'Not yet. The marker center should be (360, 240).'
        start: |-
          import pygame

          pygame.init()
          screen = pygame.display.set_mode((480, 320))

          screen.fill((24, 26, 34))
          pygame.draw.line(screen, (60, 66, 84), (0, 160), (480, 160), 1)
          pygame.draw.line(screen, (60, 66, 84), (240, 0), (240, 320), 1)
          pygame.draw.circle(screen, (120, 200, 140), (100, 80), 16)
          pygame.display.flip()
      - name: Functions and Execution
        game: true
        obj: 'Start `main` by adding `asyncio.run(main())` as the final line of the program.'
        expl: 'Defining a function does not run it. `async def main():` defines a function that is permitted to pause partway through, and `await asyncio.sleep(...)` is such a pause: it briefly returns control to the browser so the page can update instead of freezing. The surface stays blank below because `main` is defined but never started.'
        hint: 'Add the call at the very bottom with no indentation, so it runs after the function has been defined.'
        checks:
          has: ['asyncio\.run\(main\(\)\)']
          msg: 'Not yet. Add asyncio.run(main()) as the last line, with no indentation.'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))

              screen.fill((70, 140, 110))
              pygame.draw.circle(screen, (240, 220, 120), (240, 160), 60)
              pygame.display.flip()

              await asyncio.sleep(1 / 60)
      - name: The Frame Loop
        game: true
        obj: 'Slow the animation by pausing for `1 / 15` of a second instead of `1 / 60`.'
        expl: 'A game does not draw once; it redraws continuously. `while running:` repeats the block beneath it, and each pass produces one frame. The closing `await asyncio.sleep(1 / 60)` pauses so the browser can show that frame and stay responsive, which also sets the pace: a shorter pause means more frames each second. The disc grows because `frame` increases on every pass.'
        hint: 'Only the number inside `await asyncio.sleep(1 / 60)` needs to change.'
        checks:
          has: ['1\s*/\s*15']
          msg: 'Not yet. Change the pause to await asyncio.sleep(1 / 15).'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))

              frame = 0
              running = True
              while running:
                  frame += 1
                  radius = 30 + (frame % 60)

                  screen.fill((26, 28, 38))
                  pygame.draw.circle(screen, (240, 200, 90), (240, 160), radius)
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
      - name: The Event Queue
        game: true
        obj: 'End the loop on `QUIT` by setting `running = False`.'
        expl: 'Key presses, pointer movement, and the window''s close button all arrive as events waiting in a queue. `pygame.event.get()` empties that queue and returns what it held, and the `for` loop inspects each item in turn. `pygame.QUIT` is the event sent when the window is closed. The branch that receives it currently does nothing, so the loop would carry on regardless.'
        hint: 'Replace `pass` with the assignment. Once `running` is no longer true, `while running:` stops repeating.'
        checks:
          has: ['running\s*=\s*False']
          msg: 'Not yet. Inside the QUIT branch, replace pass with running = False.'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))

              running = True
              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          pass

                  screen.fill((22, 26, 34))
                  pygame.draw.circle(screen, (140, 200, 240), (240, 160), 50)
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
      - name: The Standard Template
        game: true
        obj: 'Name this window `My First Game`.'
        expl: 'Every remaining level in this track opens with the same skeleton, now assembled in full: import, initialize, create the surface, name the window, then loop — handle events, clear, draw, present, pause. `pygame.display.set_caption(...)` sets the text shown above the surface. Read it once as a whole; from here on it is scaffolding you can rely on.'
        hint: 'Pass the title as a string to `pygame.display.set_caption(...)`, keeping the quotation marks.'
        checks:
          has: ['My First Game']
          msg: 'Not yet. Set the caption to "My First Game", keeping the quotation marks.'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Untitled")

              running = True
              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  screen.fill((26, 30, 42))
                  pygame.draw.circle(screen, (250, 210, 120), (240, 160), 64)
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
