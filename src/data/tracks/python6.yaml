        game: true
        obj: 'Two paddles, a ball, and a score, assembled from the preceding chapters. The left paddle is controlled with `W` and `S`; the right paddle tracks the ball automatically. The ball reflects off the paddles and the horizontal boundaries, and a point is awarded when it passes an edge. GOAL: raise the initial ball velocity to `bx, by = 6, 5`.'
