      - name: Discrete Key Events
        game: true
        obj: 'Polling held keys is unsuitable for actions that must occur exactly once per press. The event queue reports a `KEYDOWN` at the instant a key descends, which makes it the correct source for discrete actions such as a jump. The branch below is reached but does nothing. GOAL: on `K_SPACE`, set `dy = -12` and set `on_ground` to `False`.'
        hint: 'Replace `pass` with the two assignments. The `on_ground` flag prevents jumping again in mid-air.'
        checks:
          has: ['dy\s*=\s*-12']
          msg: 'Not yet. In the KEYDOWN branch, set dy = -12.'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Discrete Key Events")

              y = 250
              dy = 0
              on_ground = True
              running = True

              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False
                      if event.type == pygame.KEYDOWN and event.key == pygame.K_SPACE and on_ground:
                          pass

                  dy += 0.6
                  y += dy
                  if y >= 250:
                      y = 250
                      dy = 0
                      on_ground = True

                  screen.fill((22, 26, 34))
                  pygame.draw.rect(screen, (60, 60, 80), (0, 290, 480, 30))
                  pygame.draw.rect(screen, (240, 200, 90), (220, int(y), 40, 40))
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
  - name: Collision Geometry
    icon: object
    levels:
      - name: Rectangle Objects
        game: true
        obj: 'A `pygame.Rect` stores position and size as a single object and exposes derived edges such as `.left`, `.right`, `.top`, and `.centerx`. It can be drawn directly and repositioned by assigning to `.x` or `.y`. GOAL: redefine the body as `pygame.Rect(200, 130, 100, 100)`.'
        hint: 'The constructor takes `(x, y, width, height)`, the same four values as a plain tuple.'
        checks:
          has: ['Rect\(200,\s*130,\s*100,\s*100\)']
          msg: 'Not yet. Construct pygame.Rect(200, 130, 100, 100).'
        start: |-
