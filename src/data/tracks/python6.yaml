      - name: Breakout
        game: true
        obj: 'A field of bricks is generated by a nested loop, one iteration per row and column. Each contact removes the struck brick from the list and reflects the ball, so the collection shrinks as play proceeds and the level ends when it is empty. GOAL: deepen the field to six rows by changing the outer loop to `range(6)`.'
        hint: 'The outer loop currently reads `for row in range(4):`.'
        checks:
          has: ['range\(6\)']
          msg: 'Not yet. Change the outer loop to range(6).'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Breakout")
              font = pygame.font.SysFont(None, 28)

              paddle = pygame.Rect(200, 300, 80, 12)
              ball = pygame.Rect(236, 200, 12, 12)
              bx, by = 3, -3

              bricks = []
              for row in range(4):
                  for col in range(8):
                      bricks.append(pygame.Rect(10 + col * 58, 30 + row * 24, 50, 16))

              won = False
              running = True

              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  keys = pygame.key.get_pressed()
                  if keys[pygame.K_LEFT]:
                      paddle.x -= 6
                  if keys[pygame.K_RIGHT]:
                      paddle.x += 6
                  paddle.left = max(0, paddle.left)
                  paddle.right = min(480, paddle.right)

                  if not won:
                      ball.x += bx
                      ball.y += by
                      if ball.left < 0 or ball.right > 480:
                          bx = -bx
                      if ball.top < 0:
                          by = -by
                      if ball.colliderect(paddle) and by > 0:
                          by = -by

                      hit = -1
                      for i in range(len(bricks)):
                          if ball.colliderect(bricks[i]):
                              hit = i
                              break
                      if hit >= 0:
                          bricks.pop(hit)
                          by = -by

                      if ball.top > 320:
                          ball.x, ball.y = 236, 200
                          bx, by = 3, -3
                      if len(bricks) == 0:
                          won = True

                  screen.fill((18, 18, 26))
                  for b in bricks:
                      pygame.draw.rect(screen, (230, 150, 70), b)
                  pygame.draw.rect(screen, (90, 200, 130), paddle)
                  pygame.draw.rect(screen, (240, 240, 240), ball)
                  if won:
                      label = font.render("Field cleared", True, (240, 240, 120))
                      screen.blit(label, (160, 150))
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
      - name: Snake
        game: true
        obj: 'The snake is a list of grid cells. Each move inserts a new head and removes the tail, which advances the body without redrawing it cell by cell; when food is consumed the tail is retained instead, so the body lengthens. Movement is quantized to a fixed interval rather than applied every frame. GOAL: double the movement rate by advancing when `frame % 4 == 0`.'
        hint: 'The interval is the modulus in `if not dead and frame % 8 == 0:`.'
        checks:
          has: ['frame\s*%\s*4\s*==\s*0']
          msg: 'Not yet. Change the movement interval to frame % 4 == 0.'
        start: |-
          import asyncio
          import random
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Snake")
              font = pygame.font.SysFont(None, 28)

              cell = 20
              cols, rows = 24, 16

              def reset():
                  return [(12, 8), (11, 8), (10, 8)], 1, 0, (16, 8), 0

              snake, dx, dy, food, score = reset()
              dead = False
              frame = 0
              running = True

              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False
                      if event.type == pygame.KEYDOWN:
                          if event.key == pygame.K_LEFT and dx != 1:
                              dx, dy = -1, 0
                          elif event.key == pygame.K_RIGHT and dx != -1:
                              dx, dy = 1, 0
                          elif event.key == pygame.K_UP and dy != 1:
                              dx, dy = 0, -1
                          elif event.key == pygame.K_DOWN and dy != -1:
                              dx, dy = 0, 1

                  keys = pygame.key.get_pressed()
                  if dead and keys[pygame.K_r]:
                      snake, dx, dy, food, score = reset()
                      dead = False

                  frame += 1
                  if not dead and frame % 8 == 0:
                      head = (snake[0][0] + dx, snake[0][1] + dy)
                      if (head[0] < 0 or head[0] >= cols or head[1] < 0
                              or head[1] >= rows or head in snake):
                          dead = True
                      else:
                          snake.insert(0, head)
                          if head == food:
                              score += 1
                              food = (random.randint(0, cols - 1), random.randint(0, rows - 1))
                          else:
                              snake.pop()

                  screen.fill((16, 20, 16))
                  pygame.draw.rect(screen, (230, 90, 90),
                                   (food[0] * cell, food[1] * cell, cell, cell))
                  for part in snake:
                      pygame.draw.rect(screen, (110, 210, 120),
                                       (part[0] * cell, part[1] * cell, cell - 2, cell - 2))
                  label = font.render("Score: " + str(score), True, (235, 235, 235))
                  screen.blit(label, (10, 8))
                  if dead:
                      over = font.render("Game Over - press R", True, (240, 200, 120))
                      screen.blit(over, (140, 150))
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
