        expl: 'The surface keeps whatever has been drawn on it. Because this loop never erases, the disc from every frame stays behind and the motion smears into a trail. Clearing at the start of each frame is what makes the previous one disappear. Trails are occasionally wanted, but a game almost always clears first.'
        hint: 'The fill belongs inside the loop, immediately before the drawing call.'
        checks:
          has: ['screen\.fill']
          msg: 'Not yet. Call screen.fill((25, 25, 35)) inside the loop, before drawing the circle.'
