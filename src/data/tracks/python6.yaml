  - name: Frame-Based Motion
    icon: move
    levels:
      - name: Position Increments
        game: true
        obj: 'Motion is the accumulation of small changes. Adding a constant to a coordinate on every frame produces apparent movement, and the magnitude of that constant determines the speed. GOAL: raise the horizontal increment to `8`.'
        hint: 'The statement `x += 3` advances the body by three pixels per frame.'
        checks:
          has: ['x\s*\+=\s*8']
          msg: 'Not yet. Change x += 3 to x += 8.'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Position Increments")

              x = 40
              running = True
              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  x += 3
                  if x > 500:
                      x = -20

                  screen.fill((25, 25, 35))
                  pygame.draw.circle(screen, (120, 200, 120), (x, 160), 20)
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
      - name: Velocity Components
        game: true
        obj: 'Velocity separates into independent components: `dx` along the horizontal axis and `dy` along the vertical. Applying both on each frame produces diagonal motion, and the two are updated separately. GOAL: introduce a vertical component by setting `dx, dy = 3, 2`.'
        hint: 'The body currently has `dy = 0`, so it never moves vertically.'
        checks:
          has: ['dx,\s*dy\s*=\s*3,\s*2']
          msg: 'Not yet. Set dx, dy = 3, 2.'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Velocity Components")

              x, y = 60, 60
              dx, dy = 3, 0
              running = True

              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  x += dx
                  y += dy
                  if x > 500:
                      x, y = -20, 60

                  screen.fill((25, 25, 35))
                  pygame.draw.circle(screen, (120, 200, 200), (x, y), 18)
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
      - name: Boundary Reflection
        game: true
        obj: 'A reflection reverses one velocity component and leaves the other unchanged. This body already reflects off the left and right walls but escapes through the floor and ceiling, because only `dx` is negated. GOAL: complete the reflection by negating `dy` when the body meets a horizontal boundary.'
        hint: 'The vertical branch is already written but does nothing. Replace `pass` with `dy = -dy`.'
        checks:
          has: ['dy\s*=\s*-dy']
          msg: 'Not yet. Inside the vertical branch, replace pass with dy = -dy.'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Boundary Reflection")

              x, y = 240, 160
              dx, dy = 3, 2
              radius = 24
              running = True

              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  x += dx
                  y += dy
                  if x - radius < 0 or x + radius > 480:
                      dx = -dx
                  if y - radius < 0 or y + radius > 320:
                      pass

                  screen.fill((25, 25, 35))
                  pygame.draw.circle(screen, (120, 200, 120), (x, y), radius)
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
      - name: Constant Acceleration
        game: true
        obj: 'Acceleration is a change in velocity rather than in position. Adding a small constant to `dy` on every frame makes the descent progressively faster, which the eye reads as gravity. The body below falls at a fixed rate and therefore looks weightless. GOAL: apply gravity with `dy += 0.5` before the position is updated.'
        hint: 'Add the acceleration statement immediately above `y += dy`.'
        checks:
          has: ['dy\s*\+=\s*0\.5']
          msg: 'Not yet. Add dy += 0.5 before the position update.'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Constant Acceleration")

              y = 40
              dy = 2
              running = True

              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  y += dy
                  if y > 296:
                      y = 296
                      dy = -dy * 0.8

                  screen.fill((25, 25, 35))
                  pygame.draw.rect(screen, (60, 60, 80), (0, 300, 480, 20))
                  pygame.draw.circle(screen, (240, 180, 90), (240, int(y)), 24)
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
  - name: Input Handling
    icon: mechanism
    levels:
      - name: Continuous Key State
        game: true
        obj: '`pygame.key.get_pressed()` reports which keys are held at this instant, so testing it every frame yields smooth, sustained movement. The horizontal axis is already handled below. GOAL: extend control to the vertical axis using `pygame.K_UP` and `pygame.K_DOWN`.'
        hint: 'Mirror the two existing branches. Subtract from `y` for `K_UP` and add to `y` for `K_DOWN`, since y increases downward.'
        checks:
          has: ['K_UP', 'K_DOWN']
          msg: 'Not yet. Add branches for pygame.K_UP and pygame.K_DOWN.'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Continuous Key State")

              x, y = 220, 140
              speed = 5
              running = True

              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  keys = pygame.key.get_pressed()
                  if keys[pygame.K_LEFT]:
                      x -= speed
                  if keys[pygame.K_RIGHT]:
                      x += speed

                  screen.fill((20, 20, 30))
                  pygame.draw.rect(screen, (90, 180, 240), (x, y, 40, 40))
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
