                      pygame.draw.rect(screen, (240, 200, 90), target)
                  else:
                      pygame.draw.rect(screen, (90, 110, 140), target)
                  pygame.draw.rect(screen, (110, 200, 240), player)
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


