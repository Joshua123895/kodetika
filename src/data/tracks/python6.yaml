      - name: Damping
        game: true
        obj: 'Damp the bounce so it keeps only 80 percent of the speed: `dy = -dy * 0.8`.'
        expl: 'The bounce below is perfectly elastic: it returns exactly the speed it arrived with, so the body rises to the same height forever. Real objects lose energy on impact. Multiplying the reflected speed by a factor below one, known as the coefficient of restitution, makes each bounce lower than the last until the body settles.'
