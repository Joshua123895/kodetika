name: Game Development
slug: game-dev
icon: game
desc: 'A structured introduction to real-time graphics programming in Python. Each level isolates a single concept, from the display surface and coordinate geometry through motion, input, and collision, culminating in three complete games.'
difficulty: 3
chapters:
  - name: Display Fundamentals
    icon: output
    levels:
      - name: The Game Loop
        game: true
        obj: 'A game is a loop that repeats roughly sixty times per second. Each pass clears the surface, draws one frame, and presents it with `pygame.display.flip()`. Nothing persists between frames: what you see is redrawn continuously. GOAL: set the surface color to `(240, 140, 60)`, then click "Check Goal".'
        hint: 'The color is the argument to `screen.fill(...)`. It is a tuple of three integers.'
        checks:
          has: ['240,\s*140,\s*60']
          msg: 'Not yet. Set the argument of screen.fill to (240, 140, 60).'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("The Game Loop")

              running = True
              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  screen.fill((90, 160, 230))
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
      - name: Color Channels
        game: true
        obj: 'Color is expressed as three channels, red, green, and blue, each an integer from 0 to 255. Full red combined with high green and no blue yields yellow. GOAL: set the disc to `(255, 220, 0)`.'
        hint: 'Order is always (red, green, blue). Zero means none of that channel; 255 means the maximum.'
        checks:
          has: ['255,\s*220,\s*0']
          msg: 'Not yet. The disc color should be (255, 220, 0).'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Color Channels")

              running = True
              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  screen.fill((30, 34, 48))
                  pygame.draw.circle(screen, (150, 150, 150), (240, 160), 70)
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
      - name: The Coordinate Plane
        game: true
        obj: 'The surface is measured in pixels from its top-left corner. The horizontal axis `x` increases to the right, and the vertical axis `y` increases downward, the opposite of the convention used in mathematics. This surface is 480 wide and 320 tall. GOAL: move the marker to `(360, 240)`, in the lower-right region.'
        hint: 'The pair `(100, 80)` is the center of the circle. A larger y value moves it further down the surface.'
        checks:
          has: ['360,\s*240']
          msg: 'Not yet. The circle center should be (360, 240).'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("The Coordinate Plane")

              running = True
              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  screen.fill((24, 26, 34))
                  pygame.draw.line(screen, (60, 66, 84), (0, 160), (480, 160), 1)
                  pygame.draw.line(screen, (60, 66, 84), (240, 0), (240, 320), 1)
                  pygame.draw.circle(screen, (120, 200, 140), (100, 80), 16)
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
