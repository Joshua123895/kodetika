  - name: Frame-Based Motion
    icon: move
    levels:
      - name: Position Increments
        game: true
        obj: 'Raise the horizontal increment to `8`.'
        expl: 'Motion is the accumulation of small changes. Adding a constant to a coordinate on every frame produces apparent movement, and the magnitude of that constant determines the speed.'
        hint: 'The statement `x += 3` advances the body by three pixels per frame.'
        checks:
          has: ['x\s*\+=\s*8']
          msg: 'Not yet. Change x += 3 to x += 8.'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Position Increments")

              x = 40
              running = True
              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  x += 3
                  if x > 500:
                      x = -20

                  screen.fill((25, 25, 35))
                  pygame.draw.circle(screen, (120, 200, 120), (x, 160), 20)
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
