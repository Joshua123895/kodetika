name: Game Development
slug: game-dev
icon: game
desc: 'Make real games in Python, from your very first window to complete builds of Pong, Breakout, and Snake. Every level teaches one new idea and runs live in your browser, no setup required.'
difficulty: 2
chapters:
  - name: Drawing
    icon: draw
    levels:
      - name: Hello Window
        game: true
        obj: 'GOAL: paint the window sunset orange. Click "Run Game" to see it now (sky blue), then change the color inside `screen.fill(...)` to `(240, 140, 60)` and click "Check Goal". Colors are (red, green, blue), each from 0 to 255.'
        checks:
          has: ['240,\s*140,\s*60']
          msg: 'Not yet! Change the screen.fill color to (240, 140, 60) for a sunset sky, then Check again.'
        hint: 'Colors are three numbers: (red, green, blue). Each goes from 0 (none) to 255 (lots). (255, 0, 0) is bright red.'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Hello Window")

              running = True
              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  screen.fill((90, 160, 230))   # try your own color!
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
      - name: Draw a Circle
        game: true
        obj: 'GOAL: make the sun bigger. The last number in `pygame.draw.circle(...)` is the radius (now 60). Change it to `100`, then click "Check Goal".'
        checks:
          has: ['\),\s*100\)']
          msg: 'Not yet! Change the circle radius (the last number) to 100.'
        hint: 'x goes left (small) to right (big). y goes top (small) to bottom (big). The radius is how far the edge is from the middle.'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Draw a Circle")

              running = True
              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  screen.fill((30, 30, 40))
                  pygame.draw.circle(screen, (255, 210, 80), (240, 160), 60)
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
      - name: Draw a Rectangle
        game: true
        obj: 'GOAL: turn the rectangle into a tall doorway. The size part is `(x, y, width, height)`. Change it to `(180, 110, 80, 200)` so it is 80 wide and 200 tall, then click "Check Goal".'
        checks:
          has: ['180,\s*110,\s*80,\s*200']
          msg: 'Not yet! Set the rectangle to (180, 110, 80, 200).'
        hint: 'The first two numbers are the top-left corner. The last two are the size (how wide, how tall).'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Draw a Rectangle")

              running = True
              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  screen.fill((30, 30, 40))
                  pygame.draw.rect(screen, (250, 120, 120), (180, 110, 120, 100))
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
      - name: Draw a Face
        game: true
        obj: 'GOAL: give the face a nose. Add one more `pygame.draw.circle(...)` line before `pygame.display.flip()`, centered at `(240, 165)`, then click "Check Goal". Shapes drawn later sit on top.'
        checks:
          has: ['240,\s*165']
          msg: 'Not yet! Add a circle at position (240, 165) for the nose.'
        hint: 'Add another `pygame.draw.circle(...)` line before `pygame.display.flip()`. Pick a pink color like (250, 150, 150).'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Draw a Face")

              running = True
              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  screen.fill((250, 240, 230))
                  pygame.draw.circle(screen, (255, 220, 120), (240, 160), 90)   # head
                  pygame.draw.circle(screen, (40, 40, 40), (210, 140), 12)      # left eye
                  pygame.draw.circle(screen, (40, 40, 40), (270, 140), 12)      # right eye
                  pygame.draw.rect(screen, (200, 80, 80), (205, 195, 70, 12))   # mouth
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
  - name: Movement
    icon: move
    levels:
      - name: Make It Move
        game: true
        obj: 'GOAL: make the ball zoom. It moves with `x += 3` each frame. Change the 3 to `8` so it slides faster, then click "Check Goal".'
        checks:
          has: ['x\s*\+=\s*8']
          msg: 'Not yet! Change x += 3 to x += 8.'
        hint: 'Because the loop runs ~60 times a second, adding 3 to `x` each time makes smooth movement. Bigger step = faster.'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Make It Move")

              x = 40
              running = True
              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  x += 3
                  if x > 500:
                      x = -20

                  screen.fill((25, 25, 35))
                  pygame.draw.circle(screen, (120, 200, 120), (x, 160), 20)
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
      - name: Bounce off the Walls
        game: true
        obj: 'GOAL: speed up the bounce. The starting speeds are `dx, dy = 3, 2`. Change them to `6, 4`, then click "Check Goal". A wall flips a speed with `dx = -dx`, that is a bounce.'
        checks:
          has: ['dx,\s*dy\s*=\s*6,\s*4']
          msg: 'Not yet! Set dx, dy = 6, 4.'
        hint: 'Flipping a speed from positive to negative (or back) reverses the direction. That is all a bounce is.'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Bounce off the Walls")

              x, y = 240, 160
              dx, dy = 3, 2
              radius = 24
              running = True

              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  x += dx
                  y += dy
                  if x - radius < 0 or x + radius > 480:
                      dx = -dx
                  if y - radius < 0 or y + radius > 320:
                      dy = -dy

                  screen.fill((25, 25, 35))
                  pygame.draw.circle(screen, (120, 200, 120), (x, y), radius)
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
      - name: Falling with Gravity
        game: true
        obj: 'GOAL: make gravity stronger. Gravity is `dy += 0.4` each frame. Change it to `dy += 0.8` so the ball falls faster, then click "Check Goal".'
        checks:
          has: ['dy\s*\+=\s*0\.8']
          msg: 'Not yet! Change the gravity to dy += 0.8.'
        hint: '`dy += 0.4` speeds up the fall. On a bounce, `dy = -dy * 0.8` flips it up but keeps only 80 percent of the speed.'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Falling with Gravity")

              y = 40
              dy = 0
              running = True

              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  dy += 0.4          # gravity
                  y += dy
                  if y > 296:
                      y = 296
                      dy = -dy * 0.8   # bounce, lose a little energy

                  screen.fill((25, 25, 35))
                  pygame.draw.circle(screen, (240, 180, 90), (240, int(y)), 24)
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
  - name: Player Controls
    icon: mechanism
    levels:
      - name: Move with Arrow Keys
        game: true
        obj: 'GOAL: make the player faster. Click the game and use the arrow keys to move. `speed` is 4. Change it to `8`, then click "Check Goal".'
        checks:
          has: ['speed\s*=\s*8\b']
          msg: 'Not yet! Set speed = 8.'
        hint: '`keys = pygame.key.get_pressed()` then check `keys[pygame.K_LEFT]`, `keys[pygame.K_RIGHT]`, `keys[pygame.K_UP]`, `keys[pygame.K_DOWN]`.'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Move with Arrow Keys")

              x, y = 220, 140
              speed = 4
              running = True

              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  keys = pygame.key.get_pressed()
                  if keys[pygame.K_LEFT]:
                      x -= speed
                  if keys[pygame.K_RIGHT]:
                      x += speed
                  if keys[pygame.K_UP]:
                      y -= speed
                  if keys[pygame.K_DOWN]:
                      y += speed

                  screen.fill((20, 20, 30))
                  pygame.draw.rect(screen, (90, 180, 240), (x, y, 40, 40))
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
      - name: Stay on Screen
        game: true
        obj: 'GOAL: shrink the play area. The square is stopped near the right edge with `min(440, x)`. Change 440 to `400` so it stops sooner, then click "Check Goal".'
        checks:
          has: ['min\(400,']
          msg: 'Not yet! Change min(440, x) to min(400, x).'
        hint: '`x = max(0, x)` never lets x go below 0. `x = min(440, x)` never lets it go past 440 (that is 480 minus the 40-wide square).'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Stay on Screen")

              x, y = 220, 140
              speed = 4
              running = True

              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  keys = pygame.key.get_pressed()
                  if keys[pygame.K_LEFT]:
                      x -= speed
                  if keys[pygame.K_RIGHT]:
                      x += speed
                  if keys[pygame.K_UP]:
                      y -= speed
                  if keys[pygame.K_DOWN]:
                      y += speed

                  x = max(0, min(440, x))
                  y = max(0, min(280, y))

                  screen.fill((20, 20, 30))
                  pygame.draw.rect(screen, (90, 180, 240), (x, y, 40, 40))
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
      - name: Follow the Mouse
        game: true
        obj: 'GOAL: make the cursor circle bigger. Its radius is 22. Change it to `40`, then click "Check Goal". Move your mouse over the game to see it follow.'
        checks:
          has: ['my\),\s*40']
          msg: 'Not yet! Change the circle radius to 40.'
        hint: '`mx, my = pygame.mouse.get_pos()` then draw your shape at `(mx, my)`.'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Follow the Mouse")

              running = True
              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  mx, my = pygame.mouse.get_pos()

                  screen.fill((28, 24, 34))
                  pygame.draw.circle(screen, (240, 160, 90), (mx, my), 22)
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
      - name: Press Space to Jump
        game: true
        obj: 'GOAL: jump higher. Pressing Space sets `dy = -11`. Change it to `dy = -16` for a bigger jump, then click "Check Goal". (Click the game, press Space to test.)'
        checks:
          has: ['dy\s*=\s*-16']
          msg: 'Not yet! Set the jump strength to dy = -16.'
        hint: 'Inside the event loop: `if event.type == pygame.KEYDOWN and event.key == pygame.K_SPACE`. Only jump when `on_ground` is True.'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Press Space to Jump")

              y = 250
              dy = 0
              on_ground = True
              running = True

              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False
                      if event.type == pygame.KEYDOWN and event.key == pygame.K_SPACE and on_ground:
                          dy = -11
                          on_ground = False

                  dy += 0.6          # gravity
                  y += dy
                  if y >= 250:
                      y = 250
                      dy = 0
                      on_ground = True

                  screen.fill((22, 26, 34))
                  pygame.draw.rect(screen, (60, 60, 80), (0, 290, 480, 30))   # ground
                  pygame.draw.rect(screen, (240, 200, 90), (220, int(y), 40, 40))
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
  - name: Collisions & Score
    icon: score
    levels:
      - name: Meet the Rectangle
        game: true
        obj: 'GOAL: make the box a big square. It is `pygame.Rect(200, 130, 80, 60)`. Change it to `pygame.Rect(200, 130, 100, 100)`, then click "Check Goal". (Arrow keys move it.)'
        checks:
          has: ['Rect\(200,\s*130,\s*100,\s*100\)']
          msg: 'Not yet! Set the box to pygame.Rect(200, 130, 100, 100).'
        hint: 'A Rect remembers `.x`, `.y`, `.width`, `.height`, and helpers like `.left`, `.right`, `.centerx`. `pygame.draw.rect(screen, color, box)` draws it.'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Meet the Rectangle")

              box = pygame.Rect(200, 130, 80, 60)
              running = True

              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  keys = pygame.key.get_pressed()
                  if keys[pygame.K_LEFT]:
                      box.x -= 5
                  if keys[pygame.K_RIGHT]:
                      box.x += 5
                  if keys[pygame.K_UP]:
                      box.y -= 5
                  if keys[pygame.K_DOWN]:
                      box.y += 5

                  screen.fill((22, 22, 30))
                  pygame.draw.rect(screen, (120, 200, 160), box)
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
      - name: Catch the Dots
        game: true
        obj: 'GOAL: make it harder by speeding up the dots. They fall with `dot.y += 4`. Change it to `dot.y += 8`, then click "Check Goal". (Catch them with the left/right arrow keys.)'
        checks:
          has: ['dot\.y\s*\+=\s*8']
          msg: 'Not yet! Change the falling speed to dot.y += 8.'
        hint: '`a.colliderect(b)` returns True when rects `a` and `b` overlap. Draw text with `font.render("Score: " + str(score), True, color)` then `screen.blit(label, (x, y))`.'
        start: |-
          import asyncio
          import random
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Catch the Dots")
              font = pygame.font.SysFont(None, 28)

              paddle = pygame.Rect(205, 292, 70, 14)
              dot = pygame.Rect(random.randint(0, 460), 0, 20, 20)
              score = 0
              running = True

              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  keys = pygame.key.get_pressed()
                  if keys[pygame.K_LEFT]:
                      paddle.x -= 6
                  if keys[pygame.K_RIGHT]:
                      paddle.x += 6
                  paddle.left = max(0, paddle.left)
                  paddle.right = min(480, paddle.right)

                  dot.y += 4
                  if dot.colliderect(paddle):
                      score += 1
                      dot.x = random.randint(0, 460)
                      dot.y = 0
                  elif dot.top > 320:
                      dot.x = random.randint(0, 460)
                      dot.y = 0

                  screen.fill((18, 18, 28))
                  pygame.draw.rect(screen, (240, 200, 80), dot)
                  pygame.draw.rect(screen, (90, 200, 130), paddle)
                  label = font.render("Score: " + str(score), True, (240, 240, 240))
                  screen.blit(label, (12, 10))
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
      - name: Dodge the Blocks
        game: true
        obj: 'GOAL: make it more intense. A new block spawns when `frame % 30 == 0`. Change 30 to `15` so blocks come twice as often, then click "Check Goal". (Arrow keys to dodge, R to retry.)'
        checks:
          has: ['frame\s*%\s*15\s*==\s*0']
          msg: 'Not yet! Change frame % 30 == 0 to frame % 15 == 0.'
        hint: 'Loop over the blocks and check `player.colliderect(block)`. Keep a `dead` flag; when the player presses `pygame.K_r`, reset everything.'
        start: |-
          import asyncio
          import random
          import pygame


          def new_block():
              return pygame.Rect(random.randint(0, 450), -30, 30, 30)


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Dodge the Blocks")
              font = pygame.font.SysFont(None, 28)

              player = pygame.Rect(220, 270, 36, 36)
              blocks = [new_block()]
              score = 0
              frame = 0
              dead = False
              running = True

              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  keys = pygame.key.get_pressed()
                  if not dead:
                      if keys[pygame.K_LEFT]:
                          player.x -= 6
                      if keys[pygame.K_RIGHT]:
                          player.x += 6
                      player.left = max(0, player.left)
                      player.right = min(480, player.right)

                      frame += 1
                      if frame % 30 == 0:
                          blocks.append(new_block())

                      for b in blocks:
                          b.y += 4
                          if b.colliderect(player):
                              dead = True
                      blocks = [b for b in blocks if b.top < 320]
                      score = frame // 6
                  else:
                      if keys[pygame.K_r]:
                          player = pygame.Rect(220, 270, 36, 36)
                          blocks = [new_block()]
                          score = 0
                          frame = 0
                          dead = False

                  screen.fill((20, 18, 24))
                  for b in blocks:
                      pygame.draw.rect(screen, (230, 90, 90), b)
                  pygame.draw.rect(screen, (110, 200, 240), player)
                  label = font.render("Score: " + str(score), True, (240, 240, 240))
                  screen.blit(label, (10, 8))
                  if dead:
                      over = font.render("Game Over - press R", True, (240, 200, 120))
                      screen.blit(over, (135, 150))
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
  - name: Build a Real Game
    icon: object_advance
    levels:
      - name: Pong
        game: true
        obj: 'GOAL: speed up the rally. The ball starts at `bx, by = 4, 3`. Change it to `bx, by = 6, 5`, then click "Check Goal". (You are the green paddle, use W and S. The blue paddle plays itself.)'
        checks:
          has: ['bx,\s*by\s*=\s*6,\s*5']
          msg: 'Not yet! Set the starting ball speed to bx, by = 6, 5.'
        hint: 'Each paddle is a Rect you move with W/S. The ball flips `bx` when it hits a paddle and `by` when it hits the top or bottom. A point is scored when the ball passes the left or right edge.'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Pong")
              font = pygame.font.SysFont(None, 34)

              left = pygame.Rect(20, 125, 12, 70)
              right = pygame.Rect(448, 125, 12, 70)
              ball = pygame.Rect(234, 154, 12, 12)
              bx, by = 4, 3
              score_l, score_r = 0, 0
              running = True

              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  keys = pygame.key.get_pressed()
                  if keys[pygame.K_w]:
                      left.y -= 6
                  if keys[pygame.K_s]:
                      left.y += 6
                  left.top = max(0, left.top)
                  left.bottom = min(320, left.bottom)

                  # the right paddle follows the ball on its own
                  if right.centery < ball.centery:
                      right.y += 4
                  if right.centery > ball.centery:
                      right.y -= 4
                  right.top = max(0, right.top)
                  right.bottom = min(320, right.bottom)

                  ball.x += bx
                  ball.y += by
                  if ball.top < 0 or ball.bottom > 320:
                      by = -by
                  if ball.colliderect(left) or ball.colliderect(right):
                      bx = -bx
                  if ball.left < 0:
                      score_r += 1
                      ball.x, ball.y = 234, 154
                      bx = 4
                  if ball.right > 480:
                      score_l += 1
                      ball.x, ball.y = 234, 154
                      bx = -4

                  screen.fill((15, 15, 22))
                  pygame.draw.rect(screen, (90, 200, 130), left)
                  pygame.draw.rect(screen, (90, 160, 240), right)
                  pygame.draw.rect(screen, (240, 240, 240), ball)
                  label = font.render(str(score_l) + "   " + str(score_r), True, (230, 230, 230))
                  screen.blit(label, (215, 14))
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
      - name: Breakout
        game: true
        obj: 'GOAL: add more bricks. The rows are built with `for row in range(4)`. Change 4 to `6` for two extra rows, then click "Check Goal". (Move the paddle with the arrow keys.)'
        checks:
          has: ['range\(6\)']
          msg: 'Not yet! Change for row in range(4) to for row in range(6).'
        hint: 'The bricks are a list of Rects built with two loops. Each frame, check if the ball hits any brick; if so, remove it with `bricks.pop(i)` and bounce the ball.'
        start: |-
          import asyncio
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Breakout")
              font = pygame.font.SysFont(None, 28)

              paddle = pygame.Rect(200, 300, 80, 12)
              ball = pygame.Rect(236, 200, 12, 12)
              bx, by = 3, -3

              bricks = []
              for row in range(4):
                  for col in range(8):
                      bricks.append(pygame.Rect(10 + col * 58, 30 + row * 24, 50, 16))

              won = False
              running = True

              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False

                  keys = pygame.key.get_pressed()
                  if keys[pygame.K_LEFT]:
                      paddle.x -= 6
                  if keys[pygame.K_RIGHT]:
                      paddle.x += 6
                  paddle.left = max(0, paddle.left)
                  paddle.right = min(480, paddle.right)

                  if not won:
                      ball.x += bx
                      ball.y += by
                      if ball.left < 0 or ball.right > 480:
                          bx = -bx
                      if ball.top < 0:
                          by = -by
                      if ball.colliderect(paddle) and by > 0:
                          by = -by

                      hit = -1
                      for i in range(len(bricks)):
                          if ball.colliderect(bricks[i]):
                              hit = i
                              break
                      if hit >= 0:
                          bricks.pop(hit)
                          by = -by

                      if ball.top > 320:
                          ball.x, ball.y = 236, 200
                          bx, by = 3, -3
                      if len(bricks) == 0:
                          won = True

                  screen.fill((18, 18, 26))
                  for b in bricks:
                      pygame.draw.rect(screen, (230, 150, 70), b)
                  pygame.draw.rect(screen, (90, 200, 130), paddle)
                  pygame.draw.rect(screen, (240, 240, 240), ball)
                  if won:
                      label = font.render("You cleared them all!", True, (240, 240, 120))
                      screen.blit(label, (120, 150))
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
      - name: Snake
        game: true
        obj: 'GOAL: make the snake faster. It moves when `frame % 8 == 0`. Change 8 to `4` so it moves twice as often, then click "Check Goal". (Click the game, steer with arrow keys, R to restart.)'
        checks:
          has: ['frame\s*%\s*4\s*==\s*0']
          msg: 'Not yet! Change frame % 8 == 0 to frame % 4 == 0.'
        hint: 'On each move, insert a new head at the front of the `snake` list. If the head landed on the food, keep the tail (you grew); otherwise `snake.pop()` to drop the tail. Game over if the head hits a wall or is already in the snake.'
        start: |-
          import asyncio
          import random
          import pygame


          async def main():
              pygame.init()
              screen = pygame.display.set_mode((480, 320))
              pygame.display.set_caption("Snake")
              font = pygame.font.SysFont(None, 28)

              cell = 20
              cols, rows = 24, 16

              def reset():
                  return [(12, 8), (11, 8), (10, 8)], 1, 0, (16, 8), 0

              snake, dx, dy, food, score = reset()
              dead = False
              frame = 0
              running = True

              while running:
                  for event in pygame.event.get():
                      if event.type == pygame.QUIT:
                          running = False
                      if event.type == pygame.KEYDOWN:
                          if event.key == pygame.K_LEFT and dx != 1:
                              dx, dy = -1, 0
                          elif event.key == pygame.K_RIGHT and dx != -1:
                              dx, dy = 1, 0
                          elif event.key == pygame.K_UP and dy != 1:
                              dx, dy = 0, -1
                          elif event.key == pygame.K_DOWN and dy != -1:
                              dx, dy = 0, 1

                  keys = pygame.key.get_pressed()
                  if dead and keys[pygame.K_r]:
                      snake, dx, dy, food, score = reset()
                      dead = False

                  frame += 1
                  if not dead and frame % 8 == 0:
                      head = (snake[0][0] + dx, snake[0][1] + dy)
                      if (head[0] < 0 or head[0] >= cols or head[1] < 0
                              or head[1] >= rows or head in snake):
                          dead = True
                      else:
                          snake.insert(0, head)
                          if head == food:
                              score += 1
                              food = (random.randint(0, cols - 1), random.randint(0, rows - 1))
                          else:
                              snake.pop()

                  screen.fill((16, 20, 16))
                  pygame.draw.rect(screen, (230, 90, 90),
                                   (food[0] * cell, food[1] * cell, cell, cell))
                  for part in snake:
                      pygame.draw.rect(screen, (110, 210, 120),
                                       (part[0] * cell, part[1] * cell, cell - 2, cell - 2))
                  label = font.render("Score: " + str(score), True, (235, 235, 235))
                  screen.blit(label, (10, 8))
                  if dead:
                      over = font.render("Game Over - press R", True, (240, 200, 120))
                      screen.blit(over, (140, 150))
                  pygame.display.flip()

                  await asyncio.sleep(1 / 60)


          asyncio.run(main())
