name: JavaScript Fundamentals
slug: javascript
icon: javascript
desc: 'Master JavaScript from the ground up: variables, decisions, loops, functions, objects, the page itself, and more.'
difficulty: 1
chapters:
  - name: JavaScript Basics
    icon: variable
    levels:
      - name: Your First Message
        obj: 'Print `Hello, world!` to the console.'
        expl: '`console.log` is how a program says something out loud. Whatever you put in the brackets appears in the console below the editor. It is the first tool you reach for and, honestly, still the one you reach for years later. Text goes in quotes.'
        hint: 'Put the text, quotes and all, inside the brackets.'
        max: '1/1'
        web: js
        start: |
          // Print a greeting below
        sol: |
          console.log("Hello, world!");
        tests:
          - exp: |
              Hello, world!

      - name: Storing a Value
        obj: 'Store the text `Ada` in a variable called `name`, then print the variable.'
        expl: 'A **variable** is a name for a value. `let name = "Ada";` creates one, and from then on writing `name` means whatever is stored in it. Printing the variable rather than the text is the entire point: change the value in one place and every use of it follows.'
        hint: '`let` to create it, then pass the name — not the text — to `console.log`.'
        max: '2/1'
        web: js
        start: |
          // Create the variable, then print it
        sol: |
          let name = "Ada";
          console.log(name);
        tests:
          - exp: |
              Ada
        checks:
          has:
            - 'let\s+name\s*='
            - 'console\.log\(\s*name\s*\)'
          msg: 'Store the text in a variable called `name`, then pass that variable to `console.log`.'

      - name: Numbers and Maths
        obj: 'Print the total of `apples` and `oranges`.'
        expl: 'Numbers need no quotes, and the usual arithmetic works as you would expect: `+`, `-`, `*` and `/`. What matters here is that you add the *variables* rather than the numbers — the program should still be right if someone changes the values at the top.'
        hint: 'Pass `apples + oranges` straight to `console.log`.'
        max: '3/1'
        web: js
        start: |
          let apples = 7;
          let oranges = 5;
          // Print the total
        sol: |
          let apples = 7;
          let oranges = 5;
          console.log(apples + oranges);
        tests:
          - exp: |
              12
        checks:
          has:
            - 'apples\s*\+\s*oranges'
          msg: 'Add the two variables together rather than working the answer out yourself.'

      - name: Joining Text
        obj: 'Print `Ada has 12 apples.` by dropping both variables into a template string.'
        expl: 'Backtick quotes let you put a value straight inside a piece of text: a dollar sign and braces around a variable are replaced by whatever it holds. It reads far better than gluing pieces together with plus signs, and it is what you will meet in real code.'
        hint: 'Wrap the whole sentence in backticks, then write `${name}` and `${count}` where the values belong.'
        max: '3/1'
        web: js
        start: |
          let name = "Ada";
          let count = 12;
          // Print the sentence
        sol: |
          let name = "Ada";
          let count = 12;
          console.log(`${name} has ${count} apples.`);
        tests:
          - exp: |
              Ada has 12 apples.
        checks:
          has:
            - '\$\{'
          msg: 'Use a template string with `${...}` rather than joining the pieces with `+`.'

      - name: Making a Decision
        obj: 'Print `Warm` when `temp` is above 20, and `Cold` when it is not.'
        expl: 'An `if` runs its block only when its condition is true; the `else` block runs when it is not. The condition goes in brackets, each block in braces. Change `temp` and run it again — one program, two possible outcomes, which is where programs stop being lists of instructions.'
        hint: '`if (temp > 20) { ... } else { ... }`'
        max: '6/1'
        web: js
        start: |
          let temp = 26;
          // Print Warm or Cold
        sol: |
          let temp = 26;
          if (temp > 20) {
            console.log("Warm");
          } else {
            console.log("Cold");
          }
        tests:
          - exp: |
              Warm
        checks:
          has:
            - 'if\s*\('
            - 'else'
          msg: 'Use an `if` and an `else` — printing the answer directly stops being right the moment `temp` changes.'

      - name: A List of Values
        obj: 'Print how many colours are in the `colours` array.'
        expl: 'An **array** holds several values in order, written in square brackets. `.length` tells you how many there are. Counting them yourself works exactly until the list changes, which is the sort of bug that survives a long time because it starts out correct.'
        hint: 'Arrays know their own size: `colours.length`.'
        max: '2/1'
        web: js
        start: |
          let colours = ["red", "green", "blue"];
          // Print how many there are
        sol: |
          let colours = ["red", "green", "blue"];
          console.log(colours.length);
        tests:
          - exp: |
              3
        checks:
          has:
            - '\.length'
          msg: 'Ask the array for its `.length` rather than counting by hand.'

      - name: Repeating Yourself
        obj: 'Print the numbers 1 to 5, one per line, using a `for` loop.'
        expl: 'A `for` loop repeats a block a set number of times. Its three parts say where to start, how long to keep going, and what to change each time round. Nearly every loop you write will have this shape, so it is worth reading the three parts back to yourself once.'
        hint: 'Start `i` at 1 and keep going while `i` is 5 or less.'
        max: '3/1'
        web: js
        start: |
          // Print 1 to 5
        sol: |
          for (let i = 1; i <= 5; i++) {
            console.log(i);
          }
        tests:
          - exp: |
              1
              2
              3
              4
              5
        checks:
          has:
            - 'for\s*\('
          msg: 'Use a `for` loop — five separate `console.log` lines would not survive being asked for 1 to 500.'

      - name: Going Through a List
        obj: 'Print each colour in `colours`, one per line.'
        expl: 'A `for ... of` loop hands you one item of an array per pass, which is nearly always what you actually want and spares you managing a counter. The variable you name after `for` holds the current item.'
        hint: '`for (let colour of colours) { ... }`'
        max: '4/1'
        web: js
        start: |
          let colours = ["red", "green", "blue"];
          // Print each one
        sol: |
          let colours = ["red", "green", "blue"];
          for (let colour of colours) {
            console.log(colour);
          }
        tests:
          - exp: |
              red
              green
              blue
        checks:
          has:
            - 'for\s*\('
          msg: 'Loop over the array rather than printing the three colours one at a time.'

      - name: Writing a Function
        obj: 'Write a function `double` that returns twice the number given to it, then print `double(8)`.'
        expl: 'A **function** is a named piece of code you can run whenever you like. Values go in as parameters and `return` sends one back out. Note that returning is not printing — the function hands the value back and leaves it to the caller to decide what happens next, which is exactly why it can be reused.'
        hint: '`function double(n) { return n * 2; }`, then print the result of calling it.'
        max: '4/1'
        web: js
        start: |
          // Write the function here, then print double(8)
        sol: |
          function double(n) {
            return n * 2;
          }
          console.log(double(8));
        tests:
          - exp: |
              16
        checks:
          has:
            - 'function\s+double'
            - 'return'
          msg: 'Define a function called `double` that returns its answer rather than printing it.'

      - name: Putting It Together
        obj: 'Write a function `shout` that returns a word in capitals followed by an exclamation mark, then loop over `words` printing `shout` of each one.'
        expl: 'A function and a loop, which between them are most of what a small program is. `.toUpperCase()` gives you a capitalised copy of a string — a copy, note; the original is untouched. Write the function first and the loop second, and each stays simple enough to check on its own.'
        hint: 'Build the returned text with a template string, then call `shout` inside the loop.'
        max: '7/1'
        web: js
        start: |
          let words = ["hello", "there"];
          // Write shout here, then loop over words
        sol: |
          let words = ["hello", "there"];
          function shout(word) {
            return `${word.toUpperCase()}!`;
          }
          for (let word of words) {
            console.log(shout(word));
          }
        tests:
          - exp: |
              HELLO!
              THERE!
        checks:
          has:
            - 'function\s+shout'
            - 'for\s*\('
          msg: 'You need both a function called `shout` and a loop over `words`.'

  # Every level here carries a `page:` — markup the level supplies and the
  # student does not write. That is the point of the chapter: the skill being
  # taught is reaching into a document someone else wrote, so the editor holds
  # only the script and the pane beside it shows the page rather than a console.
  # "Making a Decision" in the first chapter introduces `if`, `else`, a
  # comparison operator and a braced block in one level, and the next level is
  # already about arrays. These two chapters give the decision and the string
  # their own space before objects arrive, so nothing after this point is the
  # first time a student has seen a condition or a method call.
  - name: Choices in Depth
    icon: state
    levels:
      - name: A Value That Is True or False
        obj: 'Store `true` in a variable called `isOpen`, then print it.'
        expl: 'A **boolean** is a value with exactly two possibilities: `true` and `false`. They are values in their own right, not the words in quotes, and every decision a program makes comes down to one in the end. You will rarely write one out like this, but it is what everything else in this chapter produces.'
        hint: 'Assign the bare word `true`, with no quotes around it.'
        max: '2/1'
        web: js
        start: |
          // Store true in isOpen, then print it
        sol: |
          let isOpen = true;
          console.log(isOpen);
        tests:
          - exp: |
              true
        checks:
          has:
            - 'let\s+isOpen'
            - 'true'
          msg: 'Store the value in `isOpen` first, then print the variable.'

      - name: Asking a Question
        obj: 'Print the result of comparing `price` with 100 using `>`.'
        expl: 'A comparison is not a question you answer yourself, it is an expression that produces a boolean. `price > 100` becomes `true` or `false` before `console.log` ever sees it. That is why the answer stays right when `price` changes, and why typing `true` directly would not.'
        hint: 'Put the whole comparison inside the brackets of `console.log`.'
        max: '2/1'
        web: js
        start: |
          let price = 250;
          // Print whether the price is over 100
        sol: |
          let price = 250;
          console.log(price > 100);
        tests:
          - exp: |
              true
        checks:
          has:
            - '>'
          msg: 'Compare with `>` and print what comes back, rather than printing the answer yourself.'

      - name: Exactly Equal
        obj: 'Print whether `code` is exactly the text `beta`, using `===`.'
        expl: 'Three equals signs asks whether two values are the same in both value and type. JavaScript also has `==`, which converts one side before comparing and decides that `1 == "1"` is true. That is a famous source of bugs, so use `===` every time and treat `==` as something you only need to recognise in other people code.'
        hint: 'Compare the variable with the text in quotes.'
        max: '2/1'
        web: js
        start: |
          let code = "beta";
          // Print whether code is exactly "beta"
        sol: |
          let code = "beta";
          console.log(code === "beta");
        tests:
          - exp: |
              true
        checks:
          has:
            - '==='
          msg: 'Use `===`, the comparison that checks value and type together.'

      - name: Not Equal
        obj: 'Print whether `status` is not `done`, using `!==`.'
        expl: 'The mirror of `===`. Reading it aloud helps: the exclamation mark means "not", so `!==` is "not exactly equal to". Checking that something has *not* reached a state is often more useful than checking that it has, because there is usually one finished state and many unfinished ones.'
        hint: 'Same shape as the last level, with the operator swapped.'
        max: '2/1'
        web: js
        start: |
          let status = "open";
          // Print whether status is not "done"
        sol: |
          let status = "open";
          console.log(status !== "done");
        tests:
          - exp: |
              true
        checks:
          has:
            - '!=='
          msg: 'Use `!==` rather than comparing and then flipping the answer.'

      - name: More Than Two Paths
        obj: 'Print `Gold` when `points` is 100 or more, `Silver` when it is 50 or more, and `Bronze` otherwise.'
        expl: 'An `else if` adds a further question that is only asked when the ones above it failed. Order matters more than it looks: 60 is not 100 or more, so the second test gets a turn. Had the 50 test come first, a score of 200 would print `Silver`, because the chain stops at the first branch that matches.'
        hint: 'Test the largest threshold first, then the next, then a plain `else`.'
        max: '9/1'
        web: js
        start: |
          let points = 60;
          // Print Gold, Silver or Bronze
        sol: |
          let points = 60;
          if (points >= 100) {
            console.log("Gold");
          } else if (points >= 50) {
            console.log("Silver");
          } else {
            console.log("Bronze");
          }
        tests:
          - exp: |
              Silver
        checks:
          has:
            - 'else\s+if'
          msg: 'Three outcomes need an `if`, an `else if`, and an `else`.'

      - name: Both Must Be True
        obj: 'Print `Allowed` when `age` is at least 18 and `hasTicket` is true, and `Refused` otherwise.'
        expl: 'Two ampersands join two conditions into one that is true only when both halves are. It is lazier than it looks: if the left half is already false, the right half is never evaluated at all, because the answer cannot change. That shortcut is worth remembering once your conditions start calling functions.'
        hint: '`if (age >= 18 && hasTicket) { ... }` needs no comparison on the second half, since it is already a boolean.'
        max: '8/1'
        web: js
        start: |
          let age = 22;
          let hasTicket = true;
          // Print Allowed or Refused
        sol: |
          let age = 22;
          let hasTicket = true;
          if (age >= 18 && hasTicket) {
            console.log("Allowed");
          } else {
            console.log("Refused");
          }
        tests:
          - exp: |
              Allowed
        checks:
          has:
            - '&&'
          msg: 'Join both requirements into one condition with `&&`.'

      - name: Either Will Do
        obj: 'Print `Weekend` when `day` is `Sat` or `Sun`, and `Weekday` otherwise.'
        expl: 'Two pipes make a condition that is true when at least one half is. Note that each half has to be a complete comparison: `day === "Sat" || day === "Sun"` works, while `day === "Sat" || "Sun"` does not, because the second half is just a piece of text and a non-empty string counts as true on its own.'
        hint: 'Write the variable out again on the right of the `||`.'
        max: '8/1'
        web: js
        start: |
          let day = "Sun";
          // Print Weekend or Weekday
        sol: |
          let day = "Sun";
          if (day === "Sat" || day === "Sun") {
            console.log("Weekend");
          } else {
            console.log("Weekday");
          }
        tests:
          - exp: |
              Weekend
        checks:
          has:
            - '\|\|'
          msg: 'One `if` with an `||` inside it, not two separate `if` statements.'

      - name: The Opposite
        obj: 'Using `!`, print `Closed` when `isOpen` is not true.'
        expl: 'An exclamation mark in front of a value flips it, so `!isOpen` is true exactly when `isOpen` is false. Writing `if (!isOpen)` instead of `if (isOpen === false)` is the usual style, and it reads better once you are used to it: "if not open".'
        hint: 'The `!` goes immediately before the variable name, inside the brackets.'
        max: '5/1'
        web: js
        start: |
          let isOpen = false;
          // Print Closed when it is not open
        sol: |
          let isOpen = false;
          if (!isOpen) {
            console.log("Closed");
          }
        tests:
          - exp: |
              Closed
        checks:
          has:
            - '!\s*isOpen'
          msg: 'Flip the value with `!` rather than comparing it to `false`.'

      - name: Choosing From Many
        obj: 'Use a `switch` on `grade` to print `Excellent` for `A`, `Good` for `B`, and `Try again` for anything else.'
        expl: 'A `switch` compares one value against a list of cases, and is easier to read than a long `else if` chain when every branch tests the same variable. The `break` matters: without it execution falls through into the next case and keeps going, printing more than you meant. `default` is the branch for everything unmatched.'
        hint: 'Each `case` ends with a `break;`, and `default` goes last.'
        max: '12/1'
        web: js
        start: |
          let grade = "B";
          // Switch on grade
        sol: |
          let grade = "B";
          switch (grade) {
            case "A":
              console.log("Excellent");
              break;
            case "B":
              console.log("Good");
              break;
            default:
              console.log("Try again");
          }
        tests:
          - exp: |
              Good
        checks:
          has:
            - 'switch\s*\('
            - 'case'
            - 'break'
          msg: 'Use a real `switch` with `case` branches and a `break` in each.'

      - name: Putting It Together
        obj: 'Print `Ship` when `paid` is true and `stock` is above 0, `Backorder` when `paid` is true but there is no stock, and `Hold` otherwise.'
        expl: 'Three outcomes from two inputs, which is the shape most real decisions take. Notice that the second branch does not have to re-check `paid`: it is only reached when the first test failed, and the only way to fail it while still being paid is to have no stock. Letting the chain carry that knowledge keeps each condition short.'
        hint: 'Test the most demanding case first, then the one remaining paid case, then everything else.'
        max: '10/1'
        web: js
        start: |
          let paid = true;
          let stock = 0;
          // Print Ship, Backorder or Hold
        sol: |
          let paid = true;
          let stock = 0;
          if (paid && stock > 0) {
            console.log("Ship");
          } else if (paid) {
            console.log("Backorder");
          } else {
            console.log("Hold");
          }
        tests:
          - exp: |
              Backorder
        checks:
          has:
            - '&&'
            - 'else\s+if'
          msg: 'Combine the first two conditions with `&&`, then handle the rest with `else if`.'

  - name: Working With Text
    icon: say
    levels:
      - name: How Long Is It
        obj: 'Print how many characters are in `word`.'
        expl: 'A string knows its own length, exactly as an array does. That is not a coincidence: a string behaves like an ordered run of characters in several ways, and `.length` is the first of them. It is a property rather than a method, so there are no brackets after it.'
        hint: '`word.length`, with no brackets.'
        max: '2/1'
        web: js
        start: |
          let word = "elephant";
          // Print how many characters it has
        sol: |
          let word = "elephant";
          console.log(word.length);
        tests:
          - exp: |
              8
        checks:
          has:
            - '\.length'
          msg: 'Ask the string for its `.length` rather than counting the letters yourself.'

      - name: Shouting
        obj: 'Print `name` in capitals using `.toUpperCase()`.'
        expl: 'A **method** is a function that belongs to a value, called with a dot and a pair of brackets. This one returns a new string in capitals and leaves the original untouched, which is true of every string method in JavaScript: strings cannot be modified in place, so a method that seems to change one is really handing you a replacement.'
        hint: 'The brackets are empty, but they still have to be there.'
        max: '2/1'
        web: js
        start: |
          let name = "ada";
          // Print it in capitals
        sol: |
          let name = "ada";
          console.log(name.toUpperCase());
        tests:
          - exp: |
              ADA
        checks:
          has:
            - '\.toUpperCase\('
          msg: 'Call `.toUpperCase()` rather than retyping the word in capitals.'

      - name: One Character
        obj: 'Print the first character of `word` using square brackets.'
        expl: 'Square brackets pick one character out by position, and positions start at 0, not 1. That off-by-one is worth burning in now: the first character is at 0, the last is at `length - 1`, and the same rule holds for arrays. Nearly every beginner bug in this area comes from expecting counting to start at one.'
        hint: 'The first position is `0`.'
        max: '2/1'
        web: js
        start: |
          let word = "harbour";
          // Print its first character
        sol: |
          let word = "harbour";
          console.log(word[0]);
        tests:
          - exp: |
              h
        checks:
          has:
            - 'word\[0\]'
          msg: 'Index the string with `word[0]` rather than writing the letter out.'

      - name: A Piece of a String
        obj: 'Print the first two characters of `code` using `.slice()`.'
        expl: 'A `.slice(start, end)` returns the run of characters from one position up to but not including another, so `slice(0, 2)` gives you two characters. That end-is-excluded rule looks awkward until you notice what it buys: the length of what you get back is simply `end - start`.'
        hint: 'Start at 0 and end at 2.'
        max: '2/1'
        web: js
        start: |
          let code = "AB-1234";
          // Print the first two characters
        sol: |
          let code = "AB-1234";
          console.log(code.slice(0, 2));
        tests:
          - exp: |
              AB
        checks:
          has:
            - '\.slice\('
          msg: 'Use `.slice()` so the answer still works when `code` changes.'

      - name: Does It Contain
        obj: 'Print whether `title` contains the word `Long`, using `.includes()`.'
        expl: 'This is the chapter on decisions meeting the chapter on text: `.includes()` returns a boolean, so it can go straight into an `if`. It is case sensitive, which catches people out, and the usual fix is to lower-case both sides before comparing.'
        hint: 'The word to look for goes inside the brackets, in quotes.'
        max: '2/1'
        web: js
        start: |
          let title = "The Long Way";
          // Print whether it contains "Long"
        sol: |
          let title = "The Long Way";
          console.log(title.includes("Long"));
        tests:
          - exp: |
              true
        checks:
          has:
            - '\.includes\('
          msg: 'Ask the string with `.includes()` rather than printing the answer.'

      - name: Where Is It
        obj: 'Print the position of the first `/` in `path`, using `.indexOf()`.'
        expl: 'Where `.includes()` answers yes or no, `.indexOf()` answers where, counting from 0 as always. When the text is not there at all it returns `-1` rather than nothing, which is a value you have to test for: forgetting that `-1` is still a number is a classic bug, because it is perfectly happy to be used as a position.'
        hint: 'The character to find goes in quotes inside the brackets.'
        max: '2/1'
        web: js
        start: |
          let path = "docs/report.pdf";
          // Print the position of the first slash
        sol: |
          let path = "docs/report.pdf";
          console.log(path.indexOf("/"));
        tests:
          - exp: |
              4
        checks:
          has:
            - '\.indexOf\('
          msg: 'Use `.indexOf()` rather than counting the characters by hand.'

      - name: Swapping Words
        obj: 'Print `line` with `world` replaced by `there`, using `.replace()`.'
        expl: 'A `.replace(from, to)` swaps the **first** match only and hands back a new string. Replacing every match needs either a regular expression with a global flag or the newer `.replaceAll()`. As with every string method, the original variable still holds what it always held.'
        hint: 'Two arguments, separated by a comma: what to find, then what to put there.'
        max: '2/1'
        web: js
        start: |
          let line = "hello world";
          // Print it with world swapped for there
        sol: |
          let line = "hello world";
          console.log(line.replace("world", "there"));
        tests:
          - exp: |
              hello there
        checks:
          has:
            - '\.replace\('
          msg: 'Use `.replace()` rather than writing the finished sentence out.'

      - name: Splitting Into a List
        obj: 'Print the result of splitting `csv` on the comma.'
        expl: 'A `.split()` cuts a string wherever it finds the separator and gives you an array of the pieces. This is the bridge between text and lists, and it is how most data arrives in the real world: one long line that has to become items before anything can be done with it. Printing an array shows it in JSON form.'
        hint: 'The separator is a comma in quotes.'
        max: '2/1'
        web: js
        start: |
          let csv = "red,green,blue";
          // Print the pieces as an array
        sol: |
          let csv = "red,green,blue";
          console.log(csv.split(","));
        tests:
          - exp: |
              ["red","green","blue"]
        checks:
          has:
            - '\.split\('
          msg: 'Use `.split()` rather than writing the array out by hand.'

      - name: Trimming the Edges
        obj: 'Print `entry` with the surrounding spaces removed, using `.trim()`.'
        expl: 'A `.trim()` removes whitespace from both ends and leaves the middle alone. Anything a person types into a form is worth trimming before you compare it with anything, because a trailing space is invisible on screen and still makes two otherwise identical strings unequal.'
        hint: 'No arguments, just the empty brackets.'
        max: '2/1'
        web: js
        start: |
          let entry = "   ada   ";
          // Print it with the spaces removed
        sol: |
          let entry = "   ada   ";
          console.log(entry.trim());
        tests:
          - exp: |
              ada
        checks:
          has:
            - '\.trim\('
          msg: 'Call `.trim()` rather than retyping the value without its spaces.'

      - name: Putting It Together
        obj: 'From `raw`, trim the spaces, put it in capitals, and print the first three characters.'
        expl: 'Every string method returns a string, which means the next method can be called straight onto the result. Reading `raw.trim().toUpperCase().slice(0, 3)` left to right describes the pipeline in the order it happens. Chaining is neat, but it is also unforgiving: one method that returns something other than a string ends the chain with an error.'
        hint: 'Three calls in a row on one line, in the order the objective names them.'
        max: '2/1'
        web: js
        start: |
          let raw = "  kodetika  ";
          // Trim it, capitalise it, print the first three characters
        sol: |
          let raw = "  kodetika  ";
          console.log(raw.trim().toUpperCase().slice(0, 3));
        tests:
          - exp: |
              KOD
        checks:
          has:
            - '\.trim\('
            - '\.toUpperCase\('
            - '\.slice\('
          msg: 'All three methods are needed, chained onto one another.'

  - name: Objects and Arrays
    icon: object
    levels:
      - name: A Value With Named Parts
        obj: 'Print the `title` of the `book` object.'
        expl: 'An **object** groups related values under names instead of positions. `{ title: "Dune", pages: 412 }` has two **properties**, and `book.title` reads one of them back. An array asks "what is at position 2?"; an object asks "what is the title?" — which is the question you actually have most of the time.'
        hint: 'A dot between the object and the property name: `book.title`.'
        max: '2/1'
        web: js
        start: |
          let book = { title: "Dune", pages: 412 };
          // Print the title
        sol: |
          let book = { title: "Dune", pages: 412 };
          console.log(book.title);
        tests:
          - exp: |
              Dune
        checks:
          has:
            - 'book\.title'
          msg: 'Read the property off the object with `book.title` rather than printing the text again.'

      - name: Adding to an Object
        obj: 'Give `book` a `year` of 1965, then print the whole object.'
        expl: 'Objects are not sealed. Assigning to a property that does not exist yet creates it, which is the same line you would write to change one that does. Printing the object itself shows every property it now has — handy for checking what you actually built rather than what you meant to build.'
        hint: '`book.year = 1965;`, then pass `book` itself to `console.log`.'
        max: '3/1'
        web: js
        start: |
          let book = { title: "Dune", pages: 412 };
          // Add the year, then print the object
        sol: |
          let book = { title: "Dune", pages: 412 };
          book.year = 1965;
          console.log(book);
        tests:
          - exp: |
              {"title":"Dune","pages":412,"year":1965}
        checks:
          has:
            - 'book\.year\s*='
          msg: 'Add the year by assigning to `book.year` rather than by writing a new object out in full.'

      - name: Growing a List
        obj: 'Add `cherry` to the end of `fruits`, then print how many there are.'
        expl: 'Arrays grow with `.push`, which adds to the end and is by far the most common way a list gets built: start empty, push as you go. It changes the array in place — there is no new list handed back, which is why you push and then carry on using the same variable.'
        hint: '`fruits.push("cherry");`, then print `fruits.length`.'
        max: '3/1'
        web: js
        start: |
          let fruits = ["apple", "banana"];
          // Add cherry, then print the count
        sol: |
          let fruits = ["apple", "banana"];
          fruits.push("cherry");
          console.log(fruits.length);
        tests:
          - exp: |
              3
        checks:
          has:
            - '\.push\('
          msg: 'Use `.push` to add the item rather than writing the finished list out yourself.'

      - name: Joining a List into Text
        obj: 'Print the fruits as one line: `apple, banana, cherry`.'
        expl: '`.join` glues an array into a single string, putting whatever you give it between the items. `join(", ")` is the one you will reach for most, and it is worth noticing what it saves you: no loop, and no stray comma left dangling on the end.'
        hint: '`fruits.join(", ")` — mind the space after the comma.'
        max: '2/1'
        web: js
        start: |
          let fruits = ["apple", "banana", "cherry"];
          // Print them on one line
        sol: |
          let fruits = ["apple", "banana", "cherry"];
          console.log(fruits.join(", "));
        tests:
          - exp: |
              apple, banana, cherry
        checks:
          has:
            - '\.join\('
          msg: 'Build the line with `.join` rather than typing the three names out.'

      - name: A List of Objects
        obj: 'Print each product as its name, a colon and a space, then its price.'
        expl: 'Arrays and objects are far more useful together than apart: a list of objects is what almost every real piece of data looks like — rows from a database, items in a basket, users of a site. Loop over the array and each pass hands you one whole object to read properties from.'
        hint: 'Loop with `for (let p of products)` and build each line with a template string.'
        max: '7/1'
        web: js
        start: |
          let products = [
            { name: "Mug", price: 8 },
            { name: "Notebook", price: 5 },
          ];
          // Print one line per product
        sol: |
          let products = [
            { name: "Mug", price: 8 },
            { name: "Notebook", price: 5 },
          ];
          for (let p of products) {
            console.log(`${p.name}: ${p.price}`);
          }
        tests:
          - exp: |
              Mug: 8
              Notebook: 5
        checks:
          has:
            - 'for\s*\('
          msg: 'Loop over the array — two hand-written lines stop being right as soon as a third product arrives.'

      - name: Every Item, Transformed
        obj: 'Print a new array holding every price doubled.'
        expl: |
          `.map` builds a new array by running a function on each item and collecting what it returns. Same length, one result per item, original untouched.

          You could do this with a loop and a `.push`, and for a while you should be able to picture that loop underneath. But `map` says **what** you want in one line where the loop says **how**, and that difference is most of why real JavaScript looks the way it does.
        hint: '`prices.map(function (p) { return p * 2; })`, then print the result.'
        max: '5/1'
        web: js
        start: |
          let prices = [8, 5, 12];
          // Build the doubled list and print it
        sol: |
          let prices = [8, 5, 12];
          let doubled = prices.map(function (p) {
            return p * 2;
          });
          console.log(doubled);
        tests:
          - exp: |
              [16,10,24]
        checks:
          has:
            - '\.map\('
          msg: 'Use `.map` to build the new array.'

      - name: Only the Ones That Match
        obj: 'Print an array of the prices below 10.'
        expl: '`.filter` also runs your function on every item, but it keeps the item rather than the result: return `true` and it stays, return `false` and it is dropped. So `map` changes each item and `filter` chooses which ones survive — between them they cover most of what you will ever do to a list.'
        hint: '`prices.filter(function (p) { return p < 10; })`.'
        max: '5/1'
        web: js
        start: |
          let prices = [8, 5, 12, 3];
          // Keep the cheap ones and print them
        sol: |
          let prices = [8, 5, 12, 3];
          let cheap = prices.filter(function (p) {
            return p < 10;
          });
          console.log(cheap);
        tests:
          - exp: |
              [8,5,3]
        checks:
          has:
            - '\.filter\('
          msg: 'Use `.filter` to choose the items rather than picking them out by hand.'

      - name: Finding a Single One
        obj: 'Find the product called `Notebook` and print its price.'
        expl: '`.find` returns the first item your function says yes to — the item itself, not an array, and `undefined` when nothing matches. Reach for it when you want one thing: a user by id, a product by name. Note the triple equals: `===` compares without quietly converting types, and it is the comparison to use unless you have a specific reason not to.'
        hint: '`products.find(function (p) { return p.name === "Notebook"; })`, then print its `.price`.'
        max: '8/1'
        web: js
        start: |
          let products = [
            { name: "Mug", price: 8 },
            { name: "Notebook", price: 5 },
          ];
          // Find the notebook and print its price
        sol: |
          let products = [
            { name: "Mug", price: 8 },
            { name: "Notebook", price: 5 },
          ];
          let found = products.find(function (p) {
            return p.name === "Notebook";
          });
          console.log(found.price);
        tests:
          - exp: |
              5
        checks:
          has:
            - '\.find\('
          msg: 'Use `.find` to locate the product rather than reading it out of the array by position.'

      - name: Adding Them Up
        obj: 'Print the total of every price.'
        expl: |
          `.reduce` boils a whole array down to one value. Its function takes two things — the running total so far and the current item — and returns the new total; the `0` at the end is what the total starts at.

          It is the one that takes a moment to click. Read it as: start at zero, then for each price, the total becomes the total plus that price.
        hint: '`prices.reduce(function (total, p) { return total + p; }, 0)` — do not forget the `0`.'
        max: '5/1'
        web: js
        start: |
          let prices = [8, 5, 12];
          // Add them up and print the total
        sol: |
          let prices = [8, 5, 12];
          let total = prices.reduce(function (sum, p) {
            return sum + p;
          }, 0);
          console.log(total);
        tests:
          - exp: |
              25
        checks:
          has:
            - '\.reduce\('
          msg: 'Add the prices with `.reduce` rather than a total you work out yourself.'

      - name: Putting It Together
        obj: 'Print the names of the products under 10, separated by a comma and a space.'
        expl: 'Three steps, each one line: choose the cheap products, turn each into its name, join the names into text. Chained list operations read top to bottom like a sentence, and each step is small enough to print on its own when something comes out wrong — which is exactly how you should debug one.'
        hint: '`.filter` for the cheap ones, `.map` for their names, `.join(", ")` for the line.'
        max: '12/1'
        web: js
        start: |
          let products = [
            { name: "Mug", price: 8 },
            { name: "Lamp", price: 24 },
            { name: "Notebook", price: 5 },
          ];
          // Print the names of the cheap ones
        sol: |
          let products = [
            { name: "Mug", price: 8 },
            { name: "Lamp", price: 24 },
            { name: "Notebook", price: 5 },
          ];
          let cheap = products.filter(function (p) {
            return p.price < 10;
          });
          let names = cheap.map(function (p) {
            return p.name;
          });
          console.log(names.join(", "));
        tests:
          - exp: |
              Mug, Notebook
        checks:
          has:
            - '\.filter\('
            - '\.map\('
            - '\.join\('
          msg: 'All three: `.filter` to choose, `.map` to take the names, `.join` to make the line.'

  - name: The Document
    icon: display
    levels:
      - name: Finding an Element
        obj: 'Make the heading read `Welcome` instead of `Loading…`.'
        expl: |
          A page is not a picture, it is a tree of elements, and JavaScript can reach into it. `document.querySelector` takes a CSS selector — the same kind you write in a stylesheet — and hands you back the first element that matches. `#title` means "the element whose id is title".

          Once you hold an element, `.textContent` is the text inside it. Read it to find out what it says; assign to it to change what it says. Nothing about the file on disk changes: you are editing the page as it stands in the browser.
        hint: 'Select `#title`, then assign to its `.textContent`.'
        max: '1/1'
        web: js
        page: |
          <h1 id="title">Loading…</h1>
          <p>Your first page under program control.</p>
        start: |
          // Find the heading and change its text
        sol: |
          document.querySelector("#title").textContent = "Welcome";
        expect:
          - sel: '#title'
            text: 'Welcome'
        checks:
          has:
            - 'querySelector'
          msg: 'Find the heading with `document.querySelector` rather than any other route.'

      - name: Changing a Style
        obj: 'Turn the warning red — `#c0392b` — without touching the stylesheet.'
        expl: 'Every element carries a `.style` object holding its inline styles, and each CSS property is a name on it. The catch is spelling: a property with a hyphen loses it and capitalises the next word, so `background-color` becomes `backgroundColor` and `font-size` becomes `fontSize`. Plain `color` needs no such change. What you set here lands as an inline style, which is why it beats the stylesheet.'
        hint: '`element.style.color = "#c0392b";`'
        max: '1/1'
        web: js
        page: |
          <style>#warning { color: #7f8c8d; }</style>
          <p id="warning">Your session is about to expire.</p>
        start: |
          // Colour the warning
        sol: |
          document.querySelector("#warning").style.color = "#c0392b";
        expect:
          - sel: '#warning'
            style:
              color: '#c0392b'

      - name: Adding a Class
        obj: 'Mark the task as done by adding the class `done` to it. Keep the class it already has.'
        expl: 'Setting colours one property at a time gets old quickly. A **class** lets the stylesheet decide how something looks and leaves your code to say only what it *is*: `classList.add("done")` adds one, `.remove()` takes it away, and `.toggle()` flips it. Note that `element.className = "done"` would also add the class — by throwing away every other class the element had, which is the sort of thing that works on the day you write it.'
        hint: '`element.classList.add("done")` — `add`, not `className =`.'
        max: '1/1'
        web: js
        page: |
          <ul>
            <li class="task">Water the plants</li>
          </ul>
        start: |
          // Mark the task done
        sol: |
          document.querySelector(".task").classList.add("done");
        expect:
          - sel: '.task.done'
            count: 1
            msg: 'The task should end up with both classes — `task` and `done`. Adding a class must not remove the one already there.'

      - name: Changing an Attribute
        obj: 'Point the link at `https://developer.mozilla.org`.'
        expl: 'Attributes are the extra information in an element''s opening tag: `href` on a link, `src` on an image, `id` on anything. `setAttribute` writes one and `getAttribute` reads one back. A link whose `href` is `#` is a link that goes nowhere, which is exactly the placeholder a page starts life with.'
        hint: '`setAttribute("href", "https://developer.mozilla.org")`'
        max: '1/1'
        web: js
        page: |
          <p>Stuck on something? <a id="docs" href="#">Read the docs</a>.</p>
        start: |
          // Give the link a real destination
        sol: |
          document.querySelector("#docs").setAttribute("href", "https://developer.mozilla.org");
        expect:
          - sel: '#docs'
            attr:
              href: 'https://developer.mozilla.org'

      - name: Making a New Element
        obj: 'Add a third item to the list, reading `Eggs`.'
        expl: |
          Changing what is already there only goes so far; most pages have to grow. Building an element takes three steps, and it is worth knowing that they are three separate things:

          `document.createElement("li")` makes the element — but it is nowhere yet, floating free of the page. Setting its `.textContent` fills it in. Only `appendChild` puts it into the document, as the last child of whatever you append it to. Skip the last step and your element exists, perfectly, invisibly.
        hint: 'Create it, give it text, then append it to `#list`.'
        max: '3/1'
        web: js
        page: |
          <ul id="list">
            <li>Bread</li>
            <li>Milk</li>
          </ul>
        start: |
          // Create the item, fill it in, then add it to the list
        sol: |
          let item = document.createElement("li");
          item.textContent = "Eggs";
          document.querySelector("#list").appendChild(item);
        expect:
          - sel: '#list li'
            count: 3
          - sel: '#list li:last-child'
            text: 'Eggs'
        checks:
          has:
            - 'createElement'
          msg: 'Build the item with `document.createElement` rather than writing it into the page as text.'

      - name: Removing an Element
        obj: 'Get rid of the dismissed notice, leaving the rest of the page alone.'
        expl: 'An element knows how to take itself out of the page: `.remove()` and it is gone, along with everything inside it. There is no need to find its parent first, which is how this used to be done and is still what you will see in older code.'
        hint: 'Select `#notice`, then call `.remove()` on it.'
        max: '1/1'
        web: js
        page: |
          <p id="notice">This notice has been dismissed.</p>
          <p id="keep">This paragraph should stay.</p>
        start: |
          // Remove the notice
        sol: |
          document.querySelector("#notice").remove();
        expect:
          - sel: '#notice'
            count: 0
            msg: 'The notice should be gone from the page.'
          - sel: '#keep'
            count: 1
            msg: 'Only the notice should go — the other paragraph has to stay.'

      - name: Several Elements at Once
        obj: 'Add the class `done` to every item in the list.'
        expl: '`querySelector` gives you the first match and stops. `querySelectorAll` gives you all of them, in a list you can walk with `for ... of`. This is where the DOM starts paying for itself: the same three lines handle three items or three hundred, and you never have to know which in advance.'
        hint: 'Loop over `document.querySelectorAll(".item")` and add the class to each one.'
        max: '4/1'
        web: js
        page: |
          <ul>
            <li class="item">Wash up</li>
            <li class="item">Take out the bins</li>
            <li class="item">Ring the dentist</li>
          </ul>
        start: |
          let items = document.querySelectorAll(".item");
          // Mark each one done
        sol: |
          let items = document.querySelectorAll(".item");
          for (let item of items) {
            item.classList.add("done");
          }
        expect:
          - sel: '.item.done'
            count: 3
            msg: 'All three items should end up with the `done` class.'
        checks:
          has:
            - 'for\s*\('
          msg: 'Loop over the items rather than adding the class to each one by hand.'

      - name: Reacting to a Click
        obj: 'When the button is clicked, the paragraph should read `Hello!`.'
        expl: |
          Everything so far ran once, the moment the page loaded. `addEventListener` is how a page starts waiting: you name an event and hand over a function, and the browser calls that function each time the event happens.

          The function you pass is not called by you. You are handing it over to be called later, possibly never, possibly a hundred times — which is why the paragraph must be changed *inside* it rather than beside it.
        hint: '`button.addEventListener("click", function () { ... })`, and change the text inside that function.'
        max: '4/1'
        web: js
        page: |
          <button id="go">Say hello</button>
          <p id="out">Nothing yet</p>
        start: |
          let button = document.querySelector("#go");
          // Listen for a click, and change #out when it happens
        sol: |
          let button = document.querySelector("#go");
          button.addEventListener("click", function () {
            document.querySelector("#out").textContent = "Hello!";
          });
        act:
          - sel: '#go'
        expect:
          - sel: '#out'
            text: 'Hello!'
        checks:
          has:
            - 'addEventListener'
          msg: 'The paragraph has to change *because* of the click — use `addEventListener` rather than setting the text as the page loads.'

      - name: Reading What Was Typed
        obj: 'As the visitor types their name, the greeting should read `Hello, ` then the name, then `!`.'
        expl: 'An input carries what is currently in it as its `.value`, and fires an `input` event every time that changes. Read the value inside the listener, never outside it: outside, the page has only just loaded and the box is still empty. This pair — an event to know *when*, a property to know *what* — is most of what interactive means.'
        hint: 'Listen for `"input"` on the box, then build the greeting from `box.value` with a template string.'
        max: '4/1'
        web: js
        page: |
          <input id="name" value="">
          <p id="greeting">Hello, stranger!</p>
        start: |
          let box = document.querySelector("#name");
          // Greet whoever is typing
        sol: |
          let box = document.querySelector("#name");
          box.addEventListener("input", function () {
            document.querySelector("#greeting").textContent = `Hello, ${box.value}!`;
          });
        act:
          - sel: '#name'
            type: 'Ada'
        expect:
          - sel: '#greeting'
            text: 'Hello, Ada!'
        checks:
          has:
            - 'addEventListener'
            - '\.value'
          msg: 'Read the name from the box''s `.value` inside an `input` listener.'

      - name: Putting It Together
        obj: 'Make the list work: when `Add` is clicked, a new item holding whatever is in the box should appear at the end of the list.'
        hint: 'Listen for a click on the button. Inside, read `.value`, create an `li`, fill it in, and append it to `#list`.'
        max: '7/1'
        web: js
        page: |
          <input id="task" value="">
          <button id="add">Add</button>
          <ul id="list"></ul>
        start: |
          let button = document.querySelector("#add");
          let box = document.querySelector("#task");
          // Add a list item when the button is clicked
        sol: |
          let button = document.querySelector("#add");
          let box = document.querySelector("#task");
          button.addEventListener("click", function () {
            let item = document.createElement("li");
            item.textContent = box.value;
            document.querySelector("#list").appendChild(item);
          });
        act:
          - sel: '#task'
            type: 'Buy milk'
          - sel: '#add'
        expect:
          - sel: '#list li'
            count: 1
            msg: 'Clicking Add should put exactly one new item in the list.'
          - sel: '#list li'
            text: 'Buy milk'
            msg: 'The new item should hold whatever was typed in the box, not a fixed piece of text.'
        checks:
          has:
            - 'addEventListener'
            - 'createElement'
            - '\.value'
          msg: 'You need all three: a click listener, a new element built with `createElement`, and the box''s `.value` for its text.'

  # Every level in this chapter is graded AFTER the page has been used: the
  # `act:` block clicks or types first, exactly as a visitor would, and only then
  # are the expectations checked. A page that is already correct when it loads is
  # not what any of these levels are asking for.
  - name: Events and Forms
    icon: event
    levels:
      - name: Counting Clicks
        obj: 'Count the clicks: each click on the button should put the new total in the paragraph.'
        expl: |
          The listener runs again on every click, so anything it needs to remember has to live **outside** it. `let count = 0;` before the listener is created once; `count = count + 1` inside runs each time.

          Declare the counter inside the function instead and it is created fresh on every click, so it goes 1, 1, 1 — a bug worth meeting once on purpose.
        hint: 'Create `count` before the listener, add one to it inside, then write it into `#count`.'
        max: '6/1'
        web: js
        page: |
          <button id="tap">Tap</button>
          <p id="count">0</p>
        start: |
          let count = 0;
          // Add one on every click and show the total
        sol: |
          let count = 0;
          document.querySelector("#tap").addEventListener("click", function () {
            count = count + 1;
            document.querySelector("#count").textContent = count;
          });
        act:
          - sel: '#tap'
          - sel: '#tap'
        expect:
          - sel: '#count'
            text: '2'
            msg: 'After two clicks the paragraph should read 2. If it reads 1, the counter is being created again inside the listener.'
        checks:
          has:
            - 'addEventListener'
          msg: 'The total has to change because of the clicks — use `addEventListener`.'

      - name: The Element That Was Clicked
        obj: 'When any chip is clicked, the paragraph should show that chip''s text.'
        expl: 'The browser hands your listener an **event object** describing what happened, and `event.target` is the element it happened to. That is what lets one function serve three buttons: instead of asking "which button was this listener attached to?", ask the event which element was actually clicked.'
        hint: 'Give the function a parameter — `function (event) { ... }` — then read `event.target.textContent`.'
        max: '7/1'
        web: js
        page: |
          <div id="chips">
            <button class="chip">Red</button>
            <button class="chip">Green</button>
            <button class="chip">Blue</button>
          </div>
          <p id="picked">Nothing picked</p>
        start: |
          let chips = document.querySelectorAll(".chip");
          // Show the text of whichever chip was clicked
        sol: |
          let chips = document.querySelectorAll(".chip");
          for (let chip of chips) {
            chip.addEventListener("click", function (event) {
              document.querySelector("#picked").textContent = event.target.textContent;
            });
          }
        act:
          - sel: '#chips .chip:last-child'
        expect:
          - sel: '#picked'
            text: 'Blue'
            msg: 'Clicking the last chip should show its own text — read it from the event rather than fixing it in the code.'
        checks:
          has:
            - 'target'
          msg: 'Read the clicked element from the event object, e.g. `event.target`.'

      - name: Turning a Class On and Off
        obj: 'Each click on the button should switch the `highlight` class on the note.'
        expl: '`classList.toggle` adds the class when it is absent and removes it when it is present. Written with `add` you get a button that works once; written with an `if` around `contains` you get four lines that do what `toggle` does in one. It is a small thing, but this pattern — open/closed, shown/hidden, selected/not — is behind a large share of the interface you use every day.'
        hint: '`note.classList.toggle("highlight")` inside the click listener.'
        max: '5/1'
        web: js
        page: |
          <style>.highlight { background-color: #fff3bf; }</style>
          <button id="toggle">Toggle</button>
          <p id="note" class="note">Something worth noticing.</p>
        start: |
          let note = document.querySelector("#note");
          // Switch the highlight class on each click
        sol: |
          let note = document.querySelector("#note");
          document.querySelector("#toggle").addEventListener("click", function () {
            note.classList.toggle("highlight");
          });
        act:
          - sel: '#toggle'
        expect:
          - sel: '#note.highlight'
            count: 1
            msg: 'After one click the note should carry the `highlight` class.'
        checks:
          has:
            - 'classList\.toggle'
          msg: 'Use `classList.toggle` so a second click takes the class off again.'

      - name: Choosing From a Menu
        obj: 'When a size is chosen, the paragraph should show the chosen value.'
        expl: 'A `select` carries the value of the chosen option as its `.value`, and fires a `change` event when the choice changes — `change` rather than `input`, because a menu changes once when you pick, not continuously as you browse. The value is the option''s `value` attribute, which is deliberately not the same thing as the text the visitor reads.'
        hint: 'Listen for `"change"` on `#size` and write `size.value` into `#chosen`.'
        max: '5/1'
        web: js
        page: |
          <select id="size">
            <option value="small">Small</option>
            <option value="large">Large</option>
          </select>
          <p id="chosen">Nothing chosen</p>
        start: |
          let size = document.querySelector("#size");
          // Show the chosen size
        sol: |
          let size = document.querySelector("#size");
          size.addEventListener("change", function () {
            document.querySelector("#chosen").textContent = size.value;
          });
        act:
          - sel: '#size'
            type: 'large'
        expect:
          - sel: '#chosen'
            text: 'large'
            msg: 'The paragraph should show the value of the option that was chosen.'
        checks:
          has:
            - '\.value'
          msg: 'Read the choice from the menu''s `.value`.'

      - name: Two Boxes, One Answer
        obj: 'Show the total of the two boxes, updating as either one is typed in.'
        expl: |
          Two things worth taking from this. First, one function can serve both listeners — write `update` once and hand the same function to each box, rather than writing it twice and fixing a bug in one of them later.

          Second, `.value` is always text, even in a box the browser calls a number. `"3" + "4"` is `"34"`, which is a wrong answer that looks like a typo. `Number(...)` converts, and doing it as you read is the habit to build.
        hint: 'Write `update`, then pass it to `addEventListener("input", update)` on both boxes.'
        max: '8/1'
        web: js
        page: |
          <input id="a" value="0">
          <input id="b" value="0">
          <p id="sum">0</p>
        start: |
          let a = document.querySelector("#a");
          let b = document.querySelector("#b");
          // Keep #sum showing a + b
        sol: |
          let a = document.querySelector("#a");
          let b = document.querySelector("#b");
          function update() {
            document.querySelector("#sum").textContent = Number(a.value) + Number(b.value);
          }
          a.addEventListener("input", update);
          b.addEventListener("input", update);
        act:
          - sel: '#a'
            type: '3'
          - sel: '#b'
            type: '4'
        expect:
          - sel: '#sum'
            text: '7'
            msg: 'Typing 3 and 4 should show 7. Showing 34 means the values were joined as text instead of added as numbers.'
        checks:
          has:
            - 'Number\('
          msg: 'Convert each `.value` with `Number(...)` before adding them.'

      - name: A Form That Stays Put
        obj: 'When the form is submitted, greet the address in the box instead of letting the page reload.'
        expl: |
          A form''s default behaviour is to send itself to a server and load the page that answers. That predates JavaScript and is still the default, so a form you meant to handle yourself will wipe the page out from under you.

          `event.preventDefault()` cancels that default and leaves the rest of your listener to do the work. Listen for `submit` on the form rather than `click` on the button: pressing Enter in the box submits too, and a click listener never hears about it.
        hint: 'Listen for `"submit"` on `#signup`, call `event.preventDefault()` first, then write the message.'
        max: '7/1'
        web: js
        page: |
          <form id="signup">
            <input id="email" value="">
            <button type="submit">Join</button>
          </form>
          <p id="msg">Nothing yet</p>
        start: |
          let email = document.querySelector("#email");
          // Handle the submit yourself
        sol: |
          let email = document.querySelector("#email");
          document.querySelector("#signup").addEventListener("submit", function (event) {
            event.preventDefault();
            document.querySelector("#msg").textContent = `Thanks, ${email.value}!`;
          });
        act:
          - sel: '#email'
            type: 'ada@example.com'
          - sel: '#signup'
            event: 'submit'
        expect:
          - sel: '#msg'
            text: 'Thanks, ada@example.com!'
            msg: 'Submitting should greet whatever address was typed.'
        checks:
          has:
            - 'preventDefault'
            - 'submit'
          msg: 'Listen for the form''s `submit` event and cancel its default with `event.preventDefault()`.'

      - name: One Listener for Many Items
        obj: 'Clicking any item in the list should show that item''s text. Attach a single listener, to the list itself.'
        expl: |
          Events travel upwards: click an `li` and the click reaches the `ul` too. So one listener on the list hears about every item, and `event.target` says which one — no loop, and no need to know how many items there are.

          The real payoff is items that do not exist yet. Attach listeners to each `li` and an item added five minutes later is dead; attach one to the list and it works, because the listener was never about the items in the first place.
        hint: 'One `addEventListener` on `#list`, then read `event.target.textContent`.'
        max: '4/1'
        web: js
        page: |
          <ul id="list">
            <li>Bread</li>
            <li>Milk</li>
            <li>Eggs</li>
          </ul>
          <p id="picked">Nothing picked</p>
        start: |
          let list = document.querySelector("#list");
          // One listener on the list, please
        sol: |
          let list = document.querySelector("#list");
          list.addEventListener("click", function (event) {
            document.querySelector("#picked").textContent = event.target.textContent;
          });
        act:
          - sel: '#list li:nth-child(2)'
        expect:
          - sel: '#picked'
            text: 'Milk'
            msg: 'Clicking the second item should show its text.'
        checks:
          no:
            - 'querySelectorAll'
          msg: 'One listener on the list itself — no looping over the items.'

      - name: Removing on Click
        obj: 'Each Remove button should take its own row out of the list.'
        expl: 'The button is inside the row, so the thing to remove is not the button but its `parentElement`. This is the moment the DOM stops being a list of elements you look things up in and starts being a tree you move around in: from any element you can reach its parent, its children and its siblings.'
        hint: 'Loop over the buttons, and in each listener call `.remove()` on the button''s `parentElement`.'
        max: '7/1'
        web: js
        page: |
          <ul id="list">
            <li>Bread <button class="remove">Remove</button></li>
            <li>Milk <button class="remove">Remove</button></li>
            <li>Eggs <button class="remove">Remove</button></li>
          </ul>
        start: |
          let buttons = document.querySelectorAll(".remove");
          // Make each button remove its own row
        sol: |
          let buttons = document.querySelectorAll(".remove");
          for (let button of buttons) {
            button.addEventListener("click", function () {
              button.parentElement.remove();
            });
          }
        act:
          - sel: '#list li:first-child .remove'
        expect:
          - sel: '#list li'
            count: 2
            msg: 'Clicking one Remove button should leave exactly two rows.'
          - sel: '#list li:first-child'
            contains: 'Milk'
            msg: 'The row that was removed should be the one whose button was clicked.'
        checks:
          has:
            - 'parentElement|parentNode|closest'
          msg: 'Remove the row, not the button — reach up to it with `parentElement`.'

      - name: Enabling a Button
        obj: 'The Save button starts disabled. Enable it once the box has something in it.'
        expl: 'A disabled button is one carrying the `disabled` attribute, so enabling it means taking that attribute off: `removeAttribute("disabled")`. Doing this from an `input` listener is how a form guides someone through it — the control that is not yet usable says so, instead of accepting a click and complaining afterwards.'
        hint: 'On `"input"`, `removeAttribute("disabled")` when `box.value` is not empty.'
        max: '9/1'
        web: js
        page: |
          <input id="name" value="">
          <button id="save" disabled>Save</button>
        start: |
          let box = document.querySelector("#name");
          let save = document.querySelector("#save");
          // Enable Save once something has been typed
        sol: |
          let box = document.querySelector("#name");
          let save = document.querySelector("#save");
          box.addEventListener("input", function () {
            if (box.value !== "") {
              save.removeAttribute("disabled");
            } else {
              save.setAttribute("disabled", "");
            }
          });
        act:
          - sel: '#name'
            type: 'Ada'
        expect:
          - sel: '#save:not([disabled])'
            count: 1
            msg: 'After typing a name the Save button should no longer be disabled.'
        checks:
          has:
            - 'removeAttribute'
          msg: 'Take the attribute off with `removeAttribute("disabled")`.'

      - name: Putting It Together
        obj: 'Make the form work: each submission should add the typed task to the list and update the count to read `N tasks`.'
        expl: 'Everything from this chapter at once — a submit listener that stays put, a new element built and appended, and a second piece of the page kept in step with the first. Note the count comes from the list itself: read `list.children.length` after appending, rather than keeping a separate counter that can drift out of agreement with what is on screen.'
        hint: 'Prevent the default, create an `li` from `box.value`, append it, then set `#count` from `list.children.length`.'
        max: '12/1'
        web: js
        page: |
          <form id="add-form">
            <input id="task" value="">
            <button type="submit">Add</button>
          </form>
          <ul id="list"></ul>
          <p id="count">0 tasks</p>
        start: |
          let box = document.querySelector("#task");
          let list = document.querySelector("#list");
          // Add the task and keep the count right
        sol: |
          let box = document.querySelector("#task");
          let list = document.querySelector("#list");
          document.querySelector("#add-form").addEventListener("submit", function (event) {
            event.preventDefault();
            let item = document.createElement("li");
            item.textContent = box.value;
            list.appendChild(item);
            document.querySelector("#count").textContent = `${list.children.length} tasks`;
          });
        act:
          - sel: '#task'
            type: 'Buy milk'
          - sel: '#add-form'
            event: 'submit'
          - sel: '#task'
            type: 'Ring the dentist'
          - sel: '#add-form'
            event: 'submit'
        expect:
          - sel: '#list li'
            count: 2
            msg: 'Two submissions should leave two items in the list.'
          - sel: '#list li:last-child'
            text: 'Ring the dentist'
            msg: 'Each item should hold what was typed at the time, not a fixed piece of text.'
          - sel: '#count'
            text: '2 tasks'
            msg: 'The count should follow the list — after two submissions it should read "2 tasks".'
        checks:
          has:
            - 'preventDefault'
            - 'createElement'
          msg: 'You need both: cancel the form''s default, and build each item with `createElement`.'
