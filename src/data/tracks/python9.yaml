      - name: One Row by Id
        id: 19
        obj: 'Answer `GET /notes/<int:id>` with that row as a dictionary, and `abort(404)` when the query finds nothing.'
        expl: '`WHERE id = ?` asks the database to do the searching, which is the whole reason for having one — it can use the index on `id` and never look at the other rows. `.fetchone()` returns `None` when there is no match, and that `None` is what becomes your 404.'
        hint: 'The values go in a tuple as the second argument: `db.execute(sql, (id,))`. The trailing comma is what makes it a tuple.'
        max: 15/2
        req:
          - 'GET /notes/1'
          - 'GET /notes/9'
        start: |-
          import sqlite3

          from miniweb import MiniWeb, abort

          app = MiniWeb()

          db = sqlite3.connect(":memory:")
          db.execute("CREATE TABLE notes (id INTEGER PRIMARY KEY, text TEXT)")
          db.execute("INSERT INTO notes (text) VALUES ('buy milk')")
          db.execute("INSERT INTO notes (text) VALUES ('walk the dog')")

          # Answer GET /notes/<int:id>, or 404.
        sol: |-
          import sqlite3

          from miniweb import MiniWeb, abort

          app = MiniWeb()

          db = sqlite3.connect(":memory:")
          db.execute("CREATE TABLE notes (id INTEGER PRIMARY KEY, text TEXT)")
          db.execute("INSERT INTO notes (text) VALUES ('buy milk')")
          db.execute("INSERT INTO notes (text) VALUES ('walk the dog')")


          @app.get("/notes/<int:id>")
          def get_note(id):
              row = db.execute("SELECT id, text FROM notes WHERE id = ?", (id,)).fetchone()
              if row is None:
                  abort(404)
              return {"id": row[0], "text": row[1]}
