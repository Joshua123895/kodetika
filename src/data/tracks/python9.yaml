  - name: Guarding the Door
    icon: warning
    lib: miniweb
    levels:
      - name: Validating What Arrives
        id: 25
        obj: 'Answer `POST /notes` with `saved` and `201`, but first reject a body with no `text` using `abort(400, "text is required")`.'
        expl: |-
          This chapter teaches the *shape* of authentication and input handling — enough to understand what real systems do and why. Production password and session handling belongs to a library that has been reviewed by people who do this for a living.

          Start here: never trust the body. Anything can be posted to your URL, including nothing at all, and a handler that assumes `request.json["text"]` exists crashes into a 500 — your fault, according to the status code, when the request was the broken thing.
        hint: '`request.json or {}` handles an empty body, then check for the key before using it.'
        max: 13/2
        req:
          - { m: POST, p: /notes, json: { text: 'buy milk' } }
          - { m: POST, p: /notes, json: { note: 'buy milk' } }
        start: |-
          from miniweb import MiniWeb, request, abort

          app = MiniWeb()

          # Answer POST /notes, rejecting a body with no text.
        sol: |-
          from miniweb import MiniWeb, request, abort

          app = MiniWeb()


          @app.post("/notes")
          def add_note():
              body = request.json or {}
              if "text" not in body:
                  abort(400, "text is required")
              return "saved", 201
        tests:
          - exp: |
              POST /notes -> 201 Created
              saved
              POST /notes -> 400 Bad Request
              {"error": "text is required"}
      - name: Types That Must Match
        id: 26
        obj: 'Answer `POST /orders` with `ordered 3` when `quantity` is a whole number, and `abort(400, "quantity must be a whole number")` when it is anything else.'
        expl: 'JSON has real types, so `{"quantity": "three"}` arrives as a `str` and `{"quantity": 2.5}` as a `float` — both pass an "is it there" check and both break the code that follows. `isinstance` asks the right question. Watch out for `bool`: in Python `True` *is* an `int`, so a strict check has to exclude it.'
        hint: '`isinstance(quantity, bool) or not isinstance(quantity, int)` is the rejection test.'
        max: 14/2
        req:
          - { m: POST, p: /orders, json: { quantity: 3 } }
          - { m: POST, p: /orders, json: { quantity: 'three' } }
          - { m: POST, p: /orders, json: { quantity: true } }
        start: |-
          from miniweb import MiniWeb, request, abort

          app = MiniWeb()

          # Answer POST /orders only for a whole-number quantity.
        sol: |-
          from miniweb import MiniWeb, request, abort

          app = MiniWeb()


          @app.post("/orders")
          def order():
              quantity = (request.json or {}).get("quantity")
              if isinstance(quantity, bool) or not isinstance(quantity, int):
                  abort(400, "quantity must be a whole number")
              return "ordered " + str(quantity)
        tests:
          - exp: |
              POST /orders -> 200 OK
              ordered 3
              POST /orders -> 400 Bad Request
              {"error": "quantity must be a whole number"}
              POST /orders -> 400 Bad Request
              {"error": "quantity must be a whole number"}
      - name: A Password, Hashed
        id: 27
        obj: 'Print the SHA-256 hex digest of the password `hunter2`, then print it again for `hunter3`.'
        expl: 'A server must never keep the password itself, because a stolen database then hands the attacker every account. A **hash** goes one way: easy to compute, infeasible to reverse. To check a login you hash what was typed and compare digests. Notice how one changed character rewrites the whole digest — that is deliberate.'
        hint: '`hashlib.sha256(password.encode()).hexdigest()`. `.encode()` is needed because hashing works on bytes.'
        max: 7/2
        start: |-
          import hashlib

          # Print the SHA-256 digest of each password.
        sol: |-
          import hashlib

          for password in ("hunter2", "hunter3"):
              print(hashlib.sha256(password.encode()).hexdigest())
        tests:
          - exp: |
              f52fbd32b2b3b86ff88ef6c490628285f482af15ddcb29541f94bcf526a3f6c7
              fb8c2e2b85ca81eb4350199faddd983cb26af3064614e737ea9f479621cfa57a
      - name: Salt, Not Just a Hash
        id: 28
        obj: 'Hash `hunter2` with `hashlib.pbkdf2_hmac`, using SHA-256, the salt `b"kitchen"` and 100000 iterations, and print the result as hex. Then print it again with the salt `b"garden"`.'
        expl: |-
          A plain hash has two problems. It is fast, so an attacker can try billions of guesses a second; and it is fixed, so two users with the same password have the same digest and one cracked entry unlocks both.

          A **salt** is random data stored beside the hash, which makes every entry unique. The iteration count makes each guess deliberately slow. That is what `pbkdf2_hmac` is: the same hash, salted, run a hundred thousand times.
        hint: '`hashlib.pbkdf2_hmac("sha256", b"hunter2", salt, 100000).hex()`.'
        max: 7/2
        start: |-
          import hashlib

          # Print the salted, stretched hash for each salt.
        sol: |-
          import hashlib

          for salt in (b"kitchen", b"garden"):
              print(hashlib.pbkdf2_hmac("sha256", b"hunter2", salt, 100000).hex())
        tests:
          - exp: |
              cf2b1205a53d8e83cfe1c9c5f4f5087d6324c32d0601840b554aa3a04c8abd81
              1fd47227df16c3fae0cdc408d156dbac66383bfd3bec290e752a604e96103a7c
      - name: A Token to Carry
        id: 29
        obj: 'Answer `POST /login` with a JSON object whose `token` field is a fresh `secrets.token_hex(8)`.'
        expl: |-
          Sending the password with every single request would mean handling it constantly and logging it accidentally. Instead, logging in once trades the password for a **token**: a long random string the client sends afterwards, which the server can revoke without changing anyone''s password.

          `secrets` is the right module for this, not `random`. `random` is built to be fast and repeatable, which for a token means guessable.
        hint: '`secrets.token_hex(8)` gives sixteen hex characters. Return a dict with it under `token`.'
        max: 10/2
        req:
          - 'POST /login'
        start: |-
          import secrets

          from miniweb import MiniWeb

          app = MiniWeb()

          # Answer POST /login with a fresh token.
        sol: |-
          import secrets

          from miniweb import MiniWeb

          app = MiniWeb()


          @app.post("/login")
          def login():
              return {"token": secrets.token_hex(8)}
        tests:
          # A token that came out the same every run would not be a secret, so
          # this level is graded on the shape of the answer rather than its text.
          - match: '^POST /login -> 200 OK\n\{"token": "[0-9a-f]{16}"\}\s*$'
      - name: Checking the Token
        id: 30
        obj: 'Answer `GET /secret` with `the answer is 42` when the `Authorization` header is exactly `Bearer ` followed by `TOKEN`, and `abort(401)` otherwise.'
        expl: '`Authorization: Bearer <token>` is the standard way to carry one — "bearer" meaning whoever holds it gets in, which is why it travels only over HTTPS. `401 Unauthorized` means "I do not know who you are"; its neighbour `403 Forbidden` means "I know exactly who you are, and no".'
        hint: 'Read `request.headers.get("Authorization", "")` and compare it to `"Bearer " + TOKEN`.'
        max: 13/2
        req:
          - { m: GET, p: /secret, hdr: { Authorization: 'Bearer s3cr3t' } }
          - { m: GET, p: /secret, hdr: { Authorization: 'Bearer wrong' } }
          - 'GET /secret'
        start: |-
          from miniweb import MiniWeb, request, abort

          app = MiniWeb()

          TOKEN = "s3cr3t"

          # Answer GET /secret only for the right bearer token.
        sol: |-
          from miniweb import MiniWeb, request, abort

          app = MiniWeb()

          TOKEN = "s3cr3t"


          @app.get("/secret")
          def secret():
              if request.headers.get("Authorization", "") != "Bearer " + TOKEN:
                  abort(401)
              return "the answer is 42"
        tests:
          - exp: |
              GET /secret -> 200 OK
              the answer is 42
              GET /secret -> 401 Unauthorized
              {"error": "Unauthorized"}
              GET /secret -> 401 Unauthorized
              {"error": "Unauthorized"}
      - name: Comparing Secrets Safely
        id: 31
        obj: 'Rewrite the check to compare the token with `hmac.compare_digest` instead of `==`.'
        expl: |-
          `==` on strings stops at the first character that differs, so a wrong guess starting with the right letter takes measurably longer to reject. Repeat that measurement enough times and an attacker recovers the token one character at a time. This is a **timing attack**.

          `hmac.compare_digest` always looks at everything, so the time it takes says nothing about how close the guess was.
        hint: '`hmac.compare_digest(sent, "Bearer " + TOKEN)` returns a bool — abort when it is false.'
        max: 14/2
        checks:
          has: ['compare_digest']
        req:
          - { m: GET, p: /secret, hdr: { Authorization: 'Bearer s3cr3t' } }
          - { m: GET, p: /secret, hdr: { Authorization: 'Bearer wrong' } }
        start: |-
          import hmac

          from miniweb import MiniWeb, request, abort

          app = MiniWeb()

          TOKEN = "s3cr3t"


          @app.get("/secret")
          def secret():
              sent = request.headers.get("Authorization", "")
              if sent != "Bearer " + TOKEN:
                  abort(401)
              return "the answer is 42"
        sol: |-
          import hmac

          from miniweb import MiniWeb, request, abort

          app = MiniWeb()

          TOKEN = "s3cr3t"


          @app.get("/secret")
          def secret():
              sent = request.headers.get("Authorization", "")
              if not hmac.compare_digest(sent, "Bearer " + TOKEN):
                  abort(401)
              return "the answer is 42"
        tests:
          - exp: |
              GET /secret -> 200 OK
              the answer is 42
              GET /secret -> 401 Unauthorized
              {"error": "Unauthorized"}
      - name: Who Am I
        id: 32
        obj: 'Answer `GET /me` with the name belonging to the token in the `Authorization` header, looked up in `USERS`, and `abort(401)` when the token is unknown.'
        expl: 'A token is not just a password substitute — it *identifies* someone. Looking it up turns "is this request allowed" into "who is this request from", which is what lets one handler serve every user their own data. In a real system this lookup hits a session store, and the rest of the handler looks exactly like this.'
        hint: 'Strip the `Bearer ` prefix off the header, then look the rest up in `USERS`.'
        max: 15/2
        req:
          - { m: GET, p: /me, hdr: { Authorization: 'Bearer aaa' } }
          - { m: GET, p: /me, hdr: { Authorization: 'Bearer bbb' } }
          - { m: GET, p: /me, hdr: { Authorization: 'Bearer zzz' } }
        start: |-
          from miniweb import MiniWeb, request, abort

          app = MiniWeb()

          USERS = {"aaa": "Ada", "bbb": "Grace"}

          # Answer GET /me with the name behind the token.
        sol: |-
          from miniweb import MiniWeb, request, abort

          app = MiniWeb()

          USERS = {"aaa": "Ada", "bbb": "Grace"}


          @app.get("/me")
          def me():
              sent = request.headers.get("Authorization", "")
              name = USERS.get(sent.replace("Bearer ", "", 1))
              if name is None:
                  abort(401)
              return name
        tests:
          - exp: |
              GET /me -> 200 OK
              Ada
              GET /me -> 200 OK
              Grace
              GET /me -> 401 Unauthorized
              {"error": "Unauthorized"}
  - name: Under the Lid
    icon: project
    lib: miniweb
    levels:
      - name: The App Is Callable
        id: 33
        obj: 'Call `app` yourself as `app(environ, start_response)` with the given `environ`, print the status your `start_response` was handed, then print the body it returned, decoded.'
        expl: |-
          `app.test_client()` has been hiding one line all along. An application is a **callable** taking two arguments: a dictionary describing the request, and a function to call with the status and headers. It returns the body as a list of byte strings.

          That contract is **WSGI**, and it is why Flask, Django and your `miniweb` app can all run behind the same servers. There is nothing else to it.
        hint: 'Write `start_response(status, headers)` to stash the status somewhere you can print. The return value is a list, so `b"".join(chunks).decode()` is the body.'
        max: 22/3
        start: |-
          import io

          from miniweb import MiniWeb

          app = MiniWeb()


          @app.get("/hello")
          def hello():
              return "Hello!"


          environ = {
              "REQUEST_METHOD": "GET",
              "PATH_INFO": "/hello",
              "QUERY_STRING": "",
              "wsgi.input": io.BytesIO(b""),
          }

          # Call app yourself, then print the status and the body.
        sol: |-
          import io

          from miniweb import MiniWeb

          app = MiniWeb()


          @app.get("/hello")
          def hello():
              return "Hello!"


          environ = {
              "REQUEST_METHOD": "GET",
              "PATH_INFO": "/hello",
              "QUERY_STRING": "",
              "wsgi.input": io.BytesIO(b""),
          }

          seen = {}


          def start_response(status, headers):
              seen["status"] = status


          chunks = app(environ, start_response)
          print(seen["status"])
          print(b"".join(chunks).decode())
        tests:
          - exp: |
              200 OK
              Hello!
      - name: The Environ Dictionary
        id: 34
        obj: 'Build the `environ` for `GET /search?q=cats` yourself and call the app with it, printing the body. Print the environ''s keys sorted first.'
        expl: '`environ` is what a real server builds after reading the request off a socket: the method, the path, the query string, and a file-like object holding the body. Every convenience you have used — `request.args`, `request.json` — is derived from these few keys. Build one by hand once and the rest stops being magic.'
        hint: 'The query string goes in `QUERY_STRING` without the `?`. `wsgi.input` can be `io.BytesIO(b"")` when there is no body.'
        max: 24/3
        start: |-
          import io

          from miniweb import MiniWeb, request

          app = MiniWeb()


          @app.get("/search")
          def search():
              return "searching for " + request.args.get("q", "nothing")


          def start_response(status, headers):
              pass


          # Build the environ for GET /search?q=cats, print sorted(environ),
          # then call the app and print the body.
        sol: |-
          import io

          from miniweb import MiniWeb, request

          app = MiniWeb()


          @app.get("/search")
          def search():
              return "searching for " + request.args.get("q", "nothing")


          def start_response(status, headers):
              pass


          environ = {
              "PATH_INFO": "/search",
              "QUERY_STRING": "q=cats",
              "REQUEST_METHOD": "GET",
              "wsgi.input": io.BytesIO(b""),
          }
          print(sorted(environ))
          print(b"".join(app(environ, start_response)).decode())
        tests:
          - exp: |
              ['PATH_INFO', 'QUERY_STRING', 'REQUEST_METHOD', 'wsgi.input']
              searching for cats
      - name: A Wrapper Around Everything
        id: 35
        obj: 'Finish `PoweredBy.__call__` so it passes the request through to the wrapped app but adds the header `X-Powered-By: miniweb` to every response.'
        expl: 'Because an application is just a callable, anything with the same shape can stand in front of one — that is **middleware**. Logging, compression, authentication and request timing are all built this way, wrapping the app rather than editing it. The trick is wrapping `start_response` too, since that is where the headers pass by.'
        hint: 'Define an inner `start(status, headers)` that appends `("X-Powered-By", "miniweb")` to the list and then calls the real `start_response`. Pass `start` down to the wrapped app.'
        max: 26/3
        app: site
        see:
          - X-Powered-By
        req:
          - 'GET /'
        start: |-
          from miniweb import MiniWeb, TestClient

          app = MiniWeb()


          @app.get("/")
          def home():
              return "Hello!"


          class PoweredBy:
              def __init__(self, wrapped):
                  self.wrapped = wrapped

              def __call__(self, environ, start_response):
                  # Add the X-Powered-By header, then pass the call through.
                  pass

              def test_client(self):
                  return TestClient(self)


          site = PoweredBy(app)
        sol: |-
          from miniweb import MiniWeb, TestClient

          app = MiniWeb()


          @app.get("/")
          def home():
              return "Hello!"


          class PoweredBy:
              def __init__(self, wrapped):
                  self.wrapped = wrapped

              def __call__(self, environ, start_response):
                  def start(status, headers):
                      headers.append(("X-Powered-By", "miniweb"))
                      start_response(status, headers)

                  return self.wrapped(environ, start)

              def test_client(self):
                  return TestClient(self)


          site = PoweredBy(app)
        tests:
          - exp: |
              GET / -> 200 OK
              X-Powered-By: miniweb
              Hello!
      - name: Configuration, Not Constants
        id: 36
        obj: 'Answer `GET /hello/<name>` with the greeting from the `GREETING` environment variable, falling back to `Hello` when it is not set. Answer `GET /config` with the current greeting.'
        expl: 'The same code has to run on your laptop and in production, where the database, the keys and the greeting all differ. Baking those into the source means editing code to deploy it, and eventually committing a secret. Reading them from the environment keeps one program and many configurations — the starter sets the variable here, but on a real host the platform does it.'
        hint: '`os.environ.get("GREETING", "Hello")` — the second argument is the fallback.'
        max: 18/2
        req:
          - 'GET /hello/Ada'
          - 'GET /config'
        start: |-
          import os

          from miniweb import MiniWeb

          app = MiniWeb()

          # A deployment platform would set this for you; here we do it ourselves.
          os.environ["GREETING"] = "Hola"

          # Answer /hello/<name> and /config using the GREETING variable.
        sol: |-
          import os

          from miniweb import MiniWeb

          app = MiniWeb()

          # A deployment platform would set this for you; here we do it ourselves.
          os.environ["GREETING"] = "Hola"

          GREETING = os.environ.get("GREETING", "Hello")


          @app.get("/hello/<name>")
          def hello(name):
              return GREETING + ", " + name + "!"


          @app.get("/config")
          def config():
              return {"greeting": GREETING}
        tests:
          - exp: |
              GET /hello/Ada -> 200 OK
              Hola, Ada!
              GET /config -> 200 OK
              {"greeting": "Hola"}
      - name: A Flask-Shaped App
        id: 37
        obj: 'Write a small app using only names that real Flask also has: `route`, `request`, `jsonify` and `abort`. Serve `GET /items` with the list and `GET /items/<int:id>` with one item or a 404. Do not call `test_client` or `handle` yourself.'
        expl: |-
          Every name you have used in these two tracks was chosen because Flask has it too. Change the first line to `from flask import Flask, request, jsonify, abort`, rename `MiniWeb()` to `Flask(__name__)`, and this file is a real Flask application — one `flask run` away from a real server on a real port.

          That is the point of having built the router yourself first: there is now nothing in that library you have not already seen the inside of.
        hint: 'Use `@app.route("/items")` rather than `@app.get`, since that is the form Flask has had the longest.'
        max: 22/2
        checks:
          no: ['test_client', '\.handle\(']
        req:
          - 'GET /items'
          - 'GET /items/2'
          - 'GET /items/9'
        start: |-
          from miniweb import MiniWeb, request, jsonify, abort

          app = MiniWeb()

          ITEMS = [
              {"id": 1, "name": "lamp"},
              {"id": 2, "name": "desk"},
          ]

          # Serve /items and /items/<int:id> using only Flask-shaped names.
        sol: |-
          from miniweb import MiniWeb, request, jsonify, abort

          app = MiniWeb()

          ITEMS = [
              {"id": 1, "name": "lamp"},
              {"id": 2, "name": "desk"},
          ]


          @app.route("/items")
          def list_items():
              return jsonify(ITEMS)


          @app.route("/items/<int:id>")
          def get_item(id):
              for item in ITEMS:
                  if item["id"] == id:
                      return jsonify(item)
              abort(404)
        tests:
          - exp: |
              GET /items -> 200 OK
              [{"id": 1, "name": "lamp"}, {"id": 2, "name": "desk"}]
              GET /items/2 -> 200 OK
              {"id": 2, "name": "desk"}
              GET /items/9 -> 404 Not Found
              {"error": "Not Found"}
      - name: The Whole Service
        id: 38
        obj: 'Build the finished notes service: `GET /notes` lists the rows, `POST /notes` requires a bearer token and a non-empty `text` before inserting and answering `201`, `DELETE /notes/<int:id>` requires the token and answers `204`, and an `errorhandler(404)` answers `{"error": "no such note"}`.'
        expl: 'Everything from both tracks, in one file: routing, request parsing, status codes, a database behind the routes, placeholders instead of formatting, validation, a token check and a custom error. This is genuinely the shape of a small production service — what a real one adds is a server process, a database on disk, and a great deal of care, not a different set of ideas.'
        hint: 'Write one `require_token()` helper that aborts with 401, and call it at the top of the two routes that need it. `abort` works anywhere, not only inside a handler.'
        max: 42/3
        req:
          - 'GET /notes'
          - { m: POST, p: /notes, json: { text: 'read a book' } }
          - { m: POST, p: /notes, json: { text: 'read a book' }, hdr: { Authorization: 'Bearer s3cr3t' } }
          - { m: POST, p: /notes, json: { text: '' }, hdr: { Authorization: 'Bearer s3cr3t' } }
          - { m: DELETE, p: /notes/1, hdr: { Authorization: 'Bearer s3cr3t' } }
          - { m: DELETE, p: /notes/9, hdr: { Authorization: 'Bearer s3cr3t' } }
          - 'GET /notes'
        start: |-
          import sqlite3

          from miniweb import MiniWeb, request, abort

          app = MiniWeb()

          TOKEN = "s3cr3t"

          db = sqlite3.connect(":memory:")
          db.row_factory = sqlite3.Row
          db.execute("CREATE TABLE notes (id INTEGER PRIMARY KEY, text TEXT)")
          db.execute("INSERT INTO notes (text) VALUES ('buy milk')")


          def require_token():
              # Abort with 401 unless the Authorization header carries TOKEN.
              pass


          # Serve GET /notes, POST /notes, DELETE /notes/<int:id>,
          # and register a 404 handler.
        sol: |-
          import sqlite3

          from miniweb import MiniWeb, request, abort

          app = MiniWeb()

          TOKEN = "s3cr3t"

          db = sqlite3.connect(":memory:")
          db.row_factory = sqlite3.Row
          db.execute("CREATE TABLE notes (id INTEGER PRIMARY KEY, text TEXT)")
          db.execute("INSERT INTO notes (text) VALUES ('buy milk')")


          def require_token():
              if request.headers.get("Authorization", "") != "Bearer " + TOKEN:
                  abort(401, "a bearer token is required")


          @app.get("/notes")
          def list_notes():
              rows = db.execute("SELECT id, text FROM notes ORDER BY id").fetchall()
              return [dict(row) for row in rows]


          @app.post("/notes")
          def add_note():
              require_token()
              text = (request.json or {}).get("text", "")
              if not text:
                  abort(400, "text is required")
              cursor = db.execute("INSERT INTO notes (text) VALUES (?)", (text,))
              return {"id": cursor.lastrowid, "text": text}, 201


          @app.delete("/notes/<int:id>")
          def delete_note(id):
              require_token()
              cursor = db.execute("DELETE FROM notes WHERE id = ?", (id,))
              if cursor.rowcount == 0:
                  abort(404)
              return "", 204


          @app.errorhandler(404)
          def not_found(error):
              return {"error": "no such note"}
        tests:
          - exp: |
              GET /notes -> 200 OK
              [{"id": 1, "text": "buy milk"}]
              POST /notes -> 401 Unauthorized
              {"error": "a bearer token is required"}
              POST /notes -> 201 Created
              {"id": 2, "text": "read a book"}
              POST /notes -> 400 Bad Request
              {"error": "text is required"}
              DELETE /notes/1 -> 204 No Content
              DELETE /notes/9 -> 404 Not Found
              {"error": "no such note"}
              GET /notes -> 200 OK
              [{"id": 2, "text": "read a book"}]
