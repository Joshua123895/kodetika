      - name: Placeholders, Not Formatting
        id: 21
        obj: 'Answer `GET /notes?q=...` with the rows whose `text` contains `q`, ordered by `id`. Every value must reach the query through a `?` placeholder — no f-strings, no `.format`, no `%`.'
        expl: |-
          Building SQL by pasting text together is how databases get destroyed. A `q` of `' OR 1=1 --` turns your search into "give me everything"; a nastier one drops the table. That is **SQL injection**, and it is still among the most exploited bugs on the web.

          A `?` placeholder is not a fancier way to paste. The query and the values travel separately, so the database parses the SQL *before* it ever sees the value — and a value can never become syntax.
        hint: 'Wrap the search term in `%` signs in Python — `"%" + q + "%"` — and pass that whole string as the placeholder value.'
        max: 15/2
        checks:
          msg: 'Every value has to reach the query through a `?` placeholder — no f-strings, no `.format`, no `%` formatting.'
          has:
            - 'LIKE \?'
          no:
            - 'f"'
            - "f'"
            - '\.format\('
            - '%\s*\('
        req:
          - 'GET /notes?q=milk'
          - 'GET /notes?q=nothing'
        start: |-
          import sqlite3

          from miniweb import MiniWeb, request

          app = MiniWeb()

          db = sqlite3.connect(":memory:")
          db.execute("CREATE TABLE notes (id INTEGER PRIMARY KEY, text TEXT)")
          db.execute("INSERT INTO notes (text) VALUES ('buy milk')")
          db.execute("INSERT INTO notes (text) VALUES ('walk the dog')")

          # Answer GET /notes, filtered by q, using a placeholder.
        sol: |-
          import sqlite3

          from miniweb import MiniWeb, request

          app = MiniWeb()

          db = sqlite3.connect(":memory:")
          db.execute("CREATE TABLE notes (id INTEGER PRIMARY KEY, text TEXT)")
          db.execute("INSERT INTO notes (text) VALUES ('buy milk')")
          db.execute("INSERT INTO notes (text) VALUES ('walk the dog')")


          @app.get("/notes")
          def search_notes():
              like = "%" + request.args.get("q", "") + "%"
              sql = "SELECT id, text FROM notes WHERE text LIKE ? ORDER BY id"
              return [{"id": row[0], "text": row[1]} for row in db.execute(sql, (like,)).fetchall()]
        tests:
