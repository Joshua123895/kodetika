name: APIs and Databases
slug: apis
icon: apis
desc: 'Master real web services: REST resources, SQLite behind the routes, tokens, validation, WSGI, and more.'
difficulty: 3
chapters:
  - name: Shaping the Response
    icon: display
    lib: miniweb
    levels:
      - name: A Status That Is Not 200
        id: 1
        obj: 'Answer `POST /notes` with the body `created` and the status `201`.'
        expl: 'Returning a value from a handler means "200, and here is the body". Returning a **tuple** lets you say more: `return body, status`. `201 Created` is the right answer to a successful `POST`, because `200 OK` does not tell the caller that something new now exists.'
        hint: 'One `return` with two values separated by a comma: the text, then `201`.'
        max: 8/2
        req:
          - 'POST /notes'
        start: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          # Answer POST /notes with "created" and a 201.
        sol: |-
          from miniweb import MiniWeb

          app = MiniWeb()


          @app.post("/notes")
          def add_note():
              return "created", 201
        tests:
          - exp: |
              POST /notes -> 201 Created
              created
      - name: Body, Status and Headers
        id: 2
        obj: 'Answer `POST /jobs` with the body `queued`, the status `202` and the header `X-Job: 7`.'
        expl: 'A three-item tuple adds headers: `return body, status, headers`. Headers are how a response carries facts *about* itself rather than in itself — where the thing ended up, how long to cache it, which job to ask about later. `202 Accepted` means "understood, not finished yet", which is exactly when a job id is useful.'
        hint: 'The third item is a dictionary: `{"X-Job": "7"}`.'
        max: 8/2
        see:
          - X-Job
        req:
          - 'POST /jobs'
        start: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          # Answer POST /jobs with a body, a status and an X-Job header.
        sol: |-
          from miniweb import MiniWeb

          app = MiniWeb()


          @app.post("/jobs")
          def enqueue():
              return "queued", 202, {"X-Job": "7"}
        tests:
          - exp: |
              POST /jobs -> 202 Accepted
              X-Job: 7
              queued
      - name: JSON on Purpose
        id: 3
        obj: 'Answer `GET /ping` with the string `pong` as JSON, using `jsonify`, so the response carries `Content-Type: application/json`.'
        expl: 'Returning a `dict` gives you JSON automatically, but returning a plain string gives you HTML — and sometimes the answer really is just a string, a number or `true`. `jsonify` says "this is JSON" whatever the value is, and sets the header to match. The header is not decoration: it is how the caller knows to parse rather than display.'
        hint: '`jsonify("pong")` — note the quotes in the output, which are part of the JSON.'
        max: 8/2
        see:
          - Content-Type
        req:
          - 'GET /ping'
        start: |-
          from miniweb import MiniWeb, jsonify

          app = MiniWeb()

          # Answer GET /ping with "pong" as JSON.
        sol: |-
          from miniweb import MiniWeb, jsonify

          app = MiniWeb()


          @app.get("/ping")
          def ping():
              return jsonify("pong")
        tests:
          - exp: |
              GET /ping -> 200 OK
              Content-Type: application/json
              "pong"
      - name: Refusing a Request
        id: 4
        obj: 'Answer `GET /search` with `searching for cats` when `q` is given, and refuse it with `abort(400)` when `q` is missing.'
        expl: '`400 Bad Request` means the request itself is wrong, so retrying it unchanged will fail again. `abort` stops the handler where it stands — no `return`, no nesting the real answer inside an `else`. Checking the input first and aborting early keeps the successful path flat and readable.'
        hint: '`if "q" not in request.args: abort(400)` on its own line, then the normal answer below it.'
        max: 11/2
        req:
          - 'GET /search?q=cats'
          - 'GET /search'
        start: |-
          from miniweb import MiniWeb, request, abort

          app = MiniWeb()

          # Answer GET /search, aborting with 400 when q is missing.
        sol: |-
          from miniweb import MiniWeb, request, abort

          app = MiniWeb()


          @app.get("/search")
          def search():
              if "q" not in request.args:
                  abort(400)
              return "searching for " + request.args["q"]
        tests:
          - exp: |
              GET /search?q=cats -> 200 OK
              searching for cats
              GET /search -> 400 Bad Request
              {"error": "Bad Request"}
      - name: Not Found, Deliberately
        id: 5
        obj: 'Answer `GET /users/<int:id>` with the matching name from `USERS`, and `abort(404)` when there is no such user.'
        expl: 'A 404 is not only for URLs nobody wrote a route for. `/users/9` matches your route perfectly — the route exists, the *user* does not. Saying so with 404 rather than an empty 200 is what lets a caller tell "no such thing" apart from "nothing to report".'
        hint: '`if id not in USERS: abort(404)`.'
        max: 13/2
        req:
          - 'GET /users/1'
          - 'GET /users/9'
        start: |-
          from miniweb import MiniWeb, abort

          app = MiniWeb()

          USERS = {1: "Ada", 2: "Grace"}

          # Answer GET /users/<int:id>, aborting with 404 when the id is unknown.
        sol: |-
          from miniweb import MiniWeb, abort

          app = MiniWeb()

          USERS = {1: "Ada", 2: "Grace"}


          @app.get("/users/<int:id>")
          def user(id):
              if id not in USERS:
                  abort(404)
              return USERS[id]
        tests:
          - exp: |
              GET /users/1 -> 200 OK
              Ada
              GET /users/9 -> 404 Not Found
              {"error": "Not Found"}
      - name: Errors With a Reason
        id: 6
        obj: 'Refuse `GET /search` without a `q` using `abort(400, "q is required")`, so the message reaches the response body.'
        expl: 'A bare `400` tells the caller they got it wrong but not what was wrong, which turns a two-second fix into an afternoon. The second argument to `abort` becomes the `error` field in the JSON body. Say what is missing, not that something is.'
        hint: 'Pass the message as the second argument to `abort`.'
        max: 11/2
        req:
          - 'GET /search?q=cats'
          - 'GET /search'
        start: |-
          from miniweb import MiniWeb, request, abort

          app = MiniWeb()

          # Abort with 400 and an explanation when q is missing.
        sol: |-
          from miniweb import MiniWeb, request, abort

          app = MiniWeb()


          @app.get("/search")
          def search():
              if "q" not in request.args:
                  abort(400, "q is required")
              return "searching for " + request.args["q"]
        tests:
          - exp: |
              GET /search?q=cats -> 200 OK
              searching for cats
              GET /search -> 400 Bad Request
              {"error": "q is required"}
      - name: Your Own Error Page
        id: 7
        obj: 'Answer `GET /` with `Home`, and register an `errorhandler(404)` that answers every unknown URL with the dictionary `{"error": "no such page", "seen": True}`.'
        expl: 'The default 404 body is the framework''s, not yours. An error handler replaces it everywhere at once, so a caller gets the same shape of error from every endpoint of your API — which matters, because code that consumes an API has to parse errors too. The handler receives the error and its return value becomes the body, keeping the 404 status.'
        hint: '`@app.errorhandler(404)` above a function taking one argument. You do not have to use it.'
        max: 13/2
        req:
          - 'GET /'
          - 'GET /missing'
        start: |-
          from miniweb import MiniWeb

          app = MiniWeb()


          @app.get("/")
          def home():
              return "Home"


          # Register a 404 handler below.
        sol: |-
          from miniweb import MiniWeb

          app = MiniWeb()


          @app.get("/")
          def home():
              return "Home"


          @app.errorhandler(404)
          def not_found(error):
              return {"error": "no such page", "seen": True}
        tests:
          - exp: |
              GET / -> 200 OK
              Home
              GET /missing -> 404 Not Found
              {"error": "no such page", "seen": true}
      - name: Somewhere Else
        id: 8
        obj: 'Answer `GET /old` with a permanent redirect to `/new`, and `GET /new` with `the new place`.'
        expl: 'A `3xx` says "the answer is at this other URL", carried in the `Location` header. `301 Moved Permanently` lets browsers and search engines remember the change, so it is what you use when a page really has moved for good — and `302`, the default, when it has not.'
        hint: '`redirect("/new", 301)` — the status is the second argument.'
        max: 13/2
        see:
          - Location
        req:
          - 'GET /old'
          - 'GET /new'
        start: |-
          from miniweb import MiniWeb, redirect

          app = MiniWeb()

          # Redirect /old to /new permanently, and serve /new.
        sol: |-
          from miniweb import MiniWeb, redirect

          app = MiniWeb()


          @app.get("/old")
          def old():
              return redirect("/new", 301)


          @app.get("/new")
          def new():
              return "the new place"
        tests:
          - exp: |
              GET /old -> 301 Moved Permanently
              Location: /new
              GET /new -> 200 OK
              the new place
  - name: A REST API in Memory
    icon: object
    lib: miniweb
    levels:
      - name: A Collection
        id: 9
        obj: 'Answer `GET /notes` with the whole `NOTES` list.'
        expl: 'A **resource** is a thing your API is about, and its collection URL is the plural noun: `/notes`. The verb never appears in the path — `GET /notes` already says "read the notes", so a route called `/getNotes` says it twice. Returning the list gives you a JSON array for free.'
        hint: 'Return `NOTES` itself; the app turns the list into JSON.'
        max: 11/2
        req:
          - 'GET /notes'
        start: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          NOTES = [
              {"id": 1, "text": "buy milk"},
              {"id": 2, "text": "walk the dog"},
          ]

          # Answer GET /notes with the whole list.
        sol: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          NOTES = [
              {"id": 1, "text": "buy milk"},
              {"id": 2, "text": "walk the dog"},
          ]


          @app.get("/notes")
          def list_notes():
              return NOTES
        tests:
          - exp: |
              GET /notes -> 200 OK
              [{"id": 1, "text": "buy milk"}, {"id": 2, "text": "walk the dog"}]
      - name: One Item by Id
        id: 10
        obj: 'Answer `GET /notes/<int:id>` with the matching note, or `abort(404)` when there is none.'
        expl: 'The item URL is the collection plus the id: `/notes/2`. That is the whole addressing scheme of a REST API — the URL identifies the thing, the method says what to do with it. Searching a list is fine for two notes and hopeless for two million, which is what the next chapter is about.'
        hint: 'Loop over `NOTES` and return the first one whose `id` matches. `abort(404)` after the loop.'
        max: 14/2
        req:
          - 'GET /notes/2'
          - 'GET /notes/9'
        start: |-
          from miniweb import MiniWeb, abort

          app = MiniWeb()

          NOTES = [
              {"id": 1, "text": "buy milk"},
              {"id": 2, "text": "walk the dog"},
          ]

          # Answer GET /notes/<int:id>, or 404.
        sol: |-
          from miniweb import MiniWeb, abort

          app = MiniWeb()

          NOTES = [
              {"id": 1, "text": "buy milk"},
              {"id": 2, "text": "walk the dog"},
          ]


          @app.get("/notes/<int:id>")
          def get_note(id):
              for note in NOTES:
                  if note["id"] == id:
                      return note
              abort(404)
        tests:
          - exp: |
              GET /notes/2 -> 200 OK
              {"id": 2, "text": "walk the dog"}
              GET /notes/9 -> 404 Not Found
              {"error": "Not Found"}
      - name: Creating an Item
        id: 11
        obj: 'Answer `POST /notes` by appending the posted JSON to `NOTES` and returning it with the status `201`. Also serve `GET /notes` so the result is visible.'
        expl: 'Creating something is a `POST` to the *collection*, never to the item — the item has no URL yet, because it does not exist. Answering `201` with the created object saves the caller a second request to find out what they just made.'
        hint: '`NOTES.append(request.json)`, then `return request.json, 201`.'
        max: 18/2
        req:
          - { m: POST, p: /notes, json: { id: 3, text: 'read a book' } }
          - 'GET /notes'
        start: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()

          NOTES = [
              {"id": 1, "text": "buy milk"},
              {"id": 2, "text": "walk the dog"},
          ]


          @app.get("/notes")
          def list_notes():
              return NOTES


          # Add the POST /notes route below.
        sol: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()

          NOTES = [
              {"id": 1, "text": "buy milk"},
              {"id": 2, "text": "walk the dog"},
          ]


          @app.get("/notes")
          def list_notes():
              return NOTES


          @app.post("/notes")
          def add_note():
              NOTES.append(request.json)
              return request.json, 201
        tests:
          - exp: |
              POST /notes -> 201 Created
              {"id": 3, "text": "read a book"}
              GET /notes -> 200 OK
              [{"id": 1, "text": "buy milk"}, {"id": 2, "text": "walk the dog"}, {"id": 3, "text": "read a book"}]
      - name: The Id of a New Item
        id: 12
        obj: 'Let the server choose the id: on `POST /notes`, build a note whose `id` is one past the largest already in `NOTES` and whose `text` comes from the request, append it, and return it with `201`.'
        expl: 'Letting the caller pick the id invites collisions and lets one client overwrite another''s work. Identity belongs to the server, so the request carries only the data — the id is something you hand back. `max(..., default=0)` covers the empty collection without a special case.'
        hint: '`max([note["id"] for note in NOTES], default=0) + 1` is the next id.'
        max: 20/2
        req:
          - { m: POST, p: /notes, json: { text: 'read a book' } }
          - { m: POST, p: /notes, json: { text: 'call mum' } }
          - 'GET /notes'
        start: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()

          NOTES = [
              {"id": 1, "text": "buy milk"},
              {"id": 2, "text": "walk the dog"},
          ]


          @app.get("/notes")
          def list_notes():
              return NOTES


          # POST /notes should choose the id itself.
        sol: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()

          NOTES = [
              {"id": 1, "text": "buy milk"},
              {"id": 2, "text": "walk the dog"},
          ]


          @app.get("/notes")
          def list_notes():
              return NOTES


          @app.post("/notes")
          def add_note():
              note = {"id": max([n["id"] for n in NOTES], default=0) + 1, "text": request.json["text"]}
              NOTES.append(note)
              return note, 201
        tests:
          - exp: |
              POST /notes -> 201 Created
              {"id": 3, "text": "read a book"}
              POST /notes -> 201 Created
              {"id": 4, "text": "call mum"}
              GET /notes -> 200 OK
              [{"id": 1, "text": "buy milk"}, {"id": 2, "text": "walk the dog"}, {"id": 3, "text": "read a book"}, {"id": 4, "text": "call mum"}]
      - name: Replacing an Item
        id: 13
        obj: 'Answer `PUT /notes/<int:id>` by replacing that note entirely with the posted JSON, keeping the id, and returning the result. `abort(404)` when the id is unknown.'
        expl: '`PUT` means "make it look exactly like this". Whatever the old note had and the new body does not, it loses — which is why a `PUT` body must be complete. The id survives because it identifies the note rather than describing it.'
        hint: '`enumerate(NOTES)` gives you the index, so you can assign `NOTES[index] = replacement`.'
        max: 21/2
        req:
          - { m: PUT, p: /notes/1, json: { text: 'buy oat milk', done: true } }
          - 'GET /notes'
        start: |-
          from miniweb import MiniWeb, request, abort

          app = MiniWeb()

          NOTES = [
              {"id": 1, "text": "buy milk", "done": False},
              {"id": 2, "text": "walk the dog", "done": False},
          ]


          @app.get("/notes")
          def list_notes():
              return NOTES


          # Add the PUT route below.
        sol: |-
          from miniweb import MiniWeb, request, abort

          app = MiniWeb()

          NOTES = [
              {"id": 1, "text": "buy milk", "done": False},
              {"id": 2, "text": "walk the dog", "done": False},
          ]


          @app.get("/notes")
          def list_notes():
              return NOTES


          @app.put("/notes/<int:id>")
          def replace_note(id):
              for index, note in enumerate(NOTES):
                  if note["id"] == id:
                      replacement = dict(request.json)
                      replacement["id"] = id
                      NOTES[index] = replacement
                      return replacement
              abort(404)
        tests:
          - exp: |
              PUT /notes/1 -> 200 OK
              {"done": true, "id": 1, "text": "buy oat milk"}
              GET /notes -> 200 OK
              [{"done": true, "id": 1, "text": "buy oat milk"}, {"done": false, "id": 2, "text": "walk the dog"}]
      - name: Changing One Field
        id: 14
        obj: 'Answer `PATCH /notes/<int:id>` by updating only the keys present in the posted JSON, leaving the rest untouched, and returning the note. `abort(404)` when the id is unknown.'
        expl: 'Marking a note done should not require sending its text back. `PATCH` carries a partial body and merges it, which is both less to send and safer — with `PUT`, a client that omits a field silently erases it. `dict.update` is exactly the merge.'
        hint: '`note.update(request.json)` merges the posted keys into the existing note.'
        max: 20/2
        req:
          - { m: PATCH, p: /notes/2, json: { done: true } }
          - 'GET /notes'
        start: |-
          from miniweb import MiniWeb, request, abort

          app = MiniWeb()

          NOTES = [
              {"id": 1, "text": "buy milk", "done": False},
              {"id": 2, "text": "walk the dog", "done": False},
          ]


          @app.get("/notes")
          def list_notes():
              return NOTES


          # Add the PATCH route below.
        sol: |-
          from miniweb import MiniWeb, request, abort

          app = MiniWeb()

          NOTES = [
              {"id": 1, "text": "buy milk", "done": False},
              {"id": 2, "text": "walk the dog", "done": False},
          ]


          @app.get("/notes")
          def list_notes():
              return NOTES


          @app.patch("/notes/<int:id>")
          def update_note(id):
              for note in NOTES:
                  if note["id"] == id:
                      note.update(request.json)
                      note["id"] = id
                      return note
              abort(404)
        tests:
          - exp: |
              PATCH /notes/2 -> 200 OK
              {"done": true, "id": 2, "text": "walk the dog"}
              GET /notes -> 200 OK
              [{"done": false, "id": 1, "text": "buy milk"}, {"done": true, "id": 2, "text": "walk the dog"}]
      - name: Removing an Item
        id: 15
        obj: 'Answer `DELETE /notes/<int:id>` by removing the note and returning an empty body with the status `204`. `abort(404)` when the id is unknown.'
        expl: '`204 No Content` means "it worked, and there is deliberately nothing to read". A deleted thing has no representation left to send, so a body would be strange — and notice the second `DELETE` of the same id is a 404, because by then there is nothing there.'
        hint: '`return "", 204` after removing it.'
        max: 21/2
        req:
          - 'DELETE /notes/1'
          - 'DELETE /notes/1'
          - 'GET /notes'
        start: |-
          from miniweb import MiniWeb, abort

          app = MiniWeb()

          NOTES = [
              {"id": 1, "text": "buy milk"},
              {"id": 2, "text": "walk the dog"},
          ]


          @app.get("/notes")
          def list_notes():
              return NOTES


          # Add the DELETE route below.
        sol: |-
          from miniweb import MiniWeb, abort

          app = MiniWeb()

          NOTES = [
              {"id": 1, "text": "buy milk"},
              {"id": 2, "text": "walk the dog"},
          ]


          @app.get("/notes")
          def list_notes():
              return NOTES


          @app.delete("/notes/<int:id>")
          def delete_note(id):
              for index, note in enumerate(NOTES):
                  if note["id"] == id:
                      NOTES.pop(index)
                      return "", 204
              abort(404)
        tests:
          - exp: |
              DELETE /notes/1 -> 204 No Content
              DELETE /notes/1 -> 404 Not Found
              {"error": "Not Found"}
              GET /notes -> 200 OK
              [{"id": 2, "text": "walk the dog"}]
      - name: The Whole Resource
        id: 16
        obj: 'Using the `find` helper, serve all five routes on `/notes`: list, read one, create with a server-chosen id and `201`, replace with `PUT`, and delete with `204`. Every unknown id is a `404`.'
        expl: 'Five routes and two URLs is a complete REST resource, and the shape is the same for users, orders or invoices. Nothing here is new — it is the previous six levels standing together, which is what an API actually is: a small number of ideas applied consistently across every noun in your system.'
        hint: '`find(id)` returns the note or `None`. Every handler that takes an id starts by calling it and aborting on `None`.'
        max: 40/3
        req:
          - 'GET /notes'
          - { m: POST, p: /notes, json: { text: 'read a book' } }
          - 'GET /notes/3'
          - { m: PUT, p: /notes/1, json: { text: 'buy oat milk' } }
          - 'DELETE /notes/2'
          - 'GET /notes'
        start: |-
          from miniweb import MiniWeb, request, abort

          app = MiniWeb()

          NOTES = [
              {"id": 1, "text": "buy milk"},
              {"id": 2, "text": "walk the dog"},
          ]


          def find(id):
              for note in NOTES:
                  if note["id"] == id:
                      return note
              return None


          # Serve GET, GET one, POST, PUT and DELETE below.
        sol: |-
          from miniweb import MiniWeb, request, abort

          app = MiniWeb()

          NOTES = [
              {"id": 1, "text": "buy milk"},
              {"id": 2, "text": "walk the dog"},
          ]


          def find(id):
              for note in NOTES:
                  if note["id"] == id:
                      return note
              return None


          @app.get("/notes")
          def list_notes():
              return NOTES


          @app.get("/notes/<int:id>")
          def get_note(id):
              note = find(id)
              if note is None:
                  abort(404)
              return note


          @app.post("/notes")
          def add_note():
              note = {"id": max([n["id"] for n in NOTES], default=0) + 1, "text": request.json["text"]}
              NOTES.append(note)
              return note, 201


          @app.put("/notes/<int:id>")
          def replace_note(id):
              note = find(id)
              if note is None:
                  abort(404)
              note["text"] = request.json["text"]
              return note


          @app.delete("/notes/<int:id>")
          def delete_note(id):
              note = find(id)
              if note is None:
                  abort(404)
              NOTES.remove(note)
              return "", 204
        tests:
          - exp: |
              GET /notes -> 200 OK
              [{"id": 1, "text": "buy milk"}, {"id": 2, "text": "walk the dog"}]
              POST /notes -> 201 Created
              {"id": 3, "text": "read a book"}
              GET /notes/3 -> 200 OK
              {"id": 3, "text": "read a book"}
              PUT /notes/1 -> 200 OK
              {"id": 1, "text": "buy oat milk"}
              DELETE /notes/2 -> 204 No Content
              GET /notes -> 200 OK
              [{"id": 1, "text": "buy oat milk"}, {"id": 3, "text": "read a book"}]
  # The database chapter used to introduce the sqlite3 module and a route that
  # uses it almost at once. The SQL track teaches the language, not the Python
  # driver, so a student arrives knowing what a SELECT is and nothing about
  # connections, cursors, placeholders or row factories. This chapter is that
  # driver on its own, with no routes anywhere in it, so the next chapter is
  # only about putting a known API behind a known handler.
  - name: Python and SQLite
    icon: data
    lib: miniweb
    levels:
      - name: Opening a Connection
        id: 39
        obj: 'Connect to an in-memory database, create a `notes` table with an `id` and a `text` column, then print `table created`.'
        expl: 'A `sqlite3` connection is an ordinary Python object, and `":memory:"` asks for a database that lives only as long as the program. That is exactly what you want while learning and while testing: every run starts from nothing, so nothing you did last time can quietly change the answer this time.'
        hint: '`sqlite3.connect(":memory:")`, then `conn.execute(...)` with the CREATE TABLE statement.'
        max: 7/2
        start: |-
          import sqlite3

          # Connect, create the notes table, then print the message.
        sol: |-
          import sqlite3

          conn = sqlite3.connect(":memory:")
          conn.execute("CREATE TABLE notes (id INTEGER PRIMARY KEY, text TEXT)")
          print("table created")
        tests:
          - exp: |
              table created

      - name: Running a Statement
        id: 40
        obj: 'Insert a note reading `buy milk`, commit, then print `conn.total_changes`.'
        expl: 'A statement that changes data is not saved until you commit. SQLite keeps your work in a transaction until then, which is what lets several changes succeed or fail together. Forgetting the commit is the classic first bug: the program prints the right thing and the database is empty afterwards.'
        hint: '`conn.commit()` after the insert, then print the counter.'
        max: 9/2
