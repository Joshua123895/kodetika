      - name: Placeholders, Not Formatting
        id: 43
        obj: 'Insert `buy milk` using a `?` placeholder, then look its `id` up with another placeholder and print the id.'
        expl: |-
          This is the most important level in the chapter. A `?` marks where a value goes, and the values travel separately as a tuple, so the database never confuses data with instructions.

          Building the same query with an f-string looks identical and is the vulnerability called SQL injection: a value containing a quote stops being a value and starts being SQL. Use placeholders every time, including when you are certain the value is safe.
        hint: 'The tuple needs its trailing comma: `(wanted,)` is a one-item tuple, `(wanted)` is just the value.'
        max: 10/2
        start: |-
          import sqlite3

          conn = sqlite3.connect(":memory:")
          conn.execute("CREATE TABLE notes (id INTEGER PRIMARY KEY, text TEXT)")

          wanted = "buy milk"
          # Insert with a placeholder, then look the id up with one, and print it.
        sol: |-
          import sqlite3

          conn = sqlite3.connect(":memory:")
          conn.execute("CREATE TABLE notes (id INTEGER PRIMARY KEY, text TEXT)")
          conn.execute("INSERT INTO notes (text) VALUES (?)", ("buy milk",))

          wanted = "buy milk"
          row = conn.execute("SELECT id FROM notes WHERE text = ?", (wanted,)).fetchone()
          print(row[0])
        checks:
          has:
            - '\?'
          no:
            - 'f"SELECT'
          msg: 'Pass the value as a parameter with `?`, never by building the SQL string.'
        tests:
          - exp: |
              1

      - name: Many Rows at Once
        id: 44
        obj: 'Insert all three notes with a single `executemany`, then print how many rows the table holds.'
        expl: '`executemany` runs the same statement once per tuple in the sequence you give it, which is both shorter and considerably faster than a Python loop, because the statement is prepared once. The list holds tuples for the same reason the last level did: each one is the set of values for one `?`.'
        hint: '`conn.executemany(sql, items)`, then `SELECT COUNT(*)` and take `[0]` of the row.'
        max: 12/2
        start: |-
          import sqlite3

          conn = sqlite3.connect(":memory:")
          conn.execute("CREATE TABLE notes (id INTEGER PRIMARY KEY, text TEXT)")

          items = [("buy milk",), ("walk dog",), ("write code",)]
          # Insert them all at once, then print the count.
        sol: |-
          import sqlite3

          conn = sqlite3.connect(":memory:")
          conn.execute("CREATE TABLE notes (id INTEGER PRIMARY KEY, text TEXT)")

          items = [("buy milk",), ("walk dog",), ("write code",)]
          conn.executemany("INSERT INTO notes (text) VALUES (?)", items)

          count = conn.execute("SELECT COUNT(*) FROM notes").fetchone()[0]
          print(count)
        checks:
          has:
            - 'executemany'
          msg: 'Use `executemany` rather than a loop of `execute` calls.'
        tests:
          - exp: |
              3

      - name: Rows You Can Name
        id: 45
        obj: 'Set `conn.row_factory` to `sqlite3.Row`, then print the note text by column name and print the row converted to a dict.'
        expl: 'Reading `row[1]` means remembering what column 1 was, and it breaks the moment somebody edits the SELECT. A `sqlite3.Row` can be read by name instead, and converts straight to a dict. That last part is why this level exists: a dict is what `jsonify` wants, so this one line is what connects a database row to a JSON response.'
        hint: 'Set the factory on the connection before running the query, then use `row["text"]`.'
        max: 11/2
        start: |-
          import sqlite3

          conn = sqlite3.connect(":memory:")
          conn.execute("CREATE TABLE notes (id INTEGER PRIMARY KEY, text TEXT)")
          conn.execute("INSERT INTO notes (text) VALUES ('buy milk')")

          # Set the row factory, then print the text by name and the row as a dict.
        sol: |-
          import sqlite3

          conn = sqlite3.connect(":memory:")
          conn.row_factory = sqlite3.Row
          conn.execute("CREATE TABLE notes (id INTEGER PRIMARY KEY, text TEXT)")
          conn.execute("INSERT INTO notes (text) VALUES ('buy milk')")

          row = conn.execute("SELECT id, text FROM notes").fetchone()
          print(row["text"])
          print(dict(row))
        checks:
          has:
            - 'row_factory'
          msg: 'Set `conn.row_factory = sqlite3.Row` before querying.'
        tests:
          - exp: |
              buy milk
              {'id': 1, 'text': 'buy milk'}

      - name: Putting It Together
        id: 46
        obj: 'Write `add_note(text)` returning the new row id, and `all_notes()` returning a list of dicts. Add two notes, printing each id, then print the list.'
        expl: 'Two small functions with the SQL sealed inside them. Everywhere else in the program can now add and list notes without knowing a database exists, which is what makes the next chapter short: the handlers call these, and `lastrowid` is how a newly created thing gets to tell the client its own id.'
        hint: '`conn.execute(...)` returns a cursor, and its `.lastrowid` is the id just inserted.'
        max: 20/2
        start: |-
          import sqlite3

          conn = sqlite3.connect(":memory:")
          conn.row_factory = sqlite3.Row
          conn.execute("CREATE TABLE notes (id INTEGER PRIMARY KEY, text TEXT)")

          # Write add_note and all_notes below, then add two notes and list them.
        sol: |-
          import sqlite3

          conn = sqlite3.connect(":memory:")
          conn.row_factory = sqlite3.Row
          conn.execute("CREATE TABLE notes (id INTEGER PRIMARY KEY, text TEXT)")


          def add_note(text):
              cur = conn.execute("INSERT INTO notes (text) VALUES (?)", (text,))
              conn.commit()
              return cur.lastrowid


          def all_notes():
              rows = conn.execute("SELECT id, text FROM notes").fetchall()
              return [dict(row) for row in rows]


          print(add_note("buy milk"))
          print(add_note("walk dog"))
          print(all_notes())
        checks:
          has:
            - 'lastrowid'
          msg: 'Return the id SQLite assigned, with `cur.lastrowid`.'
        tests:
          - exp: |
              1
              2
              [{'id': 1, 'text': 'buy milk'}, {'id': 2, 'text': 'walk dog'}]

  - name: Talking to a Database
    icon: data_engineer
    lib: miniweb
    levels:
      - name: A Database in Memory
        id: 17
        obj: 'Connect to a `":memory:"` SQLite database, create a `notes` table with an `id` and a `text` column, insert `buy milk` and `walk the dog`, then print how many rows the table holds.'
        expl: 'A Python list forgets everything when the program ends, and cannot be searched or shared. SQLite is a real database in one file — or, with `":memory:"`, none at all — and it is part of the standard library, so there is nothing to install. `INTEGER PRIMARY KEY` makes SQLite fill the id in for you.'
        hint: '`db.execute(...)` runs one statement. `.fetchone()` returns the single row of a `COUNT(*)`, and `[0]` is its first column.'
        max: 8/2
        start: |-
          import sqlite3

          # Connect, create the table, insert two rows, print the count.
        sol: |-
          import sqlite3

          db = sqlite3.connect(":memory:")
          db.execute("CREATE TABLE notes (id INTEGER PRIMARY KEY, text TEXT)")
          db.execute("INSERT INTO notes (text) VALUES ('buy milk')")
          db.execute("INSERT INTO notes (text) VALUES ('walk the dog')")
          print(db.execute("SELECT COUNT(*) FROM notes").fetchone()[0])
        tests:
          - exp: |
              2
      - name: Rows Behind a Route
        id: 18
        obj: 'Answer `GET /notes` with every row in the table, ordered by `id`, as a list of dictionaries with the keys `id` and `text`.'
        expl: 'This is the join between the two halves of the course: the route decides *what* is being asked, the query decides *where the answer comes from*. `ORDER BY id` is not optional politeness — a `SELECT` without one may return rows in any order, so an API without one is quietly unstable.'
        hint: '`.fetchall()` gives a list of tuples. A list comprehension turns each `row` into `{"id": row[0], "text": row[1]}`.'
        max: 13/2
        req:
          - 'GET /notes'
        start: |-
