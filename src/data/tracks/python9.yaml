        expl: '`UPDATE ... WHERE id = ?` on an id that does not exist is not an error — it simply changes nothing, and silently answering 200 would be a lie. `cursor.rowcount` says how many rows were actually touched, which is how you tell "updated" apart from "there was nothing there".'
