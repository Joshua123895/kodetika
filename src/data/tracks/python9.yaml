      - name: Fetching One Row
        id: 41
        obj: 'Select the `id` and `text` of the only note. Print the whole row, then print just its text.'
        expl: 'A query returns a cursor, and `.fetchone()` takes the next row from it or `None` when there are none left. A row is a plain tuple here, so its columns come out in the order you asked for them and are read by position. Printing the row itself shows you the shape before you start indexing it.'
        hint: '`conn.execute(...).fetchone()` gives the row. The text is at index 1.'
