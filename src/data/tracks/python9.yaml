      - name: Fetching Every Row
        id: 42
        obj: 'Select the `text` of every note. Print the list of rows, then print each note text on its own line.'
        expl: 'Where `.fetchone()` takes one row, `.fetchall()` takes the rest as a list. Notice what the list holds: one-element tuples, not strings, because a row is always a tuple even when you asked for a single column. That trailing comma in `(''buy milk'',)` is the detail that trips people up first.'
        hint: 'Loop over the rows and print `row[0]` for each.'
        max: 12/2
        start: |-
          import sqlite3

