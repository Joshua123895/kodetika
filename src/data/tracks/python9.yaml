        obj: 'Set `db.row_factory = sqlite3.Row`, then answer `GET /notes` by turning each row straight into a dictionary — no indexes anywhere in the handler.'
        expl: '`row[0]` and `row[1]` are a bug waiting for the day someone adds a column to the `SELECT`. `sqlite3.Row` gives rows that know their own column names, so `dict(row)` produces the JSON object directly and the query becomes the single place the shape is defined.'
