        expl: 'Now the database picks the id, which is what `INTEGER PRIMARY KEY` was for. `cursor.lastrowid` tells you what it chose, and it comes from the same cursor the insert returned, so two requests arriving at once can never read each other''s id.'
        hint: '`cursor = db.execute(...)`, then `cursor.lastrowid`.'
