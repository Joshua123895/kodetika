              print(v, b)
        tests:
          - |
            3.0 0
            12.0 0
            25.0 1
            47.0 1
            68.0 2
            91.0 3
      - name: Polynomial Features
        obj: 'For each input print a list holding the value, its square and its cube, each rounded to 3 decimals.'
        expl: 'A linear model can only draw straight lines, but it does not know where its inputs came from. Feeding it `x`, `x squared` and `x cubed` as three separate features lets it fit a curve while remaining linear in its own weights. The capacity gained this way is real, and so is the overfitting risk that comes with it.'
        hint: 'Build the list with `x`, `x ** 2` and `x ** 3`.'
        max: 6/1
        start: |-
          xs = [1.0, 2.0, 3.0, 4.0]

          # For each x, print [x, x squared, x cubed].
        sol: |-
          xs = [1.0, 2.0, 3.0, 4.0]

          for x in xs:
              print([round(x, 3), round(x ** 2, 3), round(x ** 3, 3)])
        tests:
          - |
            [1.0, 1.0, 1.0]
            [2.0, 4.0, 8.0]
            [3.0, 9.0, 27.0]
            [4.0, 16.0, 64.0]
      - name: Interaction Terms
        obj: 'For each sample print a list holding both features and their product, rounded to 3 decimals.'
        expl: 'Adding features together can never capture "this matters only when that is also true". An **interaction term**, the product of two features, can. It is how a model learns that a large room is valuable only in a good location, a relationship no sum of separate weights could express.'
        hint: 'Append `s[0] * s[1]` after the two original features.'
        max: 6/1
        start: |-
          samples = [[1.0, 2.0], [2.0, 3.0], [3.0, 1.0]]

          # For each sample, print [first, second, first * second].
        sol: |-
          samples = [[1.0, 2.0], [2.0, 3.0], [3.0, 1.0]]

          for s in samples:
              print([s[0], s[1], round(s[0] * s[1], 3)])
        tests:
