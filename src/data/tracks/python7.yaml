        obj: 'Print the counts of true positives, false positives and false negatives on one line, then precision and recall on separate lines, each rounded to 3 decimals.'
        expl: 'Accuracy hides the kind of mistake being made. **Precision** asks what share of the positive predictions were right, so it punishes false alarms. **Recall** asks what share of the real positives were caught, so it punishes misses. A test that flags everyone has perfect recall and useless precision, which is exactly why both are reported together.'
