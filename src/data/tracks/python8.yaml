      - name: A Route Decorator
        id: 20
        obj: 'Write a decorator `route(path)` that registers the function it wraps in `routes` under that path, then print `sorted(routes)`.'
        expl: 'Writing the dictionary by hand puts the path far away from the function it belongs to. A decorator moves it back: `@route("/about")` sits directly above `about`, and registration happens as the file loads. This is the single idea behind `@app.get(...)` in every Python web framework.'
        hint: '`route` takes the path and returns the real decorator, which receives the function, stores it and returns it unchanged.'
        max: 17/1
        start: |-
          routes = {}


          def route(path):
              # Return a decorator that registers the function under `path`.
              pass


          @route("/")
          def home():
