      - name: Segments That Vary
        id: 22
        obj: 'Write `match(rule, path)` returning a dictionary of the captured values when `path` fits `rule`, or `None` when it does not. Print the result for `/users/<id>` against `/users/42`, then against `/posts/42`.'
        expl: 'A site with a million users cannot have a million routes. Instead one rule, `/users/<id>`, stands for all of them: compare segment by segment, and where the rule has a `<name>` accept whatever the path has there and remember it under that name.'
        hint: 'Split both into segments. If the counts differ there is no match. A rule segment starting with `<` captures; any other must be equal.'
        max: 18/1
        start: |-
          def match(rule, path):
              # Return {name: value} on a match, or None.
              pass


          print(match("/users/<id>", "/users/42"))
          print(match("/users/<id>", "/posts/42"))
        sol: |-
          def match(rule, path):
              rule_parts = rule.strip("/").split("/")
              path_parts = path.strip("/").split("/")
              if len(rule_parts) != len(path_parts):
                  return None
              captured = {}
              for expected, actual in zip(rule_parts, path_parts):
                  if expected.startswith("<"):
                      captured[expected.strip("<>")] = actual
                  elif expected != actual:
                      return None
              return captured


          print(match("/users/<id>", "/users/42"))
          print(match("/users/<id>", "/posts/42"))
        tests:
          - exp: |
              {'id': '42'}
              None
      - name: Segments With a Type
        id: 23
        obj: 'Extend `match` so `<int:id>` captures a real `int` and refuses anything that is not all digits. Print the result for `/users/42`, then for `/users/abc`.'
        expl: 'A path segment is always text, so `/users/42` hands you `"42"` and not `42`. Declaring the type in the rule fixes two things at once: the value arrives converted, and a request like `/users/abc` never reaches your handler at all. Rejecting bad input at the edge is cheaper than checking for it everywhere inside.'
        hint: 'After stripping the angle brackets, check whether the name starts with `"int:"`. If it does, the real name is the rest, and the value must pass `.isdigit()`.'
        max: 25/1
        start: |-
          def match(rule, path):
              rule_parts = rule.strip("/").split("/")
              path_parts = path.strip("/").split("/")
              if len(rule_parts) != len(path_parts):
                  return None
              captured = {}
              for expected, actual in zip(rule_parts, path_parts):
                  if expected.startswith("<"):
                      # Handle the "int:" prefix here.
                      captured[expected.strip("<>")] = actual
                  elif expected != actual:
                      return None
              return captured


          print(match("/users/<int:id>", "/users/42"))
          print(match("/users/<int:id>", "/users/abc"))
        sol: |-
          def match(rule, path):
              rule_parts = rule.strip("/").split("/")
              path_parts = path.strip("/").split("/")
              if len(rule_parts) != len(path_parts):
                  return None
              captured = {}
              for expected, actual in zip(rule_parts, path_parts):
                  if expected.startswith("<"):
                      name = expected.strip("<>")
                      if name.startswith("int:"):
                          if not actual.isdigit():
                              return None
                          captured[name[4:]] = int(actual)
                      else:
                          captured[name] = actual
                  elif expected != actual:
                      return None
              return captured


          print(match("/users/<int:id>", "/users/42"))
          print(match("/users/<int:id>", "/users/abc"))
        tests:
          - exp: |
              {'id': 42}
              None
      - name: The Router, Assembled
        id: 24
        obj: 'Write `serve(path)`: try every registered rule against the path, call the first handler that matches with the captured values as keyword arguments, and return `404 Not Found` when none do. Print `serve` for `/`, `/users/42`, `/users/7` and `/nope`.'
        expl: 'The decorator, the matcher and the dispatcher together are a router — the same three pieces every Python web framework is built from. The trick that ties them together is `handler(**captured)`: the names in the rule become the parameter names of the handler, so `/users/<id>` calls `user(id="42")`.'
        hint: 'Loop over `routes.items()`. `match` returning `None` means no match — and an empty dict is a match with nothing captured, so compare with `is not None`, not by truthiness.'
        max: 36/1
        start: |-
          routes = {}


          def route(path):
              def decorator(fn):
                  routes[path] = fn
                  return fn

              return decorator


          def match(rule, path):
              rule_parts = rule.strip("/").split("/")
              path_parts = path.strip("/").split("/")
              if len(rule_parts) != len(path_parts):
                  return None
              captured = {}
              for expected, actual in zip(rule_parts, path_parts):
                  if expected.startswith("<"):
                      captured[expected.strip("<>")] = actual
                  elif expected != actual:
                      return None
              return captured


          @route("/")
          def home():
              return "Welcome!"


          @route("/users/<id>")
          def user(id):
              return "User " + id


          def serve(path):
              # Find the first matching rule and call its handler.
              pass


          for wanted in ("/", "/users/42", "/users/7", "/nope"):
              print(serve(wanted))
        sol: |-
          routes = {}


          def route(path):
              def decorator(fn):
                  routes[path] = fn
                  return fn

              return decorator


          def match(rule, path):
              rule_parts = rule.strip("/").split("/")
              path_parts = path.strip("/").split("/")
              if len(rule_parts) != len(path_parts):
                  return None
              captured = {}
              for expected, actual in zip(rule_parts, path_parts):
                  if expected.startswith("<"):
                      captured[expected.strip("<>")] = actual
                  elif expected != actual:
                      return None
              return captured


          @route("/")
          def home():
              return "Welcome!"


          @route("/users/<id>")
          def user(id):
              return "User " + id


          def serve(path):
              for rule, handler in routes.items():
                  captured = match(rule, path)
                  if captured is not None:
                      return handler(**captured)
              return "404 Not Found"


          for wanted in ("/", "/users/42", "/users/7", "/nope"):
              print(serve(wanted))
        tests:
          - exp: |
              Welcome!
              User 42
              User 7
              404 Not Found
