          - { m: GET, p: /whoami, hdr: { X-Client: curl } }
          - 'GET /whoami'
        start: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()

          # Answer GET /whoami using the X-Client header.
        sol: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()


          @app.get("/whoami")
          def whoami():
              return request.headers.get("X-Client", "unknown")
