name: Backend Basics
slug: backend
icon: backend
desc: 'Master the server side of the web: HTTP requests, status codes, routing, decorators, and your first real app.'
difficulty: 2
chapters:
  - name: How the Web Talks
    icon: say
    levels:
      - name: The Request Line
        id: 1
        obj: 'Split the request line in `line` into its three parts and print the method, the path and the version, each on its own line.'
        expl: 'Every visit to a website starts with one line of text sent to a server: `GET /about HTTP/1.1`. It says what to do (**the method**), what to do it to (**the path**), and which version of the rules to follow. Three words separated by spaces — `split()` takes it apart.'
        hint: '`line.split()` gives you a list of three strings. You can unpack it into three names at once.'
        max: 5/1
        start: |-
          line = "GET /about HTTP/1.1"

          # Print the method, then the path, then the version.
        sol: |-
          line = "GET /about HTTP/1.1"

          method, path, version = line.split()
          print(method)
          print(path)
          print(version)
        tests:
          - exp: |
              GET
              /about
              HTTP/1.1
      - name: Methods and Meaning
        id: 2
        obj: 'Print one line for each of `GET`, `POST`, `PUT` and `DELETE`, in that order, in the form `GET reads a resource`. The four verbs are `reads`, `creates`, `replaces` and `removes`.'
        expl: 'The method is a promise about what the request will do. `GET` only reads, which is why a browser is free to fetch a page again without asking. `POST` creates something new, `PUT` replaces something that exists, and `DELETE` removes it. Servers rely on those promises, so breaking them — a `GET` that deletes — is a real bug.'
        hint: 'A dictionary keeps the four methods and their verbs together, and looping over it preserves the order you wrote them in.'
        max: 4/1
        start: |-
          # Print one line per method: the method, its verb, then "a resource".
        sol: |-
          meanings = {"GET": "reads", "POST": "creates", "PUT": "replaces", "DELETE": "removes"}

          for method, verb in meanings.items():
              print(method, verb, "a resource")
        tests:
          - exp: |
              GET reads a resource
              POST creates a resource
              PUT replaces a resource
              DELETE removes a resource
      - name: Path Segments
        id: 3
        obj: 'Print the list of segments in `path`, with no empty string at the front.'
        expl: 'A path is a stack of names separated by `/`. Splitting `/users/42/orders` on `/` alone leaves an empty string first, because the text begins with a separator. `strip("/")` removes the slashes at both ends before the split, which is the standard way to get just the segments.'
        hint: 'Strip the slashes off both ends first, then split on `"/"`.'
        max: 3/1
        start: |-
          path = "/users/42/orders"

          # Print the list of segments.
        sol: |-
          path = "/users/42/orders"

          print(path.strip("/").split("/"))
        tests:
          - exp: |
              ['users', '42', 'orders']
      - name: Status Codes
        id: 4
        obj: 'Using `http.HTTPStatus`, print the number and the official reason phrase for `200`, `404` and `500`, one per line, in the form `200 OK`.'
        expl: 'A response opens with a number saying how it went. Those numbers are standardised, and Python already knows them: `HTTPStatus(404).phrase` is `"Not Found"`. Reading the phrase out of the standard library instead of typing it yourself means you can never get it subtly wrong.'
        hint: '`HTTPStatus(code).phrase` gives the text. Loop over the three codes.'
        max: 5/1
        start: |-
          from http import HTTPStatus

          # Print each code and its reason phrase.
        sol: |-
          from http import HTTPStatus

          for code in (200, 404, 500):
              print(code, HTTPStatus(code).phrase)
        tests:
          - exp: |
              200 OK
              404 Not Found
              500 Internal Server Error
      - name: Families of Status
        id: 5
        obj: 'Write `family(code)` returning `success`, `redirect`, `client error` or `server error`, then print the family of `201`, `301`, `404` and `503`, one per line.'
        expl: 'The first digit carries the meaning and the rest is detail. `2xx` worked, `3xx` says look elsewhere, `4xx` blames the request, and `5xx` blames the server. That last distinction matters most: a `4xx` means fix your request, a `5xx` means the fault is not yours.'
        hint: 'Compare against 300, 400 and 500 in order and return early — once you know the code is under 300 there is nothing left to check.'
        max: 12/1
        start: |-
          def family(code):
              # Return the family name for this status code.
              pass


          for code in (201, 301, 404, 503):
              print(family(code))
        sol: |-
          def family(code):
              if code < 300:
                  return "success"
              if code < 400:
                  return "redirect"
              if code < 500:
                  return "client error"
              return "server error"


          for code in (201, 301, 404, 503):
              print(family(code))
        tests:
          - exp: |
              success
              redirect
              client error
              server error
      - name: Headers as a Dictionary
        id: 6
        obj: 'Turn the two header lines in `raw` into a dictionary, splitting each on its first `:` and stripping the spaces from the value, then print the value of `Content-Type`.'
        expl: 'After the request line come **headers**: extra facts about the request, one `Name: value` per line. Splitting on the *first* colon only matters more than it looks — a `Host: example.com:8080` header contains two, and `split(":", 1)` keeps the port where it belongs.'
        hint: '`line.split(":", 1)` gives exactly two pieces. `.strip()` cleans up the leading space on the value.'
        max: 7/1
        start: |-
          raw = "Host: example.com\nContent-Type: text/html"

          # Build a dict of headers, then print the Content-Type.
        sol: |-
          raw = "Host: example.com\nContent-Type: text/html"

          headers = {}
          for line in raw.split("\n"):
              name, value = line.split(":", 1)
              headers[name] = value.strip()
          print(headers["Content-Type"])
        tests:
          - exp: |
              text/html
      - name: A Request, Parsed
        id: 7
        obj: 'Parse `raw` into its method, path and headers, then print `GET /about with 2 headers`.'
        expl: 'This is a whole HTTP request: a request line, then header lines, each separated by a newline. Real servers read exactly this off the network and take it apart exactly this way. Nothing about the format is secret — it is text, and you can parse it with the string methods you already know.'
        hint: 'Split `raw` into lines first. The first line is the request line; every line after it is a header.'
        max: 6/1
        start: |-
          raw = "GET /about HTTP/1.1\nHost: example.com\nAccept: text/html"

          # Print the method, the path, and how many headers arrived.
        sol: |-
          raw = "GET /about HTTP/1.1\nHost: example.com\nAccept: text/html"

          lines = raw.split("\n")
          method, path, version = lines[0].split()
          headers = dict(line.split(": ", 1) for line in lines[1:])
          print(method, path, "with", len(headers), "headers")
        tests:
          - exp: |
              GET /about with 2 headers
      - name: A Response, Written
        id: 8
        obj: 'Build the full text of a `200` response carrying `Content-Type: text/plain`, a correct `Content-Length` and the body `Hello`, and print it.'
        expl: 'A response has the same shape as a request, in reverse: a status line, headers, **a blank line**, then the body. The blank line is what tells the reader the headers are over — without it there is no way to know where the body starts. `Content-Length` says how many bytes to expect.'
        hint: 'Collect the lines in a list — including an empty string for the blank line — and `"\n".join(...)` them at the end.'
        max: 10/1
        start: |-
          body = "Hello"

          # Print the status line, the headers, a blank line, then the body.
        sol: |-
          body = "Hello"

          lines = [
              "HTTP/1.1 200 OK",
              "Content-Type: text/plain",
              "Content-Length: " + str(len(body)),
              "",
              body,
          ]
          print("\n".join(lines))
        tests:
          - exp: |
              HTTP/1.1 200 OK
              Content-Type: text/plain
              Content-Length: 5

              Hello
  - name: Query Strings and JSON
    icon: connection
    levels:
      - name: The Query String
        id: 9
        obj: 'Print the dictionary `parse_qs` returns for the query string `q=cats&page=2`.'
        expl: 'Everything after the `?` in a URL is the **query string**: `name=value` pairs joined by `&`. `urllib.parse.parse_qs` reads it for you. Notice that every value comes back inside a list — a URL is allowed to repeat a name, as in `?tag=a&tag=b`, so the general answer is always a list.'
        hint: '`parse_qs` takes just the query string, without the leading `?`.'
        max: 3/1
        start: |-
          from urllib.parse import parse_qs

          # Print what parse_qs makes of "q=cats&page=2".
        sol: |-
          from urllib.parse import parse_qs

          print(parse_qs("q=cats&page=2"))
        tests:
          - exp: |
              {'q': ['cats'], 'page': ['2']}
      - name: One Value, Not a List
        id: 10
        obj: 'Using `parse_qsl`, print a plain dictionary mapping each name in `q=cats&page=2` to its single value.'
        expl: '`parse_qsl` returns a list of pairs instead of a dictionary of lists, and a list of pairs is exactly what `dict()` accepts. When a name repeats, the last one wins. Most of the time that is what you want, and it is what web frameworks give you by default.'
        hint: '`dict()` turns a list of two-item tuples straight into a dictionary.'
        max: 3/1
        start: |-
          from urllib.parse import parse_qsl

          # Print a plain {name: value} dict.
        sol: |-
          from urllib.parse import parse_qsl

          print(dict(parse_qsl("q=cats&page=2")))
        tests:
          - exp: |
              {'q': 'cats', 'page': '2'}
      - name: Query Strings, Built
        id: 11
        obj: 'Print the query string `urlencode` builds from `{"q": "red shoes", "page": 2}`.'
        expl: 'Going the other way is `urlencode`. It handles the two things people get wrong by hand: the space inside `red shoes` cannot appear in a URL, and the number `2` has to become text. Building URLs by string concatenation is how broken links happen.'
        hint: 'Pass the dictionary straight to `urlencode`.'
        max: 3/1
        start: |-
          from urllib.parse import urlencode

          # Print the query string for that dictionary.
        sol: |-
          from urllib.parse import urlencode

          print(urlencode({"q": "red shoes", "page": 2}))
        tests:
          - exp: |
              q=red+shoes&page=2
      - name: Characters That Need Escaping
        id: 12
        obj: 'Print `quote("red shoes & socks")`, then print the result of `unquote` on that same escaped text.'
        expl: 'Some characters have a job inside a URL — `&` separates pairs, `=` joins them, a space ends the whole thing. To send one as data it is replaced by `%` and its hex code, so a space becomes `%20`. **Percent-encoding** is reversible, which is what `unquote` proves.'
        hint: 'Keep the escaped text in a variable so you can print it and then unescape it.'
        max: 6/1
        start: |-
          from urllib.parse import quote, unquote

          # Print the escaped text, then the text you get back.
        sol: |-
          from urllib.parse import quote, unquote

          escaped = quote("red shoes & socks")
          print(escaped)
          print(unquote(escaped))
        tests:
          - exp: |
              red%20shoes%20%26%20socks
              red shoes & socks
      - name: The Parts of a URL
        id: 13
        obj: 'Split `https://api.example.com/search?q=cats#top` with `urlsplit` and print its path, its query and its fragment, one per line.'
        expl: 'A URL packs several things into one string, and `urlsplit` hands them back named: scheme, netloc, path, query, fragment. The fragment after `#` is the odd one out — it never leaves the browser, so a server never sees it.'
        hint: 'The result has `.path`, `.query` and `.fragment` attributes.'
        max: 7/1
        start: |-
          from urllib.parse import urlsplit

          # Print the path, the query and the fragment.
        sol: |-
          from urllib.parse import urlsplit

          parts = urlsplit("https://api.example.com/search?q=cats#top")
          print(parts.path)
          print(parts.query)
          print(parts.fragment)
        tests:
          - exp: |
              /search
              q=cats
              top
      - name: JSON In
        id: 14
        obj: 'Parse the JSON text in `body` and print the value of its `name` key.'
        expl: 'JSON is how programs send structured data to each other over HTTP. It arrives as one long string; `json.loads` turns it into ordinary Python dictionaries, lists, strings and numbers. From that moment on it is just data, and you already know what to do with data.'
        hint: '`json.loads(body)` gives you a dict you can subscript.'
        max: 4/1
        start: |-
          import json

          body = '{"name": "Ada", "age": 36}'

          # Print the name.
        sol: |-
          import json

          body = '{"name": "Ada", "age": 36}'

          print(json.loads(body)["name"])
        tests:
          - exp: |
              Ada
      - name: JSON Out
        id: 15
        obj: 'Print the dictionary `user` as JSON text, with its keys in sorted order.'
        expl: '`json.dumps` goes the other way. `sort_keys=True` fixes the order of the keys, which matters the moment anything compares two responses — the same data written in two orders is the same data, but not the same string.'
        hint: '`json.dumps(user, sort_keys=True)`.'
        max: 4/1
        start: |-
          import json

          user = {"name": "Ada", "age": 36}

          # Print it as JSON, keys sorted.
        sol: |-
          import json

          user = {"name": "Ada", "age": 36}

          print(json.dumps(user, sort_keys=True))
        tests:
          - exp: |
              {"age": 36, "name": "Ada"}
      - name: An Error, as JSON
        id: 16
        obj: 'Build an error body from a Python dictionary with the key `error` and the value `not found`, and print it as JSON. Build it as data — do not print a string you typed out yourself.'
        expl: 'When something goes wrong, an API answers with JSON too, so the caller can read the reason rather than guess from a status code. Always build it from a dictionary: the moment the message contains a quote or a newline, hand-typed JSON stops being valid and `json.dumps` still works.'
        hint: 'Make the dict first, then pass it to `json.dumps`.'
        max: 4/1
        checks:
          has: ['json\.dumps']
          no: ["print\\(\\s*['\"]"]
        start: |-
          import json

          # Build the error as a dict, then print it as JSON.
        sol: |-
          import json

          error = {"error": "not found"}
          print(json.dumps(error))
        tests:
          - exp: |
              {"error": "not found"}
  # The router chapter asks a student to keep functions in a dictionary and then
  # to write a decorator that takes an argument. Both are large ideas, and both
  # used to arrive already wearing a web hat, which makes them hard to see
  # clearly. This chapter teaches them as plain Python first. Every level here
  # is deliberately the shape the next chapter needs: a dict of functions, a
  # lookup that can miss, and a registering decorator.
  - name: Functions as Values
    icon: function
    levels:
      - name: A Function in a Variable
        id: 41
        obj: 'Assign `greet` to a name called `say`, then call it through that name and print the result.'
        expl: 'A function name is a variable like any other, and the function itself is a value it holds. Note what is missing: there are no brackets on `greet` when you assign it. Brackets mean "call this now", so leaving them off is the difference between handing someone a recipe and handing them dinner.'
        hint: '`say = greet` with no brackets, then `print(say())` with them.'
        max: 6/2
        start: |-
          def greet():
              return "hello"


          # Give the function a second name, then call it through that name.
        sol: |-
          def greet():
              return "hello"


          say = greet
          print(say())
        tests:
          - exp: |
              hello

      - name: A Function That Takes a Function
        id: 42
        obj: 'Write `apply_to(fn, value)` that calls `fn` on `value` and returns the result. Use it to print `shout("quiet")`.'
        expl: 'If a function is a value, it can be passed to another function. `apply_to` never knows what `fn` does, which is the whole point: it works with any function of one argument you hand it. This is the idea `sorted(key=...)` is built on, and the idea the router is built on.'
        hint: 'Inside `apply_to`, the call is `fn(value)`.'
        max: 8/2
        start: |-
          def shout(text):
              return text.upper()


          # Write apply_to below, then print the result of applying shout to "quiet".
        sol: |-
          def shout(text):
              return text.upper()


          def apply_to(fn, value):
              return fn(value)


          print(apply_to(shout, "quiet"))
        tests:
          - exp: |
              QUIET

      - name: A Function That Returns a Function
        id: 43
        obj: 'Write `multiplier(n)` that returns a function multiplying its argument by `n`. Build a doubler from it and print `double(21)`.'
        expl: 'The inner function is created fresh each time `multiplier` runs, and it remembers the `n` it was born with even after `multiplier` has returned. A function bundled with the values it closed over is called a **closure**, and it is what lets one small factory produce as many specialised functions as you need.'
        hint: 'Define `multiply` inside `multiplier`, and return it without brackets.'
        max: 9/2
        start: |-
          # Write multiplier below, then build double from it and print double(21).
        sol: |-
          def multiplier(n):
              def multiply(x):
                  return x * n
              return multiply


          double = multiplier(2)
          print(double(21))
        tests:
          - exp: |
              42

      - name: A Dictionary of Functions
        id: 44
        obj: 'Build a dict called `routes` mapping `"/"` to `home` and `"/about"` to `about`, then call the one at `"/"` and print what it returns.'
        expl: 'A dictionary holds values, and functions are values, so a dictionary can hold functions. Reading it gives you back the function, and the brackets after it make the call. That is why `routes["/"]()` has two pairs of brackets: the first pair indexes, the second calls.'
        hint: 'Store the names with no brackets. Add the brackets only where you call.'
        max: 9/2
        start: |-
          def home():
              return "the front page"


          def about():
              return "about us"


          # Build the routes dict, then call the handler at "/".
        sol: |-
          def home():
              return "the front page"


          def about():
              return "about us"


          routes = {"/": home, "/about": about}
          print(routes["/"]())
        tests:
          - exp: |
              the front page

      - name: Looking Up and Calling
        id: 45
        obj: 'Write `handle(path)` returning the result of the handler at `path`, or `404 Not Found` when there is none. Print it for `/` and for `/missing`.'
        expl: 'A lookup that can miss is what makes this a router rather than a dictionary. Using `.get()` returns `None` instead of raising when the key is absent, so the missing case becomes an ordinary `if` rather than an exception. That branch is where every 404 you have ever seen comes from.'
        hint: '`routes.get(path)` gives `None` when the path is not there.'
        max: 13/2
        start: |-
          def home():
              return "the front page"


          routes = {"/": home}


          # Write handle below, then print it for "/" and for "/missing".
        sol: |-
          def home():
              return "the front page"


          routes = {"/": home}


          def handle(path):
              handler = routes.get(path)
              if handler is None:
                  return "404 Not Found"
              return handler()


          print(handle("/"))
          print(handle("/missing"))
        tests:
          - exp: |
              the front page
              404 Not Found

      - name: Wrapping a Function
        id: 46
        obj: 'Write `log(fn)` returning a wrapper that prints `calling` and the function name, then calls `fn`. Rebind `home` to the wrapped version and print the result of calling it.'
        expl: 'The wrapper has the same shape as the function it wraps, so anything that could call the original can call the wrapper without noticing. Rebinding `home` to the result means every later call goes through the extra behaviour. Every logging, timing and authentication layer you will meet is this pattern.'
        hint: '`fn.__name__` is the wrapped function name. Rebind with `home = log(home)`.'
        max: 12/2
        start: |-
          def home():
              return "the front page"


          # Write log below, then rebind home to the wrapped version and call it.
        sol: |-
          def log(fn):
              def wrapper():
                  print("calling", fn.__name__)
                  return fn()
              return wrapper


          def home():
              return "the front page"


          home = log(home)
          print(home())
        tests:
          - exp: |
              calling home
              the front page

      - name: Your First Decorator
        id: 47
        obj: 'Keep `log` exactly as it is, and apply it to `home` with the `@` syntax instead of rebinding by hand. Print the result of calling `home`.'
        expl: 'Writing `@log` above a definition is shorthand for `home = log(home)` immediately after it. Nothing new happens: the same function is called with the same argument and the name is bound to the same result. The value of the shorthand is that the reader sees the wrapping at the top of the definition rather than several lines below it.'
        hint: 'Delete the manual rebinding and put `@log` on the line above `def home`.'
        max: 12/2
        start: |-
          def log(fn):
              def wrapper():
                  print("calling", fn.__name__)
                  return fn()
              return wrapper


          def home():
              return "the front page"


          # Apply log to home using the @ syntax instead, then call it.
        sol: |-
          def log(fn):
              def wrapper():
                  print("calling", fn.__name__)
                  return fn()
              return wrapper


          @log
          def home():
              return "the front page"


          print(home())
        checks:
          has:
            - '@log'
          msg: 'Use the `@log` syntax rather than rebinding the name by hand.'
        tests:
          - exp: |
              calling home
              the front page

      - name: A Decorator That Registers
        id: 48
        obj: 'Write `route(path)` so that `@route("/")` stores the function in `routes` under that path. Register `home` at `/` and `about` at `/about`, then print `sorted(routes)` and call the one at `/about`.'
        expl: 'A decorator written as `@route("/")` is called before it decorates: `route("/")` runs first and has to *return* the decorator, which is then applied. That is why there are three levels of function here. It also explains the shape of every web framework you have seen, and it is exactly what you are about to build.'
        hint: 'Three nested functions: `route` takes the path, returns `decorator`, which stores `fn` and returns it unchanged.'
        max: 18/2
        start: |-
          routes = {}


          # Write route below, then register home at "/" and about at "/about".
        sol: |-
          routes = {}


          def route(path):
              def decorator(fn):
                  routes[path] = fn
                  return fn
              return decorator


          @route("/")
          def home():
              return "the front page"


          @route("/about")
          def about():
              return "about us"


          print(sorted(routes))
          print(routes["/about"]())
        tests:
          - exp: |
              ['/', '/about']
              about us

      - name: Keeping the Name
        id: 49
        obj: 'Add `functools.wraps` to the wrapper inside `log` so the decorated `home` keeps its own name. Print `home.__name__` and then the result of calling it.'
        expl: 'A wrapper is a different function, so by default the decorated name reports as `wrapper`, which makes tracebacks and debugging confusing. `functools.wraps` copies the name and docstring across. The wrapper also takes `*args` and `**kwargs` so it passes through whatever it is given, which is what makes one decorator usable on functions of different shapes.'
        hint: '`@functools.wraps(fn)` goes on the line above `def wrapper`.'
        max: 14/2
        start: |-
          import functools


          def log(fn):
              def wrapper(*args, **kwargs):
                  return fn(*args, **kwargs)
              return wrapper


          @log
          def home():
              return "the front page"


          print(home.__name__)
          print(home())
        sol: |-
          import functools


          def log(fn):
              @functools.wraps(fn)
              def wrapper(*args, **kwargs):
                  return fn(*args, **kwargs)
              return wrapper


          @log
          def home():
              return "the front page"


          print(home.__name__)
          print(home())
        tests:
          - exp: |
              home
              the front page

      - name: Putting It Together
        id: 50
        obj: 'Key `routes` on a `(method, path)` pair. Register `GET /` and `POST /notes`, then write `handle(method, path)` returning `404 Not Found` when nothing matches. Print all three results.'
        expl: 'A tuple key is how one path can answer differently to `GET` and `POST`, and a dict accepts a tuple as a key because tuples cannot change. Read the finished program and note that it is a working router in about twenty lines. The next chapter builds the same thing properly, and then hands you the tidied version to use.'
        hint: 'The decorator now takes two arguments, and the key is `(method, path)`.'
        max: 24/2
        start: |-
          routes = {}


          # Write route(method, path) and handle(method, path) below.
        sol: |-
          routes = {}


          def route(method, path):
              def decorator(fn):
                  routes[(method, path)] = fn
                  return fn
              return decorator


          @route("GET", "/")
          def home():
              return "the front page"


          @route("POST", "/notes")
          def add_note():
              return "note saved"


          def handle(method, path):
              handler = routes.get((method, path))
              if handler is None:
                  return "404 Not Found"
              return handler()


          print(handle("GET", "/"))
          print(handle("POST", "/notes"))
          print(handle("GET", "/missing"))
        tests:
          - exp: |
              the front page
              note saved
              404 Not Found

  - name: Building a Router
    icon: nodes
    levels:
      - name: A Table of Routes
        id: 17
        obj: 'Put `home` and `about` into a dictionary named `routes`, keyed by the paths `/` and `/about`, then call the handler for `/about` and print what it returns.'
        expl: 'A **router** decides which piece of code answers which URL, and the simplest one is a dictionary from path to function. Functions are values in Python, so they can sit in a dictionary just like numbers can. `routes["/about"]` is the function; `routes["/about"]()` is the call.'
        hint: 'Store the function itself — `home`, with no parentheses. The parentheses come later, when you call it.'
        max: 9/1
