      - name: The Request Itself
        id: 39
        obj: 'Answer `/echo` for both `GET` and `POST` with the method and the path, in the form `GET /echo`.'
        expl: '`@app.get` and `@app.post` are shorthand for `@app.route(rule, methods=...)`, and the long form lets one function serve several methods. Which one arrived is then just another fact on the request: `request.method`.'
        hint: '`@app.route("/echo", methods=("GET", "POST"))`, then use `request.method` and `request.path`.'
        max: 9/2
        req:
          - 'GET /echo'
          - 'POST /echo'
        start: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()

          # Answer /echo for GET and POST with the method and path.
        sol: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()


          @app.route("/echo", methods=("GET", "POST"))
          def echo():
              return request.method + " " + request.path
        tests:
          - exp: |
              GET /echo -> 200 OK
              GET /echo
              POST /echo -> 200 OK
              POST /echo
      - name: One Handler, Two Methods
        id: 40
        obj: 'Serve `/notes` from a single function: on `GET` answer `2 notes`, and on `POST` add the posted `text` to `NOTES` and answer `saved, now 3`.'
        expl: 'A collection URL usually means "the notes" no matter how you ask, so keeping both methods in one function keeps the resource in one place. Branch on `request.method` at the top and the two paths through the function stay easy to follow. The list survives between requests because it is an ordinary module-level variable — and vanishes when the program ends, which is what the next chapter fixes.'
        hint: 'Start with `if request.method == "POST":`, append `request.json["text"]`, then fall through to the `GET` answer.'
        max: 14/2
        req:
          - 'GET /notes'
          - { m: POST, p: /notes, json: { text: 'buy milk' } }
          - 'GET /notes'
        start: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()

          NOTES = ["walk the dog", "water the plants"]

          # Serve GET and POST /notes from one function.
        sol: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()

          NOTES = ["walk the dog", "water the plants"]


          @app.route("/notes", methods=("GET", "POST"))
          def notes():
              if request.method == "POST":
                  NOTES.append(request.json["text"])
                  return "saved, now " + str(len(NOTES))
              return str(len(NOTES)) + " notes"
        tests:
          - exp: |
              GET /notes -> 200 OK
              2 notes
              POST /notes -> 200 OK
              saved, now 3
              GET /notes -> 200 OK
              3 notes
