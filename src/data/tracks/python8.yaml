          def home():
              return "Welcome!"


          def about():
              return "A tiny site."


          # Build the routes dict, then call the handler for /about.
        sol: |-
          def home():
              return "Welcome!"


          def about():
              return "A tiny site."


          routes = {"/": home, "/about": about}
