        expl: 'A handler that takes no arguments can only ever say one thing. Passing the request in is what lets it answer differently for different callers — and it keeps the handler a plain function, testable by calling it with a dictionary you made up.'
        hint: 'The handler receives the dict, so `request["name"]` is the name.'
