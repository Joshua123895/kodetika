      - name: Dispatch by Path
        id: 18
        obj: 'Write `dispatch(path)` returning the result of the matching handler, or `404 Not Found` when there is none. Print `dispatch("/")`, then `dispatch("/nope")`.'
        expl: 'Looking a path up with `[]` raises `KeyError` for anything unknown, which is a crash. A server must answer *something* for every URL, so a router uses `.get`, checks for `None`, and turns "no such route" into an ordinary answer. That answer is the famous 404.'
        hint: '`routes.get(path)` returns `None` instead of raising when the path is missing.'
        max: 13/1
        start: |-
          def home():
              return "Welcome!"


          routes = {"/": home}


          def dispatch(path):
              # Return the handler's result, or "404 Not Found".
              pass


          print(dispatch("/"))
          print(dispatch("/nope"))
        sol: |-
          def home():
              return "Welcome!"


          routes = {"/": home}


          def dispatch(path):
              handler = routes.get(path)
              if handler is None:
                  return "404 Not Found"
              return handler()


          print(dispatch("/"))
          print(dispatch("/nope"))
        tests:
          - exp: |
              Welcome!
              404 Not Found
      - name: Method and Path Together
        id: 19
        obj: 'Key `routes` on the `(method, path)` pair, then print the result of the `GET /users` handler and the `POST /users` handler, in that order.'
        expl: '`GET /users` and `POST /users` are different requests to the same URL: one lists the users, the other adds one. So a route is identified by the method *and* the path together, and a tuple makes a perfectly good dictionary key.'
        hint: '`routes[("GET", "/users")]` looks up the pair.'
