  # State is where the two halves stop being two pages and start being an app.
  # Everything here rides on one fact: HTTP forgets you between requests, so
  # anything that persists does so because the server wrote it down and the
  # browser handed the receipt back. The receipt is a cookie; the writing-down is
  # a dictionary. Both are visible in these levels, on purpose — a student who
  # has seen `SESSIONS[token] = name` will never again think a login is magic.
