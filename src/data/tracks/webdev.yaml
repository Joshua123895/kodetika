      - name: One Layout, Every Page
        id: 14
        obj: 'Write `layout(title, body)` returning a document whose `title` is `title` and whose `body` holds an `h1` reading `title` followed by `body`, then serve `GET /about` through it with the title `About`.'
        expl: 'Two pages that each spell out their own `<html>` will drift apart, and a change to the header means editing every handler. One function that takes a title and a body fixes the shape in a single place. Real frameworks call this a template and load it from a file; the idea is exactly this function.'
        hint: '`layout` returns an f-string using `{title}` twice and `{body}` once.'
        max: 18/2
        checks:
          has:
            - 'def layout'
        req:
          - 'GET /about'
        render: 'GET /about'
