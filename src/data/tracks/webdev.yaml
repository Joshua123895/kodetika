        expl: 'A 404 is still a page, and the default one is a bare line of JSON that looks like your site fell over. Serving your own keeps the status honest — the response is still a 404, so a machine reading it is not misled — while giving a person something to do next. That pairing, correct status *and* a usable page, is what separates a finished app from a working one.'
