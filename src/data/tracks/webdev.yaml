        expl: 'Whatever someone types arrives as a string, and a string dropped straight into markup *becomes* markup. A note containing a tag would style your page; one containing a `<script>` would run code in every visitor''s browser. `html.escape` turns `<` into `&lt;`, so the browser draws the characters instead of obeying them. This is the single most important habit in this track.'
