name: Web Developer
slug: web-dev
icon: webdev
desc: 'Master full-stack development: serving pages, forms, an API your own page calls, sessions, shipping, and more.'
difficulty: 3

# The capstone. Every other track teaches one side of a wall: HTML & CSS and
# JavaScript live in the browser, Backend Basics and APIs and Databases live on
# the server, and a student can finish all four without ever seeing the two speak
# to each other. This track is that conversation.
#
# How it is graded is the whole design. A level here runs the student's Python
# exactly as a backend level does — same miniweb, same appended `req:` driver —
# and then takes one of the responses and renders it as a page, checked with the
# same `expect:` assertions the HTML track uses. `render:` names which response
# is the page. The rest of the responses become a `fetch` the page can call, so
# from chapter 3 onward the script inside the page is talking to the handlers
# beside it, and both are the student's.
#
# The bargain that makes it verifiable: every response is computed before the
# page renders, so the page's `fetch` cannot change what a later one returns.
# Levels say so out loud rather than pretending otherwise.
chapters:
  - name: Serving a Page
    icon: display
    lib: miniweb
    levels:
      - name: A Page, Not a String
        id: 1
        obj: 'Answer `GET /` with an `h1` reading `My Site`.'
        expl: 'Every backend level so far was graded on the text your app printed. This one is graded on the **page a browser drew from it**. Nothing about your handler changes — you still return a string — but that string is now markup, and the check looks for an `h1` element in it rather than for characters in a line of output.'
        hint: 'Return the whole tag as one string: `"<h1>My Site</h1>"`.'
        max: 8/2
        req:
          - 'GET /'
        render: 'GET /'
        expect:
          - sel: h1
            text: 'My Site'
        start: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          # Answer GET / with an <h1> reading My Site.
        sol: |-
          from miniweb import MiniWeb

          app = MiniWeb()


          @app.get("/")
          def home():
              return "<h1>My Site</h1>"

      - name: More Than One Element
        id: 2
        obj: 'Answer `GET /` with an `h1` reading `My Site` and a `p` reading `Built with Python.`'
        expl: 'A page is many elements, and a handler returns one string — so the string has to hold all of them. Python''s triple-quoted string spans lines, which lets you lay the markup out the way you would in an `.html` file instead of gluing tags together with `+`.'
        hint: 'Open with `"""`, write the two tags on their own lines, close with `"""`.'
        max: 10/2
        req:
          - 'GET /'
        render: 'GET /'
        expect:
          - sel: h1
            text: 'My Site'
          - sel: p
            text: 'Built with Python.'
        start: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          # Answer GET / with an <h1> and a <p>.
        sol: |-
          from miniweb import MiniWeb

          app = MiniWeb()


          @app.get("/")
          def home():
              return """
              <h1>My Site</h1>
              <p>Built with Python.</p>
              """

      - name: A Value in the Markup
        id: 3
        obj: 'Answer `GET /` with an `h1` reading `Hello, Ada!`, building the name from the variable `name = "Ada"`.'
        expl: 'This is the reason to serve HTML from a program rather than write a file: the markup can carry values the program worked out. An f-string drops a Python value into the middle of a tag, and from here the page is no longer fixed — it says whatever your code decided it should say.'
        hint: 'Prefix the string with `f` and write `{name}` inside the `h1`.'
        max: 9/2
        checks:
          has:
            - 'f"'
        req:
          - 'GET /'
        render: 'GET /'
        expect:
          - sel: h1
            text: 'Hello, Ada!'
        start: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          name = "Ada"

          # Answer GET / with an <h1> that greets the name.
        sol: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          name = "Ada"


          @app.get("/")
          def home():
              return f"<h1>Hello, {name}!</h1>"

      - name: A Page Per Visitor
        id: 4
        obj: 'Answer `GET /hello/<name>` with an `h1` reading `Hello, Grace!`'
        expl: 'The value in the markup can come from the URL itself. You already know how to capture a path segment; the only new part is that the captured value now lands inside a tag instead of inside a line of printed text. One handler, and every name has its own page.'
        hint: 'The handler takes `name` as a parameter, and the f-string uses it.'
        max: 8/2
        req:
          - 'GET /hello/Grace'
        render: 'GET /hello/Grace'
        expect:
          - sel: h1
            text: 'Hello, Grace!'
        start: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          # Answer GET /hello/<name> with a greeting in an <h1>.
        sol: |-
          from miniweb import MiniWeb

          app = MiniWeb()


          @app.get("/hello/<name>")
          def hello(name):
              return f"<h1>Hello, {name}!</h1>"

      - name: A List From a List
        id: 5
        obj: 'Answer `GET /` with a `ul` holding one `li` per name in `NAMES`.'
        expl: 'A Python list becomes an HTML list by turning each item into a tag and joining them. `"".join(...)` glues the pieces with nothing between, which is what you want inside a `ul` — the browser puts the items on their own lines, not your newlines.'
        hint: 'Build the items with a comprehension, then put `"".join(items)` inside the `ul`.'
        max: 11/2
        req:
          - 'GET /'
        render: 'GET /'
        expect:
          - sel: 'ul li'
            count: 3
          - sel: 'ul li'
            text: Ada
        start: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          NAMES = ["Ada", "Grace", "Alan"]

          # Answer GET / with a <ul> of the names.
        sol: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          NAMES = ["Ada", "Grace", "Alan"]


          @app.get("/")
          def home():
              items = "".join(f"<li>{name}</li>" for name in NAMES)
              return f"<ul>{items}</ul>"

      - name: A Function That Builds Markup
        id: 6
        obj: 'Write `card(note)` returning `<div class="card">` containing an `h2` with the note''s `title`, and answer `GET /` with a card for each note in `NOTES`.'
        expl: 'Markup gets long, and a handler that builds a whole page inline stops being readable fast. Pulling one piece into its own function is the same move as any other refactor — and it is the ancestor of every component system you will meet later. The handler now says *what the page is made of* instead of *how each part is spelled*.'
        hint: '`card` returns one string. The handler joins a `card(n)` for every note.'
        max: 14/2
        checks:
          has:
            - 'def card'
        req:
          - 'GET /'
        render: 'GET /'
        expect:
          - sel: 'div.card'
            count: 2
          - sel: 'div.card h2'
            text: 'Buy milk'
        start: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          NOTES = [{"title": "Buy milk"}, {"title": "Walk the dog"}]

          # Write card(note), then answer GET / with one card per note.
        sol: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          NOTES = [{"title": "Buy milk"}, {"title": "Walk the dog"}]


          def card(note):
              return f'<div class="card"><h2>{note["title"]}</h2></div>'


          @app.get("/")
          def home():
              return "".join(card(note) for note in NOTES)

      - name: A Page With a Shape
        id: 7
        obj: 'Answer `GET /` with a full document: an `html` element containing a `head` with a `title` reading `My Site`, and a `body` containing an `h1` reading `My Site`.'
        expl: 'Browsers forgive a fragment — they build the missing `html`, `head` and `body` around it. Serving the real document anyway is what lets you put things in the `head` that a fragment has nowhere to hold: the tab''s title, the character set, the stylesheet link. From here your handler returns a page, not a piece of one.'
        hint: 'The triple-quoted string starts with `<!DOCTYPE html>` and wraps everything in `<html>`.'
        max: 16/2
        req:
          - 'GET /'
        render: 'GET /'
        expect:
          - sel: title
            text: 'My Site'
          - sel: 'body h1'
            text: 'My Site'
        start: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          # Answer GET / with a complete HTML document.
        sol: |-
          from miniweb import MiniWeb

          app = MiniWeb()


          @app.get("/")
          def home():
              return """<!DOCTYPE html>
          <html>
            <head>
              <title>My Site</title>
            </head>
            <body>
              <h1>My Site</h1>
            </body>
          </html>"""

      - name: Style From the Server
        id: 8
        obj: 'Answer `GET /` with a document whose `head` holds a `style` setting `h1` to `color: #7AA2F7`, and whose `body` has an `h1` reading `My Site`.'
        expl: 'The stylesheet is part of what the server sends, so it can be built by the program exactly as the markup is. A `<style>` element in the `head` keeps everything in one response — one request, one page, styled. Later you will serve the CSS as its own file; the browser does not mind either way.'
        hint: 'Put `<style> h1 { color: #7AA2F7; } </style>` inside the `head`.'
        max: 18/2
        req:
          - 'GET /'
        render: 'GET /'
        expect:
          - sel: h1
            text: 'My Site'
            style:
              color: '#7AA2F7'
        start: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          # Answer GET / with a styled page.
        sol: |-
          from miniweb import MiniWeb

          app = MiniWeb()


          @app.get("/")
          def home():
              return """<!DOCTYPE html>
          <html>
            <head>
              <style>
                h1 { color: #7AA2F7; }
              </style>
            </head>
            <body>
              <h1>My Site</h1>
            </body>
          </html>"""

  # The first chapter serves one page and the next one posts a form and
  # redirects to "/", which quietly assumes a site is several pages that link to
  # one another. Nothing had taught that. This chapter is the missing middle:
  # a second route, a link, a path that names a thing, and the 404 that happens
  # when it names nothing. The redirect in the next chapter then arrives as a
  # new way to reach a page the student has already built and linked to.
  - name: More Than One Page
    icon: connection
    lib: miniweb
    levels:
      - name: A Second Page
        id: 41
        obj: 'Leave `/` as it is and add `GET /about`, answering with an `h1` reading `About`.'
        expl: 'A site is a set of routes, and each one owns a URL. Nothing connects them yet, which is fine: they are separate pages that happen to live in the same app, exactly as separate `.html` files would live in the same folder. What is graded here is the second page, so the browser tab is pointed at `/about`.'
        hint: 'A second `@app.get`, with `/about` as its path.'
        max: 13/2
        req:
          - 'GET /'
          - 'GET /about'
        render: 'GET /about'
        expect:
          - sel: h1
            text: 'About'
        start: |-
          from miniweb import MiniWeb

          app = MiniWeb()


          @app.get("/")
          def home():
              return "<h1>My Site</h1>"


          # Add the /about page below.
        sol: |-
          from miniweb import MiniWeb

          app = MiniWeb()


          @app.get("/")
          def home():
              return "<h1>My Site</h1>"


          @app.get("/about")
          def about():
              return "<h1>About</h1>"

      - name: A Link Between Them
        id: 42
        obj: 'Add an `a` to the home page reading `About` and pointing at `/about`.'
        expl: 'A link is what turns two routes into one site. The `href` is a path on your own server rather than a full address, so the browser asks the same app that served the page it is on. This is the first time the markup you wrote and the routes you wrote refer to one another.'
        hint: 'The `href` is the same string as the path in the decorator: `/about`.'
        max: 15/2
        req:
          - 'GET /'
          - 'GET /about'
        render: 'GET /'
        expect:
          - sel: h1
            text: 'My Site'
          - sel: a
            text: 'About'
            attr:
              href: '/about'
        start: |-
          from miniweb import MiniWeb

          app = MiniWeb()


          @app.get("/")
          def home():
              return "<h1>My Site</h1>"


          @app.get("/about")
          def about():
              return "<h1>About</h1>"
        sol: |-
          from miniweb import MiniWeb

          app = MiniWeb()


          @app.get("/")
          def home():
              return """
              <h1>My Site</h1>
              <a href="/about">About</a>
              """


          @app.get("/about")
          def about():
              return "<h1>About</h1>"

      - name: A Page With a Title
        id: 43
        obj: 'Wrap the home page in `html`, `head` and `body`, with a `title` reading `My Site`.'
        expl: 'Everything so far has been a fragment, and browsers are forgiving enough to build a document around it. A real page says so itself. The `title` is the one part of `head` a reader actually sees, in the tab and in a bookmark, and it is separate from the `h1` because one names the document and the other names the content.'
        hint: 'The `title` goes inside `head`, and the visible markup moves inside `body`.'
        max: 18/2
        req:
          - 'GET /'
        render: 'GET /'
        expect:
          - sel: title
            text: 'My Site'
          - sel: body h1
            text: 'My Site'
        start: |-
          from miniweb import MiniWeb

          app = MiniWeb()


          @app.get("/")
          def home():
              return "<h1>My Site</h1>"
        sol: |-
          from miniweb import MiniWeb

          app = MiniWeb()


          @app.get("/")
          def home():
              return """
              <html>
                <head>
                  <title>My Site</title>
                </head>
                <body>
                  <h1>My Site</h1>
                </body>
              </html>
              """

      - name: A Path That Names a Thing
        id: 44
        obj: 'Answer `GET /notes/<int:id>` with an `h1` holding that note text from `NOTES`.'
        expl: 'Until now every path was fixed. A path with a parameter in it names one item out of many, which is how nearly every real URL works: the id is part of the address rather than something the page asks for afterwards. Declaring it as `<int:id>` means the handler receives a real integer, ready to use as a dictionary key.'
        hint: 'The parameter name in the path has to match the argument name in the function.'
        max: 14/2
        req:
          - 'GET /notes/1'
        render: 'GET /notes/1'
        expect:
          - sel: h1
            text: 'buy milk'
        start: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          NOTES = {1: "buy milk", 2: "walk dog"}


          # Answer GET /notes/<int:id> below.
        sol: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          NOTES = {1: "buy milk", 2: "walk dog"}


          @app.get("/notes/<int:id>")
          def note(id):
              return f"<h1>{NOTES[id]}</h1>"

      - name: A List That Links
        id: 45
        obj: 'Answer `GET /` with a `ul` holding one `li` per note, each containing an `a` whose text is the note and whose `href` is `/notes/` followed by its id.'
        expl: 'This is the shape of most pages on the internet: a list of things, each linking to a page about that thing. Both the text and the address are built from the same data in the same loop, so a note added to `NOTES` appears in the list and its link works, with no further edit anywhere.'
        hint: 'Loop over `NOTES.items()` so you have the id and the text together.'
        max: 20/2
        req:
          - 'GET /'
          - 'GET /notes/1'
        render: 'GET /'
        expect:
          - sel: ul li a
            count: 2
          - sel: ul li a
            text: 'buy milk'
            attr:
              href: '/notes/1'
        start: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          NOTES = {1: "buy milk", 2: "walk dog"}


          @app.get("/notes/<int:id>")
          def note(id):
              return f"<h1>{NOTES[id]}</h1>"


          # Answer GET / with a linked list of the notes.
        sol: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          NOTES = {1: "buy milk", 2: "walk dog"}


          @app.get("/notes/<int:id>")
          def note(id):
              return f"<h1>{NOTES[id]}</h1>"


          @app.get("/")
          def home():
              items = "".join(
                  f'<li><a href="/notes/{id}">{text}</a></li>' for id, text in NOTES.items()
              )
              return f"<ul>{items}</ul>"

      - name: When the Thing Is Missing
        id: 46
        obj: 'Make `/notes/<int:id>` answer an `h1` reading `Not found` when the id is not in `NOTES`, instead of crashing.'
        expl: 'A URL naming something that does not exist is not a bug in your code, it is an ordinary thing that happens: a stale link, an old bookmark, a guessed address. Reading `NOTES[id]` for a missing id raises and becomes a 500, which blames the server for a fair question. A page saying so plainly is the honest answer.'
        hint: '`NOTES.get(id)` returns `None` rather than raising, so the missing case becomes an `if`.'
        max: 16/2
        req:
          - 'GET /notes/9'
        render: 'GET /notes/9'
        expect:
          - sel: h1
            text: 'Not found'
        start: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          NOTES = {1: "buy milk", 2: "walk dog"}


          @app.get("/notes/<int:id>")
          def note(id):
              return f"<h1>{NOTES[id]}</h1>"
        sol: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          NOTES = {1: "buy milk", 2: "walk dog"}


          @app.get("/notes/<int:id>")
          def note(id):
              text = NOTES.get(id)
              if text is None:
                  return "<h1>Not found</h1>"
              return f"<h1>{text}</h1>"

      - name: A Bar of Links
        id: 47
        obj: 'Add a `nav` to the home page holding two `a` elements: `Home` pointing at `/`, and `About` pointing at `/about`.'
        expl: 'A `nav` element marks the block of links that navigates the site, which is what lets a screen reader offer to skip past it. Grouping them is also the practical step before the next chapter, where the same block has to appear on every page and therefore wants to be a function rather than something you retype.'
        hint: 'Two `a` elements inside one `nav`, above the heading.'
        max: 22/2
        req:
          - 'GET /'
          - 'GET /about'
        render: 'GET /'
        expect:
          - sel: nav a
            count: 2
          - sel: nav a
            text: 'Home'
            attr:
              href: '/'
        start: |-
          from miniweb import MiniWeb

          app = MiniWeb()


          @app.get("/")
          def home():
              return "<h1>My Site</h1>"


          @app.get("/about")
          def about():
              return "<h1>About</h1>"
        sol: |-
          from miniweb import MiniWeb

          app = MiniWeb()


          @app.get("/")
          def home():
              return """
              <nav>
                <a href="/">Home</a>
                <a href="/about">About</a>
              </nav>
              <h1>My Site</h1>
              """


          @app.get("/about")
          def about():
              return "<h1>About</h1>"

      - name: Putting It Together
        id: 48
        obj: 'Build the site: `/` shows a `nav` linking Home, then a `ul` linking to each note. `/notes/<int:id>` shows the note in an `h1`, or `Not found` when there is no such note.'
        expl: 'Every part of the chapter at once, and a site that genuinely works: you can start at the front page, follow a link to a note, and still get a sensible page for an address nobody meant to exist. The next chapter adds the one thing still missing, which is a way for a visitor to put something new into that list.'
        hint: 'The two handlers you already wrote, with the nav added to the front page.'
        max: 28/2
        req:
          - 'GET /'
          - 'GET /notes/2'
          - 'GET /notes/9'
        render: 'GET /'
        expect:
          - sel: nav a
            count: 1
          - sel: ul li a
            count: 2
          - sel: 'ul li:nth-child(2) a'
            text: 'walk dog'
            attr:
              href: '/notes/2'
        start: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          NOTES = {1: "buy milk", 2: "walk dog"}


          # Build both pages below.
        sol: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          NOTES = {1: "buy milk", 2: "walk dog"}


          @app.get("/")
          def home():
              items = "".join(
                  f'<li><a href="/notes/{id}">{text}</a></li>' for id, text in NOTES.items()
              )
              return f"""
              <nav><a href="/">Home</a></nav>
              <ul>{items}</ul>
              """


          @app.get("/notes/<int:id>")
          def note(id):
              text = NOTES.get(id)
              if text is None:
                  return "<h1>Not found</h1>"
              return f"<h1>{text}</h1>"

  - name: Pages That Change
    icon: event
    lib: miniweb
    levels:
      - name: A Form to Fill In
        id: 9
        obj: 'Answer `GET /` with a `form` whose `method` is `post` and whose `action` is `/notes`, holding an `input` named `text` and a `button` reading `Add`.'
        expl: 'A form is how a page sends something back. `action` is the path it sends to and `method` is the verb it uses — `post`, because the request is going to change something. Each field''s `name` becomes the key your handler reads it by, which is why an unnamed input arrives as nothing at all.'
        hint: '`<form method="post" action="/notes">` wraps the input and the button.'
        max: 12/2
        req:
          - 'GET /'
        render: 'GET /'
        expect:
          - sel: form
            attr:
              method: post
              action: /notes
          - sel: 'form input'
            attr:
              name: text
          - sel: 'form button'
            text: Add
        start: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          # Answer GET / with a form that posts to /notes.
        sol: |-
          from miniweb import MiniWeb

          app = MiniWeb()


          @app.get("/")
          def home():
              return """
              <form method="post" action="/notes">
                <input name="text">
                <button>Add</button>
              </form>
              """

      - name: What the Form Sends
        id: 10
        obj: 'Answer `POST /notes` by appending `request.form["text"]` to `NOTES`, then answer `GET /` with one `li` per note.'
        expl: 'The browser packs the form''s fields into the request body, and `request.form` is that unpacked — a dict keyed by each field''s `name`. Two handlers now share one list: one writes to it, the other reads it. That is a web app in miniature, and everything after this is the same shape with more care taken.'
        hint: '`NOTES.append(request.form["text"])` in the POST handler.'
        max: 16/2
        req:
          - { m: POST, p: /notes, form: { text: 'buy milk' } }
          - 'GET /'
        render: 'GET /'
        expect:
          - sel: 'ul li'
            count: 1
          - sel: 'ul li'
            text: 'buy milk'
        start: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()

          NOTES = []

          # POST /notes should add a note. GET / should list them.
        sol: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()

          NOTES = []


          @app.post("/notes")
          def add():
              NOTES.append(request.form["text"])
              return "added"


          @app.get("/")
          def home():
              items = "".join(f"<li>{note}</li>" for note in NOTES)
              return f"<ul>{items}</ul>"

      - name: Post, Then Send Them Back
        id: 11
        obj: 'Change `POST /notes` to `redirect("/")` after appending, so the browser lands back on the list.'
        expl: 'Answering a POST with a page is a trap: the page is the *result of a POST*, so reloading it asks the browser to send the form again, and the student adds their note twice. Redirecting instead means the reloadable page was reached by a GET, and reloading it is harmless. This pattern has a name — post/redirect/get — and it is worth knowing by it.'
        hint: '`return redirect("/")` instead of returning text.'
        max: 17/2
        checks:
          has:
            - 'redirect\('
        req:
          - { m: POST, p: /notes, form: { text: 'buy milk' } }
          - 'GET /'
        render: 'GET /'
        expect:
          - sel: 'ul li'
            text: 'buy milk'
        # The page looks identical either way — what the redirect changes is the
        # status of a request the browser followed, which only the transcript
        # sees. Both halves are checked, so neither can be faked.
        tests:
          - exp: |
              POST /notes -> 302 Found
              GET / -> 200 OK
              <ul><li>buy milk</li></ul>
        start: |-
          from miniweb import MiniWeb, request, redirect

          app = MiniWeb()

          NOTES = []


          @app.post("/notes")
          def add():
              NOTES.append(request.form["text"])
              return "added"


          @app.get("/")
          def home():
              items = "".join(f"<li>{note}</li>" for note in NOTES)
              return f"<ul>{items}</ul>"
        sol: |-
          from miniweb import MiniWeb, request, redirect

          app = MiniWeb()

          NOTES = []


          @app.post("/notes")
          def add():
              NOTES.append(request.form["text"])
              return redirect("/")


          @app.get("/")
          def home():
              items = "".join(f"<li>{note}</li>" for note in NOTES)
              return f"<ul>{items}</ul>"

