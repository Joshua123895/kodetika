        start: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          # Write layout(title, body), then serve /about through it.
        sol: |-
          from miniweb import MiniWeb

          app = MiniWeb()


          def layout(title, body):
              return f"""<!DOCTYPE html>
          <html>
            <head><title>{title}</title></head>
            <body>
              <h1>{title}</h1>
              {body}
            </body>
          </html>"""


          @app.get("/about")
          def about():
              return layout("About", "<p>A small site.</p>")

      - name: Knowing Which Page You Are On
        id: 15
        obj: 'Answer `GET /about` with a `nav` holding a link to `/` and a link to `/about`, giving the link whose `href` matches `request.path` the class `active`.'
        expl: '`request.path` is the path the current request asked for, so the page can describe itself. Marking the current link is the smallest useful thing that knowledge buys, and it is the first time the page depends on *which* request produced it rather than only on your data.'
        hint: 'Build each link with a class that is `"active"` only when its href equals `request.path`.'
        max: 16/2
        req:
          - 'GET /about'
        render: 'GET /about'
        expect:
          - sel: 'nav a'
            count: 2
          - sel: 'nav a.active'
            count: 1
          - sel: 'nav a.active'
            attr:
              href: /about
        start: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()

          PAGES = [("/", "Home"), ("/about", "About")]

          # Mark the link for the page you are on.
        sol: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()

          PAGES = [("/", "Home"), ("/about", "About")]


          @app.get("/about")
          def about():
              links = ""
              for href, label in PAGES:
                  cls = "active" if href == request.path else ""
                  links += f'<a href="{href}" class="{cls}">{label}</a>'
              return f"<nav>{links}</nav>"

