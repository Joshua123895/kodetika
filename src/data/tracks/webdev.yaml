          from miniweb import MiniWeb, request

          app = MiniWeb()

          LINKS = [
              {"title": "Kodetika", "url": "https://kodetika.vercel.app"},
              {"title": "MDN", "url": "https://developer.mozilla.org"},
          ]


          @app.get("/api/links")
          def api_links():
              return LINKS


          @app.post("/api/links")
          def add_link():
              LINKS.append(request.json)
              return request.json, 201


          @app.get("/")
          def home():
              return """
              <h1>Linkboard</h1>
              <ul id="board"></ul>
              <script>
                fetch("/api/links")
                  .then(r => r.json())
                  .then(links => {
                    document.querySelector("#board").innerHTML = links
                      .map(l => '<li><a href="' + l.url + '">' + l.title + "</a></li>")
                      .join("");
