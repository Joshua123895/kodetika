        tests:
          - match: 'Hello, Ada'
        start: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()

          # Two requests arrive: one with a cookie, one without.
        sol: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()


          def cookies():
              jar = {}
              for part in request.headers.get("Cookie", "").split(";"):
                  if "=" in part:
                      key, value = part.split("=", 1)
                      jar[key.strip()] = value.strip()
              return jar


          @app.get("/")
          def home():
              name = cookies().get("name")
              if name is None:
                  return "<h1>Please sign in</h1>"
              return "<h1>Hello, " + name + "</h1>"

      - name: The Cookie Is Only a Key
        id: 28
        obj: 'Have `POST /login` store the submitted `name` in `SESSIONS` under the token `abc123`, answer `302` to `/` with `Set-Cookie: session=abc123`, and have `GET /` greet whoever that token belongs to.'
        expl: 'Storing the name in the cookie would work, and it is why so many sites once let you rename yourself to `admin`. What goes in the cookie is a **key** — a meaningless token — and what it unlocks lives on the server where the browser cannot touch it. These requests run in order against one live app, so the dictionary the login wrote is still there when the next request arrives.'
