        expl: 'Sometimes the second request depends on the first: you cannot ask for note 7 until you know 7 is the id. Returning a `fetch` from inside a `.then` chains them — the next `.then` waits for the inner request too, rather than for the promise itself. Getting this wrong gives you a `Promise` where you expected data, which is one of the most common bugs in front-end code.'
