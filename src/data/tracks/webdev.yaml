        obj: 'Read the `Cookie` header on `GET /` and answer with an `h1` reading `Hello, Ada` when it carries `name=Ada`, or `Hello, stranger` when it carries nothing useful.'
        expl: 'Everything the browser was given comes back in a single `Cookie` header, semicolon-separated, which means reading one is string work and nothing more. Note what you did *not* have to do: the browser attached this without being asked, on a request the page never wrote a line of code for.'
        hint: 'Split the header on `";"`, then split each piece on `"="` once.'
        max: 18/2
        req:
          - { m: GET, p: /, hdr: { Cookie: 'name=Ada' } }
        render: 'GET /'
        expect:
          - sel: h1
            text: 'Hello, Ada'
        start: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()

          # The browser sends every cookie in one header. Find `name` inside it.
        sol: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()


          def cookies():
              jar = {}
              for part in request.headers.get("Cookie", "").split(";"):
                  if "=" in part:
                      key, value = part.split("=", 1)
                      jar[key.strip()] = value.strip()
              return jar


          @app.get("/")
          def home():
              return "<h1>Hello, " + cookies().get("name", "stranger") + "</h1>"

