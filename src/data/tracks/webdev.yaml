        start: |-
          from miniweb import MiniWeb, request, redirect

          app = MiniWeb()

          SESSIONS = {}
          TOKEN = "abc123"

          # The cookie carries the token. The name stays here, in SESSIONS.
        sol: |-
          from miniweb import MiniWeb, request, redirect

          app = MiniWeb()

          SESSIONS = {}
          TOKEN = "abc123"


          @app.post("/login")
          def login():
              SESSIONS[TOKEN] = request.form["name"]
              response = redirect("/")
              response.headers["Set-Cookie"] = "session=" + TOKEN
              return response


          @app.get("/")
          def home():
              token = request.headers.get("Cookie", "").split("=", 1)[-1]
              return "<h1>Hello, " + SESSIONS.get(token, "stranger") + "</h1>"

      - name: Signing Out
        id: 29
        obj: 'Have `POST /logout` forget the session and answer with `Set-Cookie: session=; Max-Age=0`, so the `GET /` that follows — still carrying the old cookie — shows `Please sign in`.'
        expl: 'Expiring the cookie is a *request*: you are asking the browser to throw the receipt away, and a browser that ignores you will keep sending it. Both requests here carry the same cookie for exactly that reason. What actually ends the session is the line that removes it from `SESSIONS` — everything else is politeness.'
        hint: '`SESSIONS.pop(token, None)` removes it without complaining when it is already gone.'
        max: 26/2
        req:
          - { m: POST, p: /logout, hdr: { Cookie: 'session=abc123' } }
          - { m: GET, p: /, hdr: { Cookie: 'session=abc123' } }
        see:
          - Set-Cookie
        render: 'GET /'
        expect:
          - sel: h1
            text: 'Please sign in'
        tests:
          - match: 'Max-Age=0'
        start: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()

          SESSIONS = {"abc123": "Ada"}


          def token():
              return request.headers.get("Cookie", "").split("=", 1)[-1]


          @app.get("/")
          def home():
              name = SESSIONS.get(token())
              if name is None:
                  return "<h1>Please sign in</h1>"
              return "<h1>Hello, " + name + "</h1>"
        sol: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()

          SESSIONS = {"abc123": "Ada"}


          def token():
              return request.headers.get("Cookie", "").split("=", 1)[-1]


          @app.post("/logout")
          def logout():
              SESSIONS.pop(token(), None)
              return "", 200, {"Set-Cookie": "session=; Max-Age=0"}


          @app.get("/")
          def home():
              name = SESSIONS.get(token())
              if name is None:
                  return "<h1>Please sign in</h1>"
              return "<h1>Hello, " + name + "</h1>"

      - name: A Page Only for Members
        id: 30
        obj: 'Answer `GET /account` with an `h1` reading `Your account` when the session cookie is known, and a `302` to `/login` when it is not.'
        expl: 'A page nobody may see without signing in is not a page you hide — it is a page that checks. Sending the stranger to `/login` rather than showing them an error is the kinder half of the same decision, and it is why you land on a login form instead of a wall when a session quietly expires.'
        hint: 'Look the token up first; `return redirect("/login")` when it is not there.'
        max: 22/2
        req:
          - { m: GET, p: /account, hdr: { Cookie: 'session=abc123' } }
          - 'GET /account'
        render: 'GET /account'
        expect:
          - sel: h1
            text: 'Your account'
        tests:
          - match: 'GET /account -> 302 Found'
        start: |-
          from miniweb import MiniWeb, request, redirect

          app = MiniWeb()

          SESSIONS = {"abc123": "Ada"}

          # One request is signed in. The other is a stranger.
        sol: |-
          from miniweb import MiniWeb, request, redirect

          app = MiniWeb()

          SESSIONS = {"abc123": "Ada"}


          @app.get("/account")
          def account():
              token = request.headers.get("Cookie", "").split("=", 1)[-1]
              if token not in SESSIONS:
                  return redirect("/login")
              return "<h1>Your account</h1>"

      - name: The Front End Asks Who You Are
        id: 31
        obj: 'Serve `GET /api/me` returning the signed-in name as JSON, and have the page fetch it and put `Signed in as Ada` in `#who`.'
        expl: 'The page never sends the cookie — the browser attaches it to the `fetch` on its own, exactly as it does for the request that loaded the page. That is why an API can know who is asking without the front end holding on to any identity at all, and why `/api/me` is one of the first routes most real apps grow.'
        hint: 'Answer `{"name": ...}` from the server, then read `me.name` in the `.then`.'
        max: 32/2
        req:
          - { m: GET, p: /, hdr: { Cookie: 'session=abc123' } }
          - { m: GET, p: /api/me, hdr: { Cookie: 'session=abc123' } }
        render: 'GET /'
        expect:
          - sel: '#who'
            text: 'Signed in as Ada'
        start: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()

          SESSIONS = {"abc123": "Ada"}

          # Serve /api/me, and have the page ask it who is here.
        sol: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()

          SESSIONS = {"abc123": "Ada"}


          @app.get("/api/me")
          def api_me():
              token = request.headers.get("Cookie", "").split("=", 1)[-1]
              return {"name": SESSIONS.get(token)}


          @app.get("/")
          def home():
              return """
              <p id="who"></p>
              <script>
                fetch("/api/me")
                  .then(r => r.json())
                  .then(me => {
                    document.querySelector("#who").textContent =
                      me.name ? "Signed in as " + me.name : "Not signed in";
                  });
              </script>
              """

      - name: Never Trust the Cookie
        id: 32
        obj: 'Have `GET /admin` answer an `h1` reading `Admin` only when the cookie carries a token that is in `SESSIONS`, and `403` otherwise — including for a cookie that simply claims to be an admin.'
        expl: 'A cookie is text your own app handed out, and anyone can retype it. The second request here is a forgery, and a convincing one: it says the right thing in the right header. It fails for the only reason that ever works — the value was never in `SESSIONS`, so it unlocks nothing. Check what the server wrote down, never what the browser says.'
        hint: '`if token not in SESSIONS: abort(403)`.'
        max: 20/2
        req:
          - { m: GET, p: /admin, hdr: { Cookie: 'session=abc123' } }
          - { m: GET, p: /admin, hdr: { Cookie: 'role=admin' } }
        render: 'GET /admin'
        expect:
          - sel: h1
            text: Admin
        tests:
          - match: 'GET /admin -> 403 Forbidden'
        start: |-
          from miniweb import MiniWeb, request, abort

          app = MiniWeb()

          SESSIONS = {"abc123": "Ada"}

          # One of these two cookies is a lie. Only SESSIONS can tell you which.
        sol: |-
          from miniweb import MiniWeb, request, abort

          app = MiniWeb()

          SESSIONS = {"abc123": "Ada"}


          @app.get("/admin")
          def admin():
              token = request.headers.get("Cookie", "").split("=", 1)[-1]
              if token not in SESSIONS:
                  abort(403)
              return "<h1>Admin</h1>"

  # The last chapter is the parts of an app nobody demos: the route a machine
  # calls to see whether you are alive, the header that stops a request from
  # happening at all, the answer you give when the request was wrong. They are
  # also the parts that separate a working app from a shipped one, which is why
  # they come after everything else rather than instead of it.
  - name: Ship It
    icon: project
    lib: miniweb
    levels:
      - name: A Health Check
        id: 33
        obj: 'Serve `GET /healthz` returning `{"ok": True}`, alongside a home page whose `h1` reads `Notes`.'
        expl: 'Nobody visits this route. A load balancer does, every few seconds, and it decides from the status code whether to keep sending your app real traffic. Writing one is the smallest possible step from "it runs on my laptop" to "something else is depending on it".'
        hint: 'Return the dictionary; miniweb turns a `dict` into JSON on its own.'
        max: 16/2
        req:
          - 'GET /'
          - 'GET /healthz'
        render: 'GET /'
        expect:
          - sel: h1
            text: Notes
        tests:
          - match: '\{"ok": true\}'
        start: |-
          from miniweb import MiniWeb

          app = MiniWeb()


          @app.get("/")
          def home():
              return "<h1>Notes</h1>"
        sol: |-
          from miniweb import MiniWeb

          app = MiniWeb()


          @app.get("/healthz")
          def healthz():
              return {"ok": True}


          @app.get("/")
          def home():
              return "<h1>Notes</h1>"

      - name: One Path, Two Shapes
        id: 34
        obj: 'Have `GET /notes` answer a `li` per note as HTML, unless the request''s `Accept` header is `application/json`, in which case answer `NOTES` itself.'
        expl: 'One resource, two representations. A browser asking for a page and a script asking for data want the same notes in different clothes, and `Accept` is how they say which. This is why the same URL can hand a web page to a browser and JSON to a command line.'
        hint: '`request.headers.get("Accept", "")` — then one branch returns markup and the other returns the list.'
        max: 20/2
        req:
          - 'GET /notes'
          - { m: GET, p: /notes, hdr: { Accept: 'application/json' } }
        render: 'GET /notes'
        expect:
          - sel: li
            count: 2
        tests:
          - match: '\[\{"text": "buy milk"\}'
        start: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()

          NOTES = [{"text": "buy milk"}, {"text": "walk the dog"}]


          @app.get("/notes")
          def notes():
              return "<ul>" + "".join("<li>" + n["text"] + "</li>" for n in NOTES) + "</ul>"
        sol: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()

          NOTES = [{"text": "buy milk"}, {"text": "walk the dog"}]


          @app.get("/notes")
          def notes():
              if request.headers.get("Accept", "") == "application/json":
                  return NOTES
              return "<ul>" + "".join("<li>" + n["text"] + "</li>" for n in NOTES) + "</ul>"

      - name: A Header That Saves a Request
        id: 35
        obj: 'Answer `GET /` with an `h1` reading `Notes` and a `Cache-Control` header of `max-age=60`.'
        expl: 'The fastest response is the one that never leaves the browser. `max-age=60` tells it this answer is good for a minute, so a visitor who comes back inside that minute gets the page without touching your app at all. The number is a promise, though — set it long on something that changes and people will stare at a stale page until it expires.'
        hint: 'Same three-part tuple as the cookie level, with a different header name.'
        max: 12/2
        req:
          - 'GET /'
        see:
          - Cache-Control
        render: 'GET /'
        expect:
          - sel: h1
            text: Notes
        tests:
          - match: 'Cache-Control: max-age=60'
        start: |-
          from miniweb import MiniWeb

          app = MiniWeb()


          @app.get("/")
          def home():
              return "<h1>Notes</h1>"
        sol: |-
          from miniweb import MiniWeb

          app = MiniWeb()


          @app.get("/")
          def home():
              return "<h1>Notes</h1>", 200, {"Cache-Control": "max-age=60"}

      - name: A Counter the Server Keeps
        id: 36
        obj: 'Count every `GET /ping` in a module-level `PINGS`, and have `GET /` show `Pings: 2` inside a `p` with the id `count`.'
        expl: 'This number does not belong to a visitor — it belongs to the *process*. Everyone shares it, and it returns to zero the moment the app restarts, which is the whole difference between memory and a database. It is also why the address bar beside this editor warns you: each path you type there starts your program again, so the count you were watching goes back to nothing.'
        hint: '`global PINGS` inside the handler, or the assignment just makes a new local.'
        max: 20/2
        req:
          - 'GET /ping'
          - 'GET /ping'
          - 'GET /'
        render: 'GET /'
        expect:
          - sel: '#count'
            text: 'Pings: 2'
        start: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          PINGS = 0

          # Two pings arrive, then the page that reports them.
        sol: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          PINGS = 0


          @app.get("/ping")
          def ping():
              global PINGS
              PINGS += 1
              return {"pings": PINGS}


          @app.get("/")
          def home():
              return '<p id="count">Pings: ' + str(PINGS) + "</p>"

      - name: Only What Was Asked For
        id: 37
        obj: 'Have `GET /api/notes` filter `NOTES` by a `q` query parameter, and have the page fetch `/api/notes?q=milk` and draw a `li` per match into `#notes`.'
        expl: 'The query string is part of the URL the *page* builds, which means the browser decides what it is asking for. Filtering on the server rather than fetching everything and filtering in JavaScript is the difference between sending two notes and sending two hundred thousand — and the code is shorter on the server anyway.'
        hint: '`request.args.get("q", "")`, then a list comprehension keeping the notes whose text contains it.'
        max: 32/2
        req:
          - 'GET /'
          - 'GET /api/notes?q=milk'
        render: 'GET /'
        expect:
          - sel: '#notes li'
            count: 1
          - sel: '#notes li'
            text: 'buy milk'
        start: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()

          NOTES = [{"text": "buy milk"}, {"text": "walk the dog"}]

          # Filter on the server, and let the page ask for the filter it wants.
        sol: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()

          NOTES = [{"text": "buy milk"}, {"text": "walk the dog"}]


          @app.get("/api/notes")
          def api_notes():
              q = request.args.get("q", "")
              return [n for n in NOTES if q in n["text"]]


          @app.get("/")
          def home():
              return """
              <ul id="notes"></ul>
              <script>
                fetch("/api/notes?q=milk")
                  .then(r => r.json())
                  .then(notes => {
                    document.querySelector("#notes").innerHTML =
                      notes.map(n => "<li>" + n.text + "</li>").join("");
                  });
              </script>
              """

      - name: Adding One Without a Reload
        id: 38
        obj: 'Serve `POST /api/notes` storing the posted `text` and answering the new note with `201`, and have the page post `buy milk` and append the note it gets back as a `li` inside `#notes`.'
        expl: 'The page changes without ever being fetched again — this is the moment a site stops feeling like a stack of documents. One warning specific to this editor: every response was worked out before the page rendered, so a later `GET` here will not show what this `POST` added. On a real server it would.'
        hint: '`fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: "buy milk" }) })`.'
        max: 38/2
        req:
          - 'GET /'
          - { m: POST, p: /api/notes, json: { text: 'buy milk' } }
        render: 'GET /'
        expect:
          - sel: '#notes li'
            text: 'buy milk'
        start: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()

          NOTES = []

          # Accept the note on the server, and add it to the page in the browser.
        sol: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()

          NOTES = []


          @app.post("/api/notes")
          def create():
              note = {"text": request.json["text"]}
              NOTES.append(note)
              return note, 201


          @app.get("/")
          def home():
              return """
              <ul id="notes"></ul>
              <script>
                fetch("/api/notes", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ text: "buy milk" }),
                })
                  .then(r => r.json())
                  .then(note => {
                    document.querySelector("#notes").innerHTML +=
                      "<li>" + note.text + "</li>";
                  });
              </script>
              """

      - name: When the Server Says No
        id: 39
        obj: 'Have `POST /api/notes` answer `400` with `{"error": "text is required"}` when the posted `text` is empty, and have the page show that message in a `p` with the id `error`.'
        expl: 'Validation is not finished when the server refuses — a refusal nobody sees is a form that silently does nothing. Both halves here are the same rule written twice: the server decides, and the page reports the decision it was handed rather than inventing wording of its own. Send back *why*, and the front end has something honest to say.'
        hint: 'Read `error` out of the JSON body the server sent, and put it on the page.'
        max: 38/2
        req:
          - 'GET /'
          - { m: POST, p: /api/notes, json: { text: '' } }
        render: 'GET /'
        expect:
          - sel: '#error'
            text: 'text is required'
        tests:
          - match: 'POST /api/notes -> 400 Bad Request'
        start: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()

          # Refuse the empty note, and show the reason on the page.
        sol: |-
          from miniweb import MiniWeb, request

          app = MiniWeb()


          @app.post("/api/notes")
          def create():
              text = (request.json or {}).get("text", "")
              if not text:
                  return {"error": "text is required"}, 400
              return {"text": text}, 201


          @app.get("/")
          def home():
              return """
              <p id="error"></p>
              <script>
                fetch("/api/notes", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ text: "" }),
                })
                  .then(r => r.json())
                  .then(body => {
                    if (body.error) {
                      document.querySelector("#error").textContent = body.error;
                    }
                  });
              </script>
              """

      - name: The Whole Thing
        id: 40
        obj: 'Build one app: `GET /healthz` returning `{"ok": True}`, `GET /api/notes` returning `NOTES`, a `404` handler answering `{"error": "not found"}`, and a home page with an `h1` reading `Notes` whose script draws a `li` per note into `#notes`.'
        expl: 'Every piece here you have already written once. What is new is that they are one program — a page, an API that page calls, an answer for the request nobody planned for, and a route that exists only so a machine can ask whether you are still standing. That is a web application, and both ends of it are yours.'
        hint: 'Four routes and one `errorhandler(404)`. Add them one at a time and press Run in between.'
        max: 44/3
        req:
          - 'GET /'
          - 'GET /api/notes'
          - 'GET /nope'
          - 'GET /healthz'
        render: 'GET /'
        expect:
          - sel: h1
            text: Notes
          - sel: '#notes li'
            count: 2
        tests:
          - match: 'GET /nope -> 404 Not Found'
          - match: '\{"error": "not found"\}'
          - match: '\{"ok": true\}'
        start: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          NOTES = [{"text": "buy milk"}, {"text": "walk the dog"}]

          # Four routes, one error handler, and a page that calls your own API.
        sol: |-
          from miniweb import MiniWeb

          app = MiniWeb()

          NOTES = [{"text": "buy milk"}, {"text": "walk the dog"}]


          @app.errorhandler(404)
          def not_found(error):
              return {"error": "not found"}


          @app.get("/healthz")
          def healthz():
              return {"ok": True}


          @app.get("/api/notes")
          def api_notes():
              return NOTES


          @app.get("/")
          def home():
              return """
              <h1>Notes</h1>
              <ul id="notes"></ul>
              <script>
                fetch("/api/notes")
                  .then(r => r.json())
                  .then(notes => {
                    document.querySelector("#notes").innerHTML =
                      notes.map(n => "<li>" + n.text + "</li>").join("");
                  });
              </script>
              """

