        expl: 'This is the whole shape of a signed-in site, in one handler. The same URL, the same code, two different pages — and which one you get is decided by a header you never see. Every "you are logged in" banner on the web is this branch.'
        hint: 'One handler, one `if`: the cookie is either there or it is not.'
        max: 20/2
        req:
          - 'GET /'
          - { m: GET, p: /, hdr: { Cookie: 'name=Ada' } }
        render: 'GET /'
