name: Web Development
slug: web-dev
icon: web
desc: 'Build real pages in the browser: structure with HTML, style with CSS, and bring them to life with JavaScript. Your page renders as you write it.'
difficulty: 1
chapters:
  - name: HTML Foundations
    icon: target
    levels:
      - name: Your First Heading
        obj: 'Add an `h1` heading that reads `Hello, world!`'
        expl: 'HTML marks up text by wrapping it in tags. `<h1>` is the most important heading on a page — the title of what the reader is looking at. A tag comes in a pair: `<h1>` opens it, `</h1>` closes it, and the text goes between.'
        hint: 'Write `<h1>` then your text then `</h1>`, all on one line.'
        max: '3/1'
        web: true
        start: |
          <!-- Write your heading below -->
        sol: |
          <h1>Hello, world!</h1>
        expect:
          - sel: h1
            text: 'Hello, world!'

      - name: Writing a Paragraph
        obj: 'Below an `h1` reading `My Page`, add a `p` paragraph reading `This is my first web page.`'
        expl: '`<p>` marks a paragraph of body text. Browsers put space above and below each one automatically, which is why you should never fake a gap with blank lines — the markup says what the text *is*, and the browser decides how it looks.'
        hint: 'Two lines: an `<h1>` element, then a `<p>` element under it.'
        max: '4/1'
        web: true
        start: |
          <h1>My Page</h1>
        sol: |
          <h1>My Page</h1>
          <p>This is my first web page.</p>
        expect:
          - sel: h1
            text: 'My Page'
          - sel: p
            text: 'This is my first web page.'

      - name: Heading Levels
        obj: 'Add an `h1` reading `Recipes`, then an `h2` reading `Breakfast`, then an `h2` reading `Dinner`.'
        expl: 'Headings run from `<h1>` down to `<h6>` and describe how the page is organised, not how big the text should be. An `<h2>` is a subsection of the `<h1>` above it. Screen readers use exactly this structure to let someone jump around a page.'
        hint: 'One `<h1>` and two `<h2>` elements, in that order.'
        max: '5/1'
        web: true
        start: |
          <!-- Build the outline here -->
        sol: |
          <h1>Recipes</h1>
          <h2>Breakfast</h2>
          <h2>Dinner</h2>
        expect:
          - sel: h1
            text: 'Recipes'
          - sel: h2
            count: 2
          - sel: h2
            text: 'Breakfast'

      - name: Bold and Italic
        obj: 'In a single `p`, write `Warning: this is important.` with the word `Warning` wrapped in `strong` and the word `important` wrapped in `em`.'
        expl: '`<strong>` means the text matters more, and `<em>` means it carries emphasis. Browsers happen to draw them bold and italic, but the tags describe *meaning* — which is why a screen reader can change its tone for them and `<b>` or `<i>` alone would say nothing at all.'
        hint: 'Tags nest: `<p>Warning:` goes outside, and `<strong>` wraps just the one word inside it.'
        max: '3/1'
        web: true
        start: |
          <p>Warning: this is important.</p>
        sol: |
          <p><strong>Warning</strong>: this is <em>important</em>.</p>
        expect:
          - sel: p
            text: 'Warning: this is important.'
          - sel: p strong
            text: 'Warning'
          - sel: p em
            text: 'important'

      - name: An Unordered List
        obj: 'Build a `ul` containing three `li` items: `Apples`, `Bread`, `Milk`.'
        expl: 'A `<ul>` is an unordered list — a set of items where the sequence carries no meaning, like a shopping list. Every item is its own `<li>`, and they all live inside the `<ul>`. The bullets are the browser drawing the list, not characters you type.'
        hint: 'Open `<ul>`, put three `<li>...</li>` lines inside it, then close `</ul>`.'
        max: '7/1'
        web: true
        start: |
          <!-- Build the list here -->
        sol: |
          <ul>
            <li>Apples</li>
            <li>Bread</li>
            <li>Milk</li>
          </ul>
        expect:
          - sel: ul
          - sel: ul li
            count: 3
          - sel: ul li
            text: 'Apples'

      - name: An Ordered List
        obj: 'Build an `ol` containing three `li` steps: `Boil water`, `Add pasta`, `Drain`.'
        expl: 'An `<ol>` is an ordered list: the sequence *is* the information, so the browser numbers it for you. Swap two `<li>` elements and the numbers follow — which is the whole reason not to type `1.` `2.` `3.` yourself.'
        hint: 'Same shape as a `<ul>`, but the outer tag is `<ol>`.'
        max: '7/1'
        web: true
        start: |
          <!-- Build the steps here -->
        sol: |
          <ol>
            <li>Boil water</li>
            <li>Add pasta</li>
            <li>Drain</li>
          </ol>
        expect:
          - sel: ol
          - sel: ol li
            count: 3
          - sel: ol li
            text: 'Boil water'

      - name: Making a Link
        obj: 'Add an `a` element reading `Read the docs` that links to `https://developer.mozilla.org`.'
        expl: 'An `<a>` is an anchor, and its `href` attribute is where it goes. Attributes are extra information written inside the opening tag as `name="value"` — the text between the tags is what the reader sees, the `href` is where the click takes them.'
        hint: '`<a href="...">` — the URL goes in the quotes, the visible text goes between the tags.'
        max: '3/1'
        web: true
        start: |
          <!-- Add your link below -->
        sol: |
          <a href="https://developer.mozilla.org">Read the docs</a>
        expect:
          - sel: a
            text: 'Read the docs'
            attr:
              href: 'https://developer.mozilla.org'

      - name: Adding an Image
        obj: 'Add an `img` whose `src` is `photo.jpg` and whose `alt` is `A red bicycle`.'
        expl: 'An `<img>` has no closing tag and no text between tags — everything it needs lives in its attributes. `alt` is the description read aloud when the image cannot be seen, whether that is a screen reader or a broken link, so it is never optional.'
        hint: '`<img src="..." alt="...">` — two attributes in one tag.'
        max: '3/1'
        web: true
        start: |
          <!-- Add your image below -->
        sol: |
          <img src="photo.jpg" alt="A red bicycle">
        expect:
          - sel: img
            attr:
              src: 'photo.jpg'
              alt: 'A red bicycle'

      - name: Grouping with div
        obj: 'Wrap an `h2` reading `Contact` and a `p` reading `Email us anytime.` together inside a single `div`.'
        expl: 'A `<div>` means nothing on its own — it is a plain box you put around other elements so you can treat them as one unit. That is exactly what you need later when styling a card or a sidebar: something to hang the styling on.'
        hint: 'Open `<div>`, put the heading and paragraph inside, then close `</div>`.'
        max: '6/1'
        web: true
        start: |
          <h2>Contact</h2>
          <p>Email us anytime.</p>
        sol: |
          <div>
            <h2>Contact</h2>
            <p>Email us anytime.</p>
          </div>
        expect:
          - sel: div
          - sel: div h2
            text: 'Contact'
          - sel: div p
            text: 'Email us anytime.'

      - name: Your First Page
        obj: 'Build a page with an `h1` reading `Tide Pool`, a `p` reading `Notes from the shore.`, an `h2` reading `Finds`, and a `ul` of three `li`: `Anemone`, `Limpet`, `Hermit crab`.'
        expl: 'Nothing here is new — it is the first nine levels used together. That is what a page is: a heading to say what it is, text to explain it, and sections beneath. Read your markup top to bottom and it should read like an outline of the page.'
        hint: 'Work down the objective in order. The `<ul>` goes last, under the `<h2>`.'
        max: '12/1'
        web: true
        start: |
          <!-- Build the whole page here -->
        sol: |
          <h1>Tide Pool</h1>
          <p>Notes from the shore.</p>
          <h2>Finds</h2>
          <ul>
            <li>Anemone</li>
            <li>Limpet</li>
            <li>Hermit crab</li>
          </ul>
        expect:
          - sel: h1
            text: 'Tide Pool'
          - sel: p
            text: 'Notes from the shore.'
          - sel: h2
            text: 'Finds'
          - sel: ul li
            count: 3
          - sel: ul li
            text: 'Anemone'

  - name: Styling with CSS
    icon: style
    levels:
      - name: Your First Style Rule
        obj: 'Inside the `style` block, colour the `h1` with `color: #008080`.'
        expl: 'HTML says what a thing *is*; CSS says how it should look. A rule has three parts: a **selector** naming what to style, then a **property** and a **value** inside braces. `h1 { color: #008080; }` reads "every h1 gets this colour". The rules live in a `<style>` block.'
        hint: 'The selector is `h1`. Put `color: #008080;` between its braces.'
        max: '5/1'
        web: true
        start: |
          <style>
            /* Write your rule here */
          </style>
          <h1>Sunset Beach</h1>
        sol: |
          <style>
            h1 { color: #008080; }
          </style>
          <h1>Sunset Beach</h1>
        expect:
          - sel: h1
            text: 'Sunset Beach'
          - sel: h1
            style:
              color: '#008080'

      - name: Page Background
        obj: 'Give the `body` a `background-color` of `#f4f1e8`, leaving the heading rule alone.'
        expl: '`body` selects the whole page, so styling it paints everything behind your content. Note that the second rule sits alongside the first rather than replacing it — a stylesheet is a list, and every rule that matches an element applies to it.'
        hint: 'Add a `body { ... }` rule above the `h1` one.'
        max: '6/1'
        web: true
        start: |
          <style>
            h1 { color: #2f3e46; }
          </style>
          <h1>Field Notes</h1>
        sol: |
          <style>
            body { background-color: #f4f1e8; }
            h1 { color: #2f3e46; }
          </style>
          <h1>Field Notes</h1>
        expect:
          - sel: body
            style:
              background-color: '#f4f1e8'
          - sel: h1
            text: 'Field Notes'

      - name: Text Size
        obj: 'Add `font-size: 20px` to the paragraph rule, keeping its colour.'
        expl: 'Several properties can share one rule — write them one after another, each ending in a semicolon. `px` means pixels, an absolute size. It is the easiest unit to start with, though real sites often prefer units that scale with the reader''s own settings.'
        hint: 'Add a second declaration inside the braces the `p` rule already has.'
        max: '5/1'
        web: true
        start: |
          <style>
            p { color: #444444; }
          </style>
          <p>Read me at a comfortable size.</p>
        sol: |
          <style>
            p { color: #444444; font-size: 20px; }
          </style>
          <p>Read me at a comfortable size.</p>
        expect:
          - sel: p
            text: 'Read me at a comfortable size.'
          - sel: p
            style:
              color: '#444444'
              font-size: '20px'

      - name: Centred Text
        obj: 'Centre the `h1` with `text-align: center`.'
        expl: '`text-align` positions text inside the space its element already occupies. A heading is a block, so it spans the full width of the page and centring the text centres it on screen. Note the American spelling — CSS uses `center`, always.'
        hint: 'One more declaration: `text-align: center;`.'
        max: '5/1'
        web: true
        start: |
          <style>
            h1 { color: #000080; }
          </style>
          <h1>Grand Opening</h1>
        sol: |
          <style>
            h1 { color: #000080; text-align: center; }
          </style>
          <h1>Grand Opening</h1>
        expect:
          - sel: h1
            text: 'Grand Opening'
          - sel: h1
            style:
              text-align: 'center'

      - name: Selecting by Class
        obj: 'Give the third paragraph `class="note"`, and write a `.note` rule setting `color: #800080`.'
        expl: 'Styling every `p` on the page is usually too broad. A **class** is a label you attach to the elements you mean, and the selector `.note` — a dot, then the name — matches only those. Any number of elements can share a class, which is exactly the point of it.'
        hint: 'The attribute goes in the tag: `<p class="note">`. The selector starts with a dot.'
        max: '7/1'
        web: true
        start: |
          <style>
            /* Style the note here */
          </style>
          <p>Ordinary paragraph.</p>
          <p>Another ordinary paragraph.</p>
          <p>This one is a note.</p>
        sol: |
          <style>
            .note { color: #800080; }
          </style>
          <p>Ordinary paragraph.</p>
          <p>Another ordinary paragraph.</p>
          <p class="note">This one is a note.</p>
        expect:
          - sel: p
            count: 3
          - sel: p.note
            text: 'This one is a note.'
          - sel: p.note
            style:
              color: '#800080'

      - name: Selecting by Id
        obj: 'Give the heading `id="title"`, and write a `#title` rule setting `font-size: 40px`.'
        expl: 'An **id** names one specific element, and its selector starts with `#`. The difference from a class is a promise rather than a mechanism: a class may repeat, an id must be unique on the page. Reach for a class by default and an id only when the element really is one of a kind.'
        hint: '`<h1 id="title">`, then a `#title { ... }` rule.'
        max: '6/1'
        web: true
        start: |
          <style>
            /* Style the title here */
          </style>
          <h1>Almanac</h1>
          <p>Everything worth knowing about the weather.</p>
        sol: |
          <style>
            #title { font-size: 40px; }
          </style>
          <h1 id="title">Almanac</h1>
          <p>Everything worth knowing about the weather.</p>
        expect:
          - sel: 'h1#title'
            text: 'Almanac'
          - sel: '#title'
            style:
              font-size: '40px'

      - name: Space Inside a Box
        obj: 'Add `padding: 24px` to the `.card` rule.'
        expl: '**Padding** is space between an element''s edge and its own content — it pushes the edge outward, so the background colour fills it too. Text running right up against the side of its box is the single most common reason a page looks unfinished.'
        hint: 'One more declaration inside the braces `.card` already has.'
        max: '6/1'
        web: true
        start: |
          <style>
            .card { background-color: #e8eef4; }
          </style>
          <div class="card">
            <p>Cramped against the edge.</p>
          </div>
        sol: |
          <style>
            .card { background-color: #e8eef4; padding: 24px; }
          </style>
          <div class="card">
            <p>Cramped against the edge.</p>
          </div>
        expect:
          - sel: 'div.card p'
            text: 'Cramped against the edge.'
          - sel: '.card'
            style:
              padding-top: '24px'
              padding-left: '24px'

      - name: Space Between Boxes
        obj: 'Add `margin-bottom: 16px` to the `.row` rule so the three boxes stop touching.'
        expl: '**Margin** is space *outside* an element, between it and its neighbours. That is the whole distinction from padding: padding grows the box, margin pushes other boxes away. Use `margin-bottom` when you want the gap on one side only.'
        hint: 'The property name says which side: `margin-bottom`.'
        max: '8/1'
        web: true
        start: |
          <style>
            .row { background-color: #dde5db; padding: 8px; }
          </style>
          <div class="row">First</div>
          <div class="row">Second</div>
          <div class="row">Third</div>
        sol: |
          <style>
            .row { background-color: #dde5db; padding: 8px; margin-bottom: 16px; }
          </style>
          <div class="row">First</div>
          <div class="row">Second</div>
          <div class="row">Third</div>
        expect:
          - sel: '.row'
            count: 3
          - sel: '.row'
            style:
              margin-bottom: '16px'
              padding-top: '8px'

      - name: Borders and Corners
        obj: 'Add `border: 2px solid #000080` and `border-radius: 12px` to the `.panel` rule.'
        expl: 'A border is three things at once — width, style, and colour — so CSS lets you write all three in one declaration, in that order. `border-radius` then rounds the corners; it is most of the difference between a box that looks like a form field and one that looks like a card.'
        hint: '`border: 2px solid #000080;` and `border-radius: 12px;` — two declarations.'
        max: '6/1'
        web: true
        start: |
          <style>
            .panel { padding: 16px; }
          </style>
          <div class="panel">
            <p>A panel with nothing around it.</p>
          </div>
        sol: |
          <style>
            .panel { padding: 16px; border: 2px solid #000080; border-radius: 12px; }
          </style>
          <div class="panel">
            <p>A panel with nothing around it.</p>
          </div>
        expect:
          - sel: '.panel p'
            text: 'A panel with nothing around it.'
          - sel: '.panel'
            style:
              border-style: 'solid'
              border-color: '#000080'
              border-radius: '12px'

      - name: A Styled Card
        obj: 'Build a `div` with `class="card"` holding an `h2` reading `Tide Pool` and a `p` reading `Notes from the shore.`, then style `.card` with `background-color: #f4f1e8`, `padding: 20px`, `border-radius: 8px`, and centred text.'
        expl: 'Everything in this chapter at once, and this is most of what page styling actually is: a box, a colour, some breathing room, a rounded corner. Write the markup first and the rule second — decide what the thing *is*, then decide how it looks.'
        hint: 'One `.card` rule with four declarations, wrapped around markup like the last chapter''s.'
        max: '12/1'
        web: true
        start: |
          <style>
            /* Style the card here */
          </style>
          <!-- Build the card here -->
        sol: |
          <style>
            .card {
              background-color: #f4f1e8;
              padding: 20px;
              border-radius: 8px;
              text-align: center;
            }
          </style>
          <div class="card">
            <h2>Tide Pool</h2>
            <p>Notes from the shore.</p>
          </div>
        expect:
          - sel: 'div.card h2'
            text: 'Tide Pool'
          - sel: 'div.card p'
            text: 'Notes from the shore.'
          - sel: '.card'
            style:
              background-color: '#f4f1e8'
              padding-top: '20px'
              border-radius: '8px'
              text-align: 'center'

  - name: Structure and Layout
    icon: layout
    levels:
      - name: A Page Header
        obj: 'Wrap the `h1` in a `header` element.'
        expl: 'HTML has elements that say what a region of a page *is*, not merely that it is a group. `<header>` marks the top of a page or a section — the same box a `div` gives you, plus the meaning. A screen reader can announce it and jump to it; a `div` tells it nothing at all.'
        hint: 'A `header` opening tag above the heading and a closing one below it.'
        max: '3/1'
        web: true
        start: |
          <h1>Trail Guide</h1>
        sol: |
          <header>
            <h1>Trail Guide</h1>
          </header>
        expect:
          - sel: 'header h1'
            text: 'Trail Guide'
            msg: 'The `h1` should be inside a `header` element.'

      - name: Main and Footer
        obj: 'Wrap the paragraph in a `main`, then add a `footer` after it reading `Updated every spring.`'
        expl: '`<main>` is the page''s primary content — the part that is not navigation, header or boilerplate — and a page should have exactly one. `<footer>` closes it off. Between them these three landmarks are how someone browsing by keyboard skips straight to what they came for.'
        hint: 'The `header` is not part of `main`; leave it where it is.'
        max: '8/1'
        web: true
        start: |
          <header>
            <h1>Trail Guide</h1>
          </header>
          <p>Twelve walks within an hour of town.</p>
        sol: |
          <header>
            <h1>Trail Guide</h1>
          </header>
          <main>
            <p>Twelve walks within an hour of town.</p>
          </main>
          <footer>Updated every spring.</footer>
        expect:
          - sel: 'main p'
            text: 'Twelve walks within an hour of town.'
            msg: 'The paragraph should be inside a `main` element.'
          - sel: 'footer'
            text: 'Updated every spring.'

      - name: A Navigation Bar
        obj: 'Inside the `nav`, add a `ul` with three `li` items, each holding a link: `Trails` to `#trails`, `Gear` to `#gear`, and `About` to `#about`.'
        expl: 'A nav bar *is* a list of links — that is not an analogy, it is the markup. `<nav>` marks the region, a `ul` holds the items because they are an unordered set, and each `li` holds one `a`. Build it out of bare links instead and a screen reader can no longer say how many there are.'
        hint: 'One `li` per link, and the `a` goes inside the `li`.'
        max: '7/1'
        web: true
        start: |
          <nav>
            <!-- Add the list of links here -->
          </nav>
        sol: |
          <nav>
            <ul>
              <li><a href="#trails">Trails</a></li>
              <li><a href="#gear">Gear</a></li>
              <li><a href="#about">About</a></li>
            </ul>
          </nav>
        expect:
          - sel: 'nav ul li'
            count: 3
          - sel: 'nav li a'
            text: 'Trails'
            attr:
              href: '#trails'
          - sel: 'nav li:nth-child(2) a'
            text: 'Gear'
          - sel: 'nav li:nth-child(3) a'
            text: 'About'
            attr:
              href: '#about'

      - name: Descendant Selectors
        obj: 'Add a rule for `header h1` setting `color: #2f3e46`, without touching the `h1` rule already there.'
        expl: 'Two selectors separated by a space mean "the second one, but only inside the first". `header h1` matches an `h1` anywhere within a `header` and nowhere else. That is how you restyle one region of a page without having to invent a class for everything in it.'
        hint: 'A space between the two names, not a comma — a comma would mean something else entirely.'
        max: '10/1'
        web: true
        start: |
          <style>
            h1 { color: #444444; }
            /* Style only the header's heading */
          </style>
          <header>
            <h1>Trail Guide</h1>
          </header>
          <main>
            <h1>Latest Walk</h1>
          </main>
        sol: |
          <style>
            h1 { color: #444444; }
            header h1 { color: #2f3e46; }
          </style>
          <header>
            <h1>Trail Guide</h1>
          </header>
          <main>
            <h1>Latest Walk</h1>
          </main>
        expect:
          - sel: 'header h1'
            style:
              color: '#2f3e46'
          # The other heading has to keep its original colour: editing the plain
          # `h1` rule instead of adding a new one would recolour both, and this
          # is the only check that can tell the two apart.
          - sel: 'main h1'
            style:
              color: '#444444'
            msg: 'The heading in `main` should still be `#444444` — add a new rule rather than changing the `h1` one.'

      - name: Grouping Selectors
        obj: 'Give both headings `font-family: monospace` using a single rule with the selector `h1, h2`.'
        expl: 'A comma in a selector means "or". `h1, h2 { ... }` applies its declarations to both, and is exactly equivalent to writing the rule out twice — it simply spares you writing it twice. Notice that what repeats is the *selector*; the declarations are shared.'
        hint: 'Both names, a comma between them, then one set of braces.'
        max: '5/1'
        web: true
        start: |
          <style>
            /* One rule for both headings */
          </style>
          <h1>Trail Guide</h1>
          <h2>Latest Walk</h2>
        sol: |
          <style>
            h1, h2 { font-family: monospace; }
          </style>
          <h1>Trail Guide</h1>
          <h2>Latest Walk</h2>
        expect:
          - sel: 'h1'
            style:
              font-family: 'monospace'
          - sel: 'h2'
            style:
              font-family: 'monospace'

      - name: Centring the Page
        obj: 'Add `max-width: 600px` and `margin: 0 auto` to the `.page` rule.'
        expl: 'A line of text running the full width of a wide screen is genuinely hard to read — the eye loses its place on the way back. `max-width` caps how wide the box may get while letting it stay narrower on a phone, so it is a limit rather than a width. `margin: 0 auto` then splits whatever space is left over equally between the two sides, and that is what actually centres it.'
        hint: '`auto` on the left and right margins is the part that does the centring.'
        max: '7/1'
        web: true
        start: |
          <style>
            .page { padding: 20px; }
          </style>
          <div class="page">
            <h1>Trail Guide</h1>
            <p>Twelve walks within an hour of town.</p>
          </div>
        sol: |
          <style>
            .page { max-width: 600px; margin: 0 auto; padding: 20px; }
          </style>
          <div class="page">
            <h1>Trail Guide</h1>
            <p>Twelve walks within an hour of town.</p>
          </div>
        expect:
          # `margin` is taught here but deliberately not asserted: a browser
          # reports the *used* margin, so `auto` comes back as whatever number of
          # pixels the window happened to leave. See UNGRADABLE_STYLE_PROPS.
          - sel: '.page'
            style:
              max-width: '600px'
              padding-top: '20px'
          - sel: '.page h1'
            text: 'Trail Guide'

      - name: A Row with Flex
        obj: 'Add `display: flex` to the `.row` rule so the three boxes sit side by side.'
        expl: 'A `div` is a block by default, and blocks stack vertically. `display: flex` changes how an element arranges its *children*: they line up in a row instead. Note where it goes — on the container, never on the items. Putting it on the boxes themselves is the first mistake nearly everyone makes.'
        hint: 'The rule you want is `.row`, not `.box`.'
        max: '10/1'
        web: true
        start: |
          <style>
            .row { background-color: #dde5db; }
            .box { padding: 12px; background-color: #e8eef4; }
          </style>
          <div class="row">
            <div class="box">One</div>
            <div class="box">Two</div>
            <div class="box">Three</div>
          </div>
        sol: |
          <style>
            .row { background-color: #dde5db; display: flex; }
            .box { padding: 12px; background-color: #e8eef4; }
          </style>
          <div class="row">
            <div class="box">One</div>
            <div class="box">Two</div>
            <div class="box">Three</div>
          </div>
        expect:
          - sel: '.box'
            count: 3
          - sel: '.row'
            style:
              display: 'flex'

      - name: Spreading Items Out
        obj: 'Add `gap: 12px` and `justify-content: space-between` to the `.row` rule.'
        expl: '`gap` puts space *between* flex children without giving the first one a margin it should not have — that alone is why it replaced a decade of margin tricks. `justify-content` then decides who gets the space left over along the row: `space-between` pins the first item to the left edge and the last to the right, spreading the rest evenly. It is exactly how a nav bar puts a name on one side and links on the other.'
        hint: 'Both go on `.row`, the flex container — never on the items.'
        max: '10/1'
        web: true
        start: |
          <style>
            .row { display: flex; background-color: #dde5db; }
            .box { padding: 12px; background-color: #e8eef4; }
          </style>
          <div class="row">
            <div class="box">One</div>
            <div class="box">Two</div>
            <div class="box">Three</div>
          </div>
        sol: |
          <style>
            .row { display: flex; gap: 12px; justify-content: space-between; background-color: #dde5db; }
            .box { padding: 12px; background-color: #e8eef4; }
          </style>
          <div class="row">
            <div class="box">One</div>
            <div class="box">Two</div>
            <div class="box">Three</div>
          </div>
        expect:
          - sel: '.box'
            count: 3
          - sel: '.row'
            style:
              display: 'flex'
              gap: '12px'
              justify-content: 'space-between'

      - name: Losing the Bullets
        obj: 'Add `list-style-type: none` to the `.menu` rule, and `text-decoration: none` to the `.menu a` rule.'
        expl: 'A nav bar is still a list of links, so it should still be a `ul` full of `a` elements — you just do not want it to *look* like one. Dropping the bullets and the underline is most of the difference between markup that reads as a document and markup that reads as a menu, and it costs you none of the structure underneath.'
        hint: 'The bullets belong to the `ul`; the underline belongs to the links.'
        max: '11/1'
        web: true
        start: |
          <style>
            .menu { display: flex; gap: 16px; }
            .menu a { color: #000080; }
          </style>
          <nav>
            <ul class="menu">
              <li><a href="#trails">Trails</a></li>
              <li><a href="#gear">Gear</a></li>
            </ul>
          </nav>
        sol: |
          <style>
            .menu { display: flex; gap: 16px; list-style-type: none; }
            .menu a { color: #000080; text-decoration: none; }
          </style>
          <nav>
            <ul class="menu">
              <li><a href="#trails">Trails</a></li>
              <li><a href="#gear">Gear</a></li>
            </ul>
          </nav>
        expect:
          - sel: '.menu li'
            count: 2
          - sel: '.menu'
            style:
              list-style-type: 'none'
          # Asserted on the longhand because the `text-decoration` shorthand
          # reads back expanded in a browser; `msg` keeps the wording in the
          # student's terms rather than the engine's.
          - sel: '.menu a'
            style:
              text-decoration-line: 'none'
            msg: 'The links still have their underline — the `.menu a` rule needs `text-decoration: none`.'

      - name: A Complete Layout
        obj: 'Build a `div` with `class="page"` holding a `header` and a `main`. The `header` has an `h1` reading `Trail Guide` and a `nav`, whose `ul` has `class="menu"` and two links: `Trails` to `#trails` and `Gear` to `#gear`. The `main` holds a `p` reading `Twelve walks within an hour of town.` Style `.page` with `max-width: 600px` and `margin: 0 auto`, and `.menu` with `display: flex`, `gap: 16px` and `list-style-type: none`.'
        expl: 'The whole chapter at once, and close to the skeleton every site you have ever used is built on: a centred column, a header with a nav across the top, the content below. Write the markup first and the two rules after — decide what the page *is*, then decide how it sits.'
        hint: 'Build it outside in: the `.page` div, then `header` and `main` inside it, then the nav''s list inside the header.'
        max: '18/1'
        web: true
        start: |
          <style>
            /* Style the page and the menu here */
          </style>
          <!-- Build the page here -->
        sol: |
          <style>
            .page { max-width: 600px; margin: 0 auto; }
            .menu { display: flex; gap: 16px; list-style-type: none; }
          </style>
          <div class="page">
            <header>
              <h1>Trail Guide</h1>
              <nav>
                <ul class="menu">
                  <li><a href="#trails">Trails</a></li>
                  <li><a href="#gear">Gear</a></li>
                </ul>
              </nav>
            </header>
            <main>
              <p>Twelve walks within an hour of town.</p>
            </main>
          </div>
        expect:
          - sel: '.page header h1'
            text: 'Trail Guide'
          - sel: '.page header nav ul.menu li a'
            count: 2
          - sel: '.menu li a'
            text: 'Trails'
            attr:
              href: '#trails'
          - sel: '.menu li:nth-child(2) a'
            text: 'Gear'
            attr:
              href: '#gear'
          - sel: '.page main p'
            text: 'Twelve walks within an hour of town.'
          - sel: '.page'
            style:
              max-width: '600px'
          - sel: '.menu'
            style:
              display: 'flex'
              gap: '16px'
              list-style-type: 'none'
