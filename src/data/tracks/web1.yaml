name: Web Development
slug: web-dev
icon: web
desc: 'Build real pages in the browser: structure with HTML, style with CSS, and bring them to life with JavaScript. Your page renders as you write it.'
difficulty: 1
chapters:
  - name: HTML Foundations
    icon: target
    levels:
      - name: Your First Heading
        obj: 'Add an `h1` heading that reads `Hello, world!`'
        expl: 'HTML marks up text by wrapping it in tags. `<h1>` is the most important heading on a page — the title of what the reader is looking at. A tag comes in a pair: `<h1>` opens it, `</h1>` closes it, and the text goes between.'
        hint: 'Write `<h1>` then your text then `</h1>`, all on one line.'
        max: '3/1'
        web: true
        start: |
          <!-- Write your heading below -->
        sol: |
          <h1>Hello, world!</h1>
        expect:
          - sel: h1
            text: 'Hello, world!'

      - name: Writing a Paragraph
        obj: 'Below an `h1` reading `My Page`, add a `p` paragraph reading `This is my first web page.`'
        expl: '`<p>` marks a paragraph of body text. Browsers put space above and below each one automatically, which is why you should never fake a gap with blank lines — the markup says what the text *is*, and the browser decides how it looks.'
        hint: 'Two lines: an `<h1>` element, then a `<p>` element under it.'
        max: '4/1'
        web: true
        start: |
          <h1>My Page</h1>
        sol: |
          <h1>My Page</h1>
          <p>This is my first web page.</p>
        expect:
          - sel: h1
            text: 'My Page'
          - sel: p
            text: 'This is my first web page.'

      - name: Heading Levels
        obj: 'Add an `h1` reading `Recipes`, then an `h2` reading `Breakfast`, then an `h2` reading `Dinner`.'
        expl: 'Headings run from `<h1>` down to `<h6>` and describe how the page is organised, not how big the text should be. An `<h2>` is a subsection of the `<h1>` above it. Screen readers use exactly this structure to let someone jump around a page.'
        hint: 'One `<h1>` and two `<h2>` elements, in that order.'
        max: '5/1'
        web: true
        start: |
          <!-- Build the outline here -->
        sol: |
          <h1>Recipes</h1>
          <h2>Breakfast</h2>
          <h2>Dinner</h2>
        expect:
          - sel: h1
            text: 'Recipes'
          - sel: h2
            count: 2
          - sel: h2
            text: 'Breakfast'

      - name: Bold and Italic
        obj: 'In a single `p`, write `Warning: this is important.` with the word `Warning` wrapped in `strong` and the word `important` wrapped in `em`.'
        expl: '`<strong>` means the text matters more, and `<em>` means it carries emphasis. Browsers happen to draw them bold and italic, but the tags describe *meaning* — which is why a screen reader can change its tone for them and `<b>` or `<i>` alone would say nothing at all.'
        hint: 'Tags nest: `<p>Warning:` goes outside, and `<strong>` wraps just the one word inside it.'
        max: '3/1'
        web: true
        start: |
          <p>Warning: this is important.</p>
        sol: |
          <p><strong>Warning</strong>: this is <em>important</em>.</p>
        expect:
          - sel: p
            text: 'Warning: this is important.'
          - sel: p strong
            text: 'Warning'
          - sel: p em
            text: 'important'

      - name: An Unordered List
        obj: 'Build a `ul` containing three `li` items: `Apples`, `Bread`, `Milk`.'
        expl: 'A `<ul>` is an unordered list — a set of items where the sequence carries no meaning, like a shopping list. Every item is its own `<li>`, and they all live inside the `<ul>`. The bullets are the browser drawing the list, not characters you type.'
        hint: 'Open `<ul>`, put three `<li>...</li>` lines inside it, then close `</ul>`.'
        max: '7/1'
        web: true
        start: |
          <!-- Build the list here -->
        sol: |
          <ul>
            <li>Apples</li>
            <li>Bread</li>
            <li>Milk</li>
          </ul>
        expect:
          - sel: ul
          - sel: ul li
            count: 3
          - sel: ul li
            text: 'Apples'

      - name: An Ordered List
        obj: 'Build an `ol` containing three `li` steps: `Boil water`, `Add pasta`, `Drain`.'
        expl: 'An `<ol>` is an ordered list: the sequence *is* the information, so the browser numbers it for you. Swap two `<li>` elements and the numbers follow — which is the whole reason not to type `1.` `2.` `3.` yourself.'
        hint: 'Same shape as a `<ul>`, but the outer tag is `<ol>`.'
        max: '7/1'
        web: true
        start: |
          <!-- Build the steps here -->
        sol: |
          <ol>
            <li>Boil water</li>
            <li>Add pasta</li>
            <li>Drain</li>
          </ol>
        expect:
          - sel: ol
          - sel: ol li
            count: 3
          - sel: ol li
            text: 'Boil water'

      - name: Making a Link
        obj: 'Add an `a` element reading `Read the docs` that links to `https://developer.mozilla.org`.'
        expl: 'An `<a>` is an anchor, and its `href` attribute is where it goes. Attributes are extra information written inside the opening tag as `name="value"` — the text between the tags is what the reader sees, the `href` is where the click takes them.'
        hint: '`<a href="...">` — the URL goes in the quotes, the visible text goes between the tags.'
        max: '3/1'
        web: true
        start: |
          <!-- Add your link below -->
        sol: |
          <a href="https://developer.mozilla.org">Read the docs</a>
        expect:
          - sel: a
            text: 'Read the docs'
            attr:
              href: 'https://developer.mozilla.org'

      - name: Adding an Image
        obj: 'Add an `img` whose `src` is `photo.jpg` and whose `alt` is `A red bicycle`.'
        expl: 'An `<img>` has no closing tag and no text between tags — everything it needs lives in its attributes. `alt` is the description read aloud when the image cannot be seen, whether that is a screen reader or a broken link, so it is never optional.'
        hint: '`<img src="..." alt="...">` — two attributes in one tag.'
        max: '3/1'
        web: true
        start: |
          <!-- Add your image below -->
        sol: |
          <img src="photo.jpg" alt="A red bicycle">
        expect:
          - sel: img
            attr:
              src: 'photo.jpg'
              alt: 'A red bicycle'

      - name: Grouping with div
        obj: 'Wrap an `h2` reading `Contact` and a `p` reading `Email us anytime.` together inside a single `div`.'
        expl: 'A `<div>` means nothing on its own — it is a plain box you put around other elements so you can treat them as one unit. That is exactly what you need later when styling a card or a sidebar: something to hang the styling on.'
        hint: 'Open `<div>`, put the heading and paragraph inside, then close `</div>`.'
        max: '6/1'
        web: true
        start: |
          <h2>Contact</h2>
          <p>Email us anytime.</p>
        sol: |
          <div>
            <h2>Contact</h2>
            <p>Email us anytime.</p>
          </div>
        expect:
          - sel: div
          - sel: div h2
            text: 'Contact'
          - sel: div p
            text: 'Email us anytime.'

      - name: Your First Page
        obj: 'Build a page with an `h1` reading `Tide Pool`, a `p` reading `Notes from the shore.`, an `h2` reading `Finds`, and a `ul` of three `li`: `Anemone`, `Limpet`, `Hermit crab`.'
        expl: 'Nothing here is new — it is the first nine levels used together. That is what a page is: a heading to say what it is, text to explain it, and sections beneath. Read your markup top to bottom and it should read like an outline of the page.'
        hint: 'Work down the objective in order. The `<ul>` goes last, under the `<h2>`.'
        max: '12/1'
        web: true
        start: |
          <!-- Build the whole page here -->
        sol: |
          <h1>Tide Pool</h1>
          <p>Notes from the shore.</p>
          <h2>Finds</h2>
          <ul>
            <li>Anemone</li>
            <li>Limpet</li>
            <li>Hermit crab</li>
          </ul>
        expect:
          - sel: h1
            text: 'Tide Pool'
          - sel: p
            text: 'Notes from the shore.'
          - sel: h2
            text: 'Finds'
          - sel: ul li
            count: 3
          - sel: ul li
            text: 'Anemone'

  - name: Styling with CSS
    icon: style
    levels:
      - name: Your First Style Rule
        obj: 'Inside the `style` block, colour the `h1` with `color: #008080`.'
        expl: 'HTML says what a thing *is*; CSS says how it should look. A rule has three parts: a **selector** naming what to style, then a **property** and a **value** inside braces. `h1 { color: #008080; }` reads "every h1 gets this colour". The rules live in a `<style>` block.'
        hint: 'The selector is `h1`. Put `color: #008080;` between its braces.'
        max: '5/1'
        web: true
        start: |
          <style>
            /* Write your rule here */
          </style>
          <h1>Sunset Beach</h1>
        sol: |
          <style>
            h1 { color: #008080; }
          </style>
          <h1>Sunset Beach</h1>
        expect:
          - sel: h1
            text: 'Sunset Beach'
          - sel: h1
            style:
              color: '#008080'

      - name: Page Background
        obj: 'Give the `body` a `background-color` of `#f4f1e8`, leaving the heading rule alone.'
        expl: '`body` selects the whole page, so styling it paints everything behind your content. Note that the second rule sits alongside the first rather than replacing it — a stylesheet is a list, and every rule that matches an element applies to it.'
        hint: 'Add a `body { ... }` rule above the `h1` one.'
        max: '6/1'
        web: true
        start: |
          <style>
            h1 { color: #2f3e46; }
          </style>
          <h1>Field Notes</h1>
        sol: |
          <style>
            body { background-color: #f4f1e8; }
            h1 { color: #2f3e46; }
          </style>
          <h1>Field Notes</h1>
        expect:
          - sel: body
            style:
              background-color: '#f4f1e8'
          - sel: h1
            text: 'Field Notes'

      - name: Text Size
        obj: 'Add `font-size: 20px` to the paragraph rule, keeping its colour.'
        expl: 'Several properties can share one rule — write them one after another, each ending in a semicolon. `px` means pixels, an absolute size. It is the easiest unit to start with, though real sites often prefer units that scale with the reader''s own settings.'
        hint: 'Add a second declaration inside the braces the `p` rule already has.'
        max: '5/1'
        web: true
        start: |
          <style>
            p { color: #444444; }
          </style>
          <p>Read me at a comfortable size.</p>
        sol: |
          <style>
            p { color: #444444; font-size: 20px; }
          </style>
          <p>Read me at a comfortable size.</p>
        expect:
          - sel: p
            text: 'Read me at a comfortable size.'
          - sel: p
            style:
              color: '#444444'
              font-size: '20px'

      - name: Centred Text
        obj: 'Centre the `h1` with `text-align: center`.'
        expl: '`text-align` positions text inside the space its element already occupies. A heading is a block, so it spans the full width of the page and centring the text centres it on screen. Note the American spelling — CSS uses `center`, always.'
        hint: 'One more declaration: `text-align: center;`.'
        max: '5/1'
        web: true
        start: |
          <style>
            h1 { color: #000080; }
          </style>
          <h1>Grand Opening</h1>
        sol: |
          <style>
            h1 { color: #000080; text-align: center; }
          </style>
          <h1>Grand Opening</h1>
        expect:
          - sel: h1
            text: 'Grand Opening'
          - sel: h1
            style:
              text-align: 'center'

      - name: Selecting by Class
        obj: 'Give the third paragraph `class="note"`, and write a `.note` rule setting `color: #800080`.'
        expl: 'Styling every `p` on the page is usually too broad. A **class** is a label you attach to the elements you mean, and the selector `.note` — a dot, then the name — matches only those. Any number of elements can share a class, which is exactly the point of it.'
        hint: 'The attribute goes in the tag: `<p class="note">`. The selector starts with a dot.'
        max: '7/1'
        web: true
        start: |
          <style>
            /* Style the note here */
          </style>
          <p>Ordinary paragraph.</p>
          <p>Another ordinary paragraph.</p>
          <p>This one is a note.</p>
        sol: |
          <style>
            .note { color: #800080; }
          </style>
          <p>Ordinary paragraph.</p>
          <p>Another ordinary paragraph.</p>
          <p class="note">This one is a note.</p>
        expect:
          - sel: p
            count: 3
          - sel: p.note
            text: 'This one is a note.'
          - sel: p.note
            style:
              color: '#800080'

      - name: Selecting by Id
        obj: 'Give the heading `id="title"`, and write a `#title` rule setting `font-size: 40px`.'
        expl: 'An **id** names one specific element, and its selector starts with `#`. The difference from a class is a promise rather than a mechanism: a class may repeat, an id must be unique on the page. Reach for a class by default and an id only when the element really is one of a kind.'
        hint: '`<h1 id="title">`, then a `#title { ... }` rule.'
        max: '6/1'
        web: true
        start: |
          <style>
            /* Style the title here */
          </style>
          <h1>Almanac</h1>
          <p>Everything worth knowing about the weather.</p>
        sol: |
          <style>
            #title { font-size: 40px; }
          </style>
          <h1 id="title">Almanac</h1>
          <p>Everything worth knowing about the weather.</p>
        expect:
          - sel: 'h1#title'
            text: 'Almanac'
          - sel: '#title'
            style:
              font-size: '40px'

      - name: Space Inside a Box
        obj: 'Add `padding: 24px` to the `.card` rule.'
        expl: '**Padding** is space between an element''s edge and its own content — it pushes the edge outward, so the background colour fills it too. Text running right up against the side of its box is the single most common reason a page looks unfinished.'
        hint: 'One more declaration inside the braces `.card` already has.'
        max: '6/1'
        web: true
        start: |
          <style>
            .card { background-color: #e8eef4; }
          </style>
          <div class="card">
            <p>Cramped against the edge.</p>
          </div>
        sol: |
          <style>
            .card { background-color: #e8eef4; padding: 24px; }
          </style>
          <div class="card">
            <p>Cramped against the edge.</p>
          </div>
        expect:
          - sel: 'div.card p'
            text: 'Cramped against the edge.'
          - sel: '.card'
            style:
              padding-top: '24px'
              padding-left: '24px'

      - name: Space Between Boxes
        obj: 'Add `margin-bottom: 16px` to the `.row` rule so the three boxes stop touching.'
        expl: '**Margin** is space *outside* an element, between it and its neighbours. That is the whole distinction from padding: padding grows the box, margin pushes other boxes away. Use `margin-bottom` when you want the gap on one side only.'
        hint: 'The property name says which side: `margin-bottom`.'
        max: '8/1'
        web: true
        start: |
          <style>
            .row { background-color: #dde5db; padding: 8px; }
          </style>
          <div class="row">First</div>
          <div class="row">Second</div>
          <div class="row">Third</div>
        sol: |
          <style>
            .row { background-color: #dde5db; padding: 8px; margin-bottom: 16px; }
          </style>
          <div class="row">First</div>
          <div class="row">Second</div>
          <div class="row">Third</div>
        expect:
          - sel: '.row'
            count: 3
          - sel: '.row'
            style:
              margin-bottom: '16px'
              padding-top: '8px'

      - name: Borders and Corners
        obj: 'Add `border: 2px solid #000080` and `border-radius: 12px` to the `.panel` rule.'
        expl: 'A border is three things at once — width, style, and colour — so CSS lets you write all three in one declaration, in that order. `border-radius` then rounds the corners; it is most of the difference between a box that looks like a form field and one that looks like a card.'
        hint: '`border: 2px solid #000080;` and `border-radius: 12px;` — two declarations.'
        max: '6/1'
        web: true
        start: |
          <style>
            .panel { padding: 16px; }
          </style>
          <div class="panel">
            <p>A panel with nothing around it.</p>
          </div>
        sol: |
          <style>
            .panel { padding: 16px; border: 2px solid #000080; border-radius: 12px; }
          </style>
          <div class="panel">
            <p>A panel with nothing around it.</p>
          </div>
        expect:
          - sel: '.panel p'
            text: 'A panel with nothing around it.'
          - sel: '.panel'
            style:
              border-style: 'solid'
              border-color: '#000080'
              border-radius: '12px'

      - name: A Styled Card
        obj: 'Build a `div` with `class="card"` holding an `h2` reading `Tide Pool` and a `p` reading `Notes from the shore.`, then style `.card` with `background-color: #f4f1e8`, `padding: 20px`, `border-radius: 8px`, and centred text.'
        expl: 'Everything in this chapter at once, and this is most of what page styling actually is: a box, a colour, some breathing room, a rounded corner. Write the markup first and the rule second — decide what the thing *is*, then decide how it looks.'
        hint: 'One `.card` rule with four declarations, wrapped around markup like the last chapter''s.'
        max: '12/1'
        web: true
        start: |
          <style>
            /* Style the card here */
          </style>
          <!-- Build the card here -->
        sol: |
          <style>
            .card {
              background-color: #f4f1e8;
              padding: 20px;
              border-radius: 8px;
              text-align: center;
            }
          </style>
          <div class="card">
            <h2>Tide Pool</h2>
            <p>Notes from the shore.</p>
          </div>
        expect:
          - sel: 'div.card h2'
            text: 'Tide Pool'
          - sel: 'div.card p'
            text: 'Notes from the shore.'
          - sel: '.card'
            style:
              background-color: '#f4f1e8'
              padding-top: '20px'
              border-radius: '8px'
              text-align: 'center'
