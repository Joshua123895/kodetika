name: SQL
slug: sql
icon: sql
desc: 'Master SQL on a real database: selecting, filtering, sorting, grouping, joining, changing data, and more.'
difficulty: 1

# The database every level in this track queries. One schema for all thirty
# levels, deliberately: a student should learn these two tables once and then
# spend their attention on the language instead of re-reading table names.
#
# Kept small enough to hold in your head, and shaped for the questions the
# levels ask. Three properties are load-bearing and must survive any edit:
#   - `year` and `pages` are distinct across all twelve rows, so ORDER BY on
#     either has exactly one correct answer and no tie can be broken two ways.
#   - Jorge Luis Borges has no books, which is what makes LEFT JOIN visible.
#   - The genre counts (8 / 3 / 1) and country totals are all different, so
#     GROUP BY ... ORDER BY has one unambiguous order too.
db: |
  CREATE TABLE authors (
    id      INTEGER PRIMARY KEY,
    name    TEXT,
    country TEXT
  );

  INSERT INTO authors (id, name, country) VALUES
    (1, 'Ursula Le Guin',    'USA'),
    (2, 'Chinua Achebe',     'Nigeria'),
    (3, 'Italo Calvino',     'Italy'),
    (4, 'Toni Morrison',     'USA'),
    (5, 'Haruki Murakami',   'Japan'),
    (6, 'Jorge Luis Borges', 'Argentina');

  CREATE TABLE books (
    id        INTEGER PRIMARY KEY,
    title     TEXT,
    author_id INTEGER,
    year      INTEGER,
    pages     INTEGER,
    genre     TEXT,
    copies    INTEGER
  );

  INSERT INTO books (id, title, author_id, year, pages, genre, copies) VALUES
    (1,  'A Wizard of Earthsea',      1, 1968, 183, 'Fantasy',         4),
    (2,  'The Left Hand of Darkness', 1, 1969, 304, 'Science Fiction', 2),
    (3,  'The Dispossessed',          1, 1974, 341, 'Science Fiction', 1),
    (4,  'Things Fall Apart',         2, 1958, 209, 'Fiction',         5),
    (5,  'Arrow of God',              2, 1964, 287, 'Fiction',         2),
    (6,  'Cosmicomics',               3, 1965, 153, 'Fiction',         2),
    (7,  'Invisible Cities',          3, 1972, 165, 'Fiction',         3),
    (8,  'Song of Solomon',           4, 1977, 337, 'Fiction',         2),
    (9,  'Beloved',                   4, 1987, 324, 'Fiction',         6),
    (10, 'Hear the Wind Sing',        5, 1979, 130, 'Fiction',         1),
    (11, 'Hard-Boiled Wonderland',    5, 1985, 400, 'Science Fiction', 1),
    (12, 'Kafka on the Shore',        5, 2002, 505, 'Fiction',         3);

chapters:
  - name: Querying Tables
    icon: data
    levels:
      - name: Every Column
        obj: 'Show every column of every row in the `books` table.'
        expl: |
          A database keeps its data in **tables**: named columns, and one row per thing. This track has two of them, and you will use them for the next thirty levels.

          `books`

          | Column | Holds |
          |---|---|
          | `id` | a number, unique to each book |
          | `title` | the book title |
          | `author_id` | which author wrote it, by their `id` |
          | `year` | the year it was published |
          | `pages` | how long it is |
          | `genre` | Fiction, Science Fiction or Fantasy |
          | `copies` | how many the library owns |

          A question you ask a database is a **query**, and almost every one starts the same way: `SELECT` which columns you want, `FROM` which table. The `*` means every column. Press Run at any point to look at the data again.
        hint: 'Two words and a star: `SELECT *` then `FROM books`.'
        max: '3/1'
        sql: true
        start: |
          -- Ask for every column of the books table
        sol: |
          SELECT *
          FROM books;

      - name: Picking Columns
        obj: 'List the `title` and `year` of every book, in that order.'
        expl: 'Asking for `*` is convenient and almost always more than you need. Naming the columns instead — separated by commas, in the order you want them — makes the query say what it is for, and means a column added to the table later cannot quietly change your result. The `FROM` line does not change: you are still reading the same rows, just showing less of each one.'
        hint: 'Replace the `*` with `title, year`.'
        max: '3/1'
        sql: true
        start: |
          SELECT *
          FROM books;
        sol: |
          SELECT title, year
          FROM books;

      - name: Renaming a Column
        obj: 'List the `title` of every book, but have the column come back named `book`.'
        expl: 'The column names in a result come from the table, which is not always what you want to hand to whoever reads it. `AS` renames a column for this query only — the table itself is untouched. It becomes essential later, when a column is the result of a calculation and would otherwise arrive called something like `COUNT(*)`.'
        hint: '`SELECT title AS book`.'
        max: '3/1'
        sql: true
        # The only level in the track that grades column NAMES, because it is the
        # only one where the name is the answer rather than a detail.
        matchCols: true
        start: |
          -- Rename the column as you select it
          SELECT title
          FROM books;
        sol: |
          SELECT title AS book
          FROM books;
        checks:
          has:
            - '(?i)\bas\b'
          msg: 'Use `AS` to rename the column.'

      - name: Filtering Rows
        obj: 'Show every column of the books whose `genre` is `Science Fiction`.'
        expl: 'A `WHERE` clause is a test applied to every row: the ones that pass come back, the rest do not. Text goes in single quotes and is compared with a single `=`, not the `==` most programming languages use. This is the clause you will write more than any other.'
        hint: "Add `WHERE genre = 'Science Fiction'` after the `FROM` line."
        max: '4/1'
        sql: true
        start: |
          SELECT *
          FROM books
          -- Keep only the science fiction
        sol: |
          SELECT *
          FROM books
          WHERE genre = 'Science Fiction';
        checks:
          has:
            - '(?i)where'
          msg: 'Filter the rows with a `WHERE` clause rather than listing them another way.'

      - name: Comparing Numbers
        obj: 'List the `title` and `pages` of every book longer than 300 pages.'
        expl: 'Numbers need no quotes, and the comparisons are the ones you would guess: `>`, `<`, `>=`, `<=`, and `<>` for "not equal". Note that "longer than 300" is `> 300` and not `>= 300` — the difference between the two is the single most common way a `WHERE` clause comes back with one row too many.'
        hint: 'Ask for `pages > 300`.'
        max: '4/1'
        sql: true
        start: |
          SELECT title, pages
          FROM books
          -- Keep the long ones
        sol: |
          SELECT title, pages
          FROM books
          WHERE pages > 300;
        checks:
          has:
            - '(?i)where'
            - '>'
          msg: 'Compare the `pages` column with `>` inside a `WHERE` clause.'

      - name: Two Conditions
        obj: 'List the `title` of every Fiction book published before 1980.'
        expl: '`AND` joins two tests into one, and a row has to pass both to come back. There is no limit to how many you can chain, and there is no shortcut for repeating the column name — `genre = ''Fiction'' AND year < 1980`, not `genre = ''Fiction'' AND < 1980`.'
        hint: "Two tests joined by `AND`: the genre, and `year < 1980`."
        max: '4/1'
        sql: true
        start: |
          SELECT title
          FROM books
          -- Fiction, and published before 1980
        sol: |
          SELECT title
          FROM books
          WHERE genre = 'Fiction' AND year < 1980;
        checks:
          has:
            - '(?i)\band\b'
          msg: 'Join the two tests with `AND`.'

      - name: Either Condition
        obj: 'List the `title` and `genre` of every book that is Fantasy or Science Fiction, in that order.'
        expl: '`OR` is the other half of the pair: a row comes back if it passes *either* test. Mixing `AND` and `OR` in one clause is where brackets start to matter, because `AND` binds tighter — `a OR b AND c` means `a OR (b AND c)`, which is rarely what someone writing it in a hurry meant.'
        hint: "Two genre tests joined by `OR`."
        max: '4/1'
        sql: true
        start: |
          SELECT title, genre
          FROM books
          -- Either genre will do
        sol: |
          SELECT title, genre
          FROM books
          WHERE genre = 'Fantasy' OR genre = 'Science Fiction';
        checks:
          has:
            - '(?i)\bor\b'
          msg: 'Join the two tests with `OR`.'

      - name: Sorting Results
        obj: 'List the `title` and `year` of every book, oldest first.'
        expl: 'Without an `ORDER BY`, a database returns rows in whatever order was cheapest to produce, and it is entitled to change its mind. If the order is part of the answer, you have to ask for it. `ORDER BY year` sorts smallest first, which for a year means oldest first.'
        hint: 'Add `ORDER BY year` at the end.'
        max: '4/1'
        sql: true
        start: |
          SELECT title, year
          FROM books
          -- Put them in order
        sol: |
          SELECT title, year
          FROM books
          ORDER BY year;
        checks:
          has:
            - '(?i)order\s+by'
          msg: 'Sort the rows with `ORDER BY`.'

      - name: Largest First
        obj: 'List the `title` and `pages` of every book, longest first.'
        expl: 'Ascending is the default, so `ORDER BY pages` gives you the shortest book first. `DESC` after the column reverses it. You can sort by several columns — `ORDER BY genre, pages DESC` groups by genre and then puts the longest of each first — and `DESC` applies only to the column it follows.'
        hint: 'Add `DESC` after the column you are sorting by.'
        max: '4/1'
        sql: true
        start: |
          SELECT title, pages
          FROM books
          ORDER BY pages;
        sol: |
          SELECT title, pages
          FROM books
          ORDER BY pages DESC;
        checks:
          has:
            - '(?i)desc'
          msg: 'Reverse the sort with `DESC`.'

      - name: Just the Top Few
        obj: 'List the `title` and `pages` of the three longest books.'
        expl: '`LIMIT` caps how many rows come back. On its own it means "any three", which is almost never a question worth asking — it is `ORDER BY` that makes it mean something, and the two together are how every "top ten" list you have ever seen is built. Sort first, then cut.'
        hint: 'Keep the `ORDER BY ... DESC` and add `LIMIT 3` after it.'
        max: '5/1'
        sql: true
        start: |
          SELECT title, pages
          FROM books
          ORDER BY pages DESC
          -- Only the top three
        sol: |
          SELECT title, pages
          FROM books
          ORDER BY pages DESC
          LIMIT 3;
        checks:
          has:
            - '(?i)limit'
          msg: 'Cut the result down with `LIMIT`.'

  # More ways to ask about one table, before the chapter that starts counting
  # them. Every level here is still SELECT ... FROM books ... WHERE, so the only
  # new thing is the operator or function in the middle.
  - name: Sharper Filters
    icon: searching
    levels:
      - name: A List of Options
        obj: 'List the `title` and `genre` of every book whose `genre` is either `Fiction` or `Fantasy`, using `IN`.'
        expl: 'You could write this with `OR`, and for two options that is fine. `IN` takes a list in brackets and matches any of them, which stops the query growing a new `OR genre =` every time the list does. Read it as "is one of".'
        hint: 'The options go in brackets, quoted and comma-separated.'
        max: '4/1'
        sql: true
        start: |
          SELECT title, genre
          FROM books;
        sol: |
          SELECT title, genre
          FROM books
          WHERE genre IN ('Fiction', 'Fantasy');
        checks:
          has:
            - '(?i)\bIN\s*\('
          msg: 'Use `IN` with a list, rather than a chain of `OR` comparisons.'

      - name: Between Two Values
        obj: 'List the `title` and `year` of every book published from 1968 to 1979, using `BETWEEN`.'
        expl: '`BETWEEN` is shorthand for two comparisons joined by `AND`, and it includes both ends: `BETWEEN 1968 AND 1979` matches a book from either of those years. That inclusiveness is the detail people get wrong, so it is worth checking against the data the first time you use it.'
        hint: 'The smaller value comes first: `BETWEEN 1968 AND 1979`.'
        max: '4/1'
        sql: true
        start: |
          SELECT title, year
          FROM books;
        sol: |
          SELECT title, year
          FROM books
          WHERE year BETWEEN 1968 AND 1979;
        checks:
          has:
            - '(?i)BETWEEN'
          msg: 'Use `BETWEEN` rather than two separate comparisons.'

      - name: Nothing There
        obj: 'List the `title` of every book whose `genre` is missing.'
        expl: '`NULL` is not a value, it is the absence of one, which is why `genre = NULL` matches nothing at all: comparing an unknown with anything gives an unknown, never a yes. `IS NULL` is the test that exists for exactly this case. An extra row with no genre has been added to the table for this level.'
        hint: 'The operator is two words, and neither of them is an equals sign.'
        max: '4/1'
        sql: true
        seed: |
          INSERT INTO books (id, title, author_id, year, pages, genre, copies) VALUES
            (13, 'Untitled Draft', 1, 2010, 90, NULL, 1);
        start: |
          SELECT title
          FROM books;
        sol: |
          SELECT title
          FROM books
          WHERE genre IS NULL;
        checks:
          has:
            - '(?i)IS\s+NULL'
          msg: 'Test for a missing value with `IS NULL`, since `= NULL` never matches.'

      - name: Not This One
        obj: 'List the `title` and `genre` of every book that is not `Fiction`.'
        expl: 'SQL writes "not equal to" as `<>`, and also accepts `!=`. Either is fine. Watch what happens with the row that has no genre: it does not appear, because an unknown genre cannot be shown to be different from Fiction any more than it could be shown to be equal to it.'
        hint: 'One comparison, with `<>` in place of `=`.'
        max: '4/1'
        sql: true
        seed: |
          INSERT INTO books (id, title, author_id, year, pages, genre, copies) VALUES
            (13, 'Untitled Draft', 1, 2010, 90, NULL, 1);
        start: |
          SELECT title, genre
          FROM books;
        sol: |
          SELECT title, genre
          FROM books
          WHERE genre <> 'Fiction';
        checks:
          has:
            - '(?i)(<>|!=|NOT)'
          msg: 'Ask for the rows that are not Fiction, with `<>`.'

      - name: A Calculated Column
        obj: 'List the `title` and, in a column named `shelf_space`, the `pages` multiplied by `copies`.'
        expl: 'A column in a result does not have to exist in the table. Write an expression instead of a column name and the database works it out for every row. Without an `AS` the column would come back named after the expression itself, which is why the two ideas are usually used together.'
        hint: 'Multiply with `*`, then name the result with `AS`.'
        max: '3/1'
        sql: true
        matchCols: true
        start: |
          SELECT title, pages
          FROM books;
        sol: |
          SELECT title, pages * copies AS shelf_space
          FROM books;
        checks:
          has:
            - '(?i)AS\s+shelf_space'
          msg: 'Name the calculated column `shelf_space` with `AS`.'

      - name: Sticking Text Together
        obj: 'Return one column named `label` holding the title, a space, and the year in brackets, like `Beloved (1987)`.'
        expl: 'Two pipes join text end to end. Numbers are converted for you, so `year` needs no special treatment. Building a readable string in the query is useful when the result is going straight onto a page, and it is also a good reminder that a column is whatever you say it is.'
        hint: 'Four pieces joined in a row: the title, then `'' (''`, then the year, then `'')''`.'
        max: '3/1'
        sql: true
        matchCols: true
        start: |
          SELECT title, year
          FROM books;
        sol: |
          SELECT title || ' (' || year || ')' AS label
          FROM books;
        checks:
          has:
            - '\|\|'
          msg: 'Join the pieces with `||` rather than listing separate columns.'

      - name: Rounding a Number
        obj: 'List the `title` and, in a column named `hours`, the `pages` divided by `60.0` rounded to one decimal place.'
        expl: 'Dividing by `60.0` rather than `60` matters: with two whole numbers SQLite does whole-number division and throws the remainder away. `ROUND` then takes the value and how many decimal places to keep. Getting a surprising zero out of a division is almost always this.'
        hint: '`ROUND(pages / 60.0, 1)`, then name it.'
        max: '3/1'
        sql: true
        matchCols: true
        start: |
          SELECT title, pages
          FROM books;
        sol: |
          SELECT title, ROUND(pages / 60.0, 1) AS hours
          FROM books;
        checks:
          has:
            - '(?i)ROUND\s*\('
          msg: 'Use `ROUND` with a second argument of 1.'

      - name: If This Then That
        obj: 'List the `title` and a column named `size` that reads `Long` when `pages` is over 300 and `Short` otherwise.'
        expl: 'A `CASE` is the query language version of an `if`. It tests each row and produces a value, so the result is a real column you can sort or filter on. The `END` is not optional, and forgetting it produces a syntax error that points at the line after the one you need to fix.'
        hint: '`CASE WHEN pages > 300 THEN ... ELSE ... END`, then `AS size`.'
        max: '5/1'
        sql: true
        matchCols: true
        start: |
          SELECT title, pages
          FROM books;
        sol: |
          SELECT title,
                 CASE WHEN pages > 300 THEN 'Long' ELSE 'Short' END AS size
          FROM books;
        checks:
          has:
            - '(?i)CASE\s+WHEN'
          msg: 'Use a `CASE WHEN ... THEN ... ELSE ... END` expression.'

      - name: Skipping Some Rows
        obj: 'List the `title` of the books ordered by `year`, skipping the first three and showing the next two.'
        expl: '`LIMIT` says how many rows to show and `OFFSET` says how many to step over first. Together they are how a page of results is fetched, one screenful at a time. An `OFFSET` without an `ORDER BY` is meaningless, because "the first three" only means something once the rows have an order.'
        hint: '`LIMIT 2 OFFSET 3`, after the `ORDER BY`.'
        max: '5/1'
        sql: true
        start: |
          SELECT title
          FROM books
          ORDER BY year;
        sol: |
          SELECT title
          FROM books
          ORDER BY year
          LIMIT 2 OFFSET 3;
        checks:
          has:
            - '(?i)OFFSET'
          msg: 'Step over the first rows with `OFFSET`.'

      - name: Putting It Together
        obj: 'List the `title` and `year` of the Science Fiction and Fantasy books published between 1960 and 1990, newest first.'
        expl: 'Three ideas from this chapter in one query: a list of options, a range, and a sort. The two conditions are joined with `AND`, and indenting the second one under the first is a habit worth forming now, while queries are still short enough that it looks unnecessary.'
        hint: 'An `IN` list and a `BETWEEN` range, joined by `AND`, then `ORDER BY year DESC`.'
        max: '7/1'
        sql: true
        start: |
          SELECT title, year
          FROM books
          ORDER BY year DESC;
        sol: |
          SELECT title, year
          FROM books
          WHERE genre IN ('Science Fiction', 'Fantasy')
            AND year BETWEEN 1960 AND 1990
          ORDER BY year DESC;
        checks:
          has:
            - '(?i)\bIN\s*\('
            - '(?i)BETWEEN'
          msg: 'Use `IN` for the genres and `BETWEEN` for the years.'

  - name: Summarising Data
    icon: math
    levels:
      - name: Counting Rows
        obj: 'Count how many books are in the table. The result should be a single row with a single number.'
        expl: 'Everything so far returned one row per row of the table. **Aggregate functions** do the opposite: they take many rows and return one value. `COUNT(*)` is the simplest — it counts the rows that reached it, which with no `WHERE` clause means all of them. Add a `WHERE` and it counts only the matches, which makes it the fastest way to answer "how many of these are there?".'
        hint: '`SELECT COUNT(*) FROM books;`'
        max: '3/1'
        sql: true
        start: |
          -- Count the rows
          SELECT *
          FROM books;
        sol: |
          SELECT COUNT(*)
          FROM books;
        checks:
          has:
            - '(?i)count\s*\('
          msg: 'Let the database do the counting with `COUNT(*)`, rather than writing the number yourself.'

      - name: Adding Up
        obj: 'Add up the `copies` column: how many books does the library own altogether?'
        expl: '`SUM` totals a column instead of counting rows. Unlike `COUNT(*)` it needs to know *which* column, and it quietly skips `NULL` values rather than refusing to answer. `SUM(copies)` is 32 books on the shelves; `COUNT(*)` is 12 titles. Two different questions about the same table, and confusing them is a classic way to report the wrong figure with total confidence.'
        hint: '`SUM(copies)` in place of the column list.'
        max: '3/1'
        sql: true
        start: |
          -- Total the copies column
          SELECT copies
          FROM books;
        sol: |
          SELECT SUM(copies)
          FROM books;
        checks:
          has:
            - '(?i)sum\s*\('
          msg: 'Total the column with `SUM`.'

      - name: The Average
        obj: 'Show the average `pages` of the books, using `AVG`.'
        expl: 'There is an aggregate for the mean too. It is worth using rather than dividing `SUM` by `COUNT` yourself: in SQLite, dividing one integer by another throws the remainder away, so `SUM(pages) / COUNT(*)` reports 278 where the real average is 278.17. `AVG` returns a real number and gets it right.'
        hint: '`AVG(pages)`.'
        max: '3/1'
        sql: true
        start: |
          -- Average the pages column
          SELECT pages
          FROM books;
        sol: |
          SELECT AVG(pages)
          FROM books;
        checks:
          has:
            - '(?i)avg\s*\('
          msg: 'Use `AVG` rather than dividing by hand.'

      - name: Highest and Lowest
        obj: 'In a single row, show the fewest pages of any book and then the most pages of any book.'
        expl: '`MIN` and `MAX` complete the set. Several aggregates can sit side by side in one `SELECT` and each is computed over the same rows, so one query answers both halves of the question. They work on text as well as numbers, where they mean alphabetically first and last.'
        hint: 'Two aggregates, separated by a comma: `MIN(pages), MAX(pages)`.'
        max: '3/1'
        sql: true
        start: |
          -- The shortest and the longest, in one row
          SELECT pages
          FROM books;
        sol: |
          SELECT MIN(pages), MAX(pages)
          FROM books;
        checks:
          has:
            - '(?i)min\s*\('
            - '(?i)max\s*\('
          msg: 'Use `MIN` and `MAX` in the same `SELECT`.'

      - name: Distinct Values
        obj: 'List each genre that appears in the `books` table, once each.'
        expl: '`SELECT genre FROM books` gives twelve rows, because there are twelve books — `Fiction` appears eight times. `DISTINCT` collapses duplicate rows into one, which turns "the genre of every book" into "the genres there are". It applies to the whole row, not to one column, so `SELECT DISTINCT genre, year` would give you every distinct *pair*.'
        hint: '`SELECT DISTINCT genre`.'
        max: '3/1'
        sql: true
        start: |
          -- Once each, please
          SELECT genre
          FROM books;
        sol: |
          SELECT DISTINCT genre
          FROM books;
        checks:
          has:
            - '(?i)distinct'
          msg: 'Remove the duplicates with `DISTINCT`.'

      - name: Grouping Rows
        obj: 'For each `genre`, show the genre and then how many books it has.'
        expl: |
          `GROUP BY` is the idea that makes aggregates powerful. It splits the rows into piles — one per distinct value of the column you name — and then runs the aggregate on each pile separately, giving one row per pile instead of one row overall.

          The rule that catches everyone: every column in your `SELECT` must either be grouped by or wrapped in an aggregate. `SELECT genre, title` with `GROUP BY genre` is asking for one title out of eight, and most databases will simply refuse.
        hint: '`SELECT genre, COUNT(*)` with `GROUP BY genre` at the end.'
        max: '4/1'
        sql: true
        start: |
          SELECT genre, COUNT(*)
          FROM books
          -- One row per genre
        sol: |
          SELECT genre, COUNT(*)
          FROM books
          GROUP BY genre;
        checks:
          has:
            - '(?i)group\s+by'
            - '(?i)count\s*\('
          msg: 'Split the rows into piles with `GROUP BY`, then count each pile.'

      - name: Totals per Group
        obj: 'For each `author_id`, show the id and then the total `copies` of their books.'
        expl: 'Any aggregate works per group, not just `COUNT`. The shape of the query never changes: choose what to group by, choose what to compute for each group. This one answers "how many books by each author does the library hold?" — a question no single row of the table contains the answer to.'
        hint: '`SELECT author_id, SUM(copies)` and group by `author_id`.'
        max: '4/1'
        sql: true
        start: |
          SELECT author_id, SUM(copies)
          FROM books
          -- One row per author
        sol: |
          SELECT author_id, SUM(copies)
          FROM books
          GROUP BY author_id;
        checks:
          has:
            - '(?i)group\s+by'
            - '(?i)sum\s*\('
          msg: 'Group by `author_id` and total the copies for each group.'

      - name: Filtering Groups
        obj: 'For each `genre`, show the genre and then its number of books — but only genres with more than one book.'
        expl: '`WHERE` cannot help here: it runs *before* the grouping, on individual rows, and at that point no group has a count yet. `HAVING` is the same idea applied *after* — it filters the groups. So `WHERE year > 1970` means "ignore old books", while `HAVING COUNT(*) > 1` means "ignore small genres". Both can appear in one query, in that order.'
        hint: 'Add `HAVING COUNT(*) > 1` after the `GROUP BY`.'
        max: '5/1'
        sql: true
        start: |
          SELECT genre, COUNT(*)
          FROM books
          GROUP BY genre
          -- Drop the genres with only one book
        sol: |
          SELECT genre, COUNT(*)
          FROM books
          GROUP BY genre
          HAVING COUNT(*) > 1;
        checks:
          has:
            - '(?i)having'
          msg: 'Filter the groups with `HAVING`, not `WHERE`.'

      - name: Ordering a Summary
        obj: 'For each `genre`, show the genre and then its number of books, with the biggest genre first.'
        expl: 'A summary is a result like any other, so it can be sorted. You can sort by the aggregate itself — `ORDER BY COUNT(*) DESC` — even though no column of the table holds that number. This is the whole "top N by group" pattern, and adding `LIMIT 1` to it answers "which genre has the most books?".'
        hint: '`ORDER BY COUNT(*) DESC` after the `GROUP BY`.'
        max: '5/1'
        sql: true
        start: |
          SELECT genre, COUNT(*)
          FROM books
          GROUP BY genre
          -- Biggest first
        sol: |
          SELECT genre, COUNT(*)
          FROM books
          GROUP BY genre
          ORDER BY COUNT(*) DESC;
        checks:
          has:
            - '(?i)group\s+by'
            - '(?i)order\s+by'
          msg: 'Group the rows, then sort the groups with `ORDER BY`.'

      - name: Matching Text
        obj: 'List the `title` of every book whose title starts with `The`.'
        expl: '`=` is all or nothing, which is no use for "starts with". `LIKE` compares against a pattern in which `%` stands for any run of characters and `_` for exactly one. So `''The%''` matches anything beginning with those three letters, `''%the%''` finds the word anywhere, and `''_at''` matches cat and hat but not chat.'
        hint: "`WHERE title LIKE 'The%'`."
        max: '4/1'
        sql: true
        start: |
          SELECT title
          FROM books
          -- Only the titles starting with The
        sol: |
          SELECT title
          FROM books
          WHERE title LIKE 'The%';
        checks:
          has:
            - '(?i)like'
          msg: 'Match the start of the title with `LIKE` and a `%`.'

  # The old jump was from counting rows in one table straight to a JOIN. This
  # chapter walks the same distance in ten steps and deliberately never writes
  # the word JOIN: it reaches the second table with a subquery instead, so the
  # next chapter introduces the syntax for something the student has already
  # done another way rather than the idea and the syntax at once.
  - name: Two Tables
    icon: connection
    levels:
      - name: The Other Table
        obj: 'Show every column of every row in the `authors` table.'
        expl: |
          Everything so far has been one table. Here is the other one.

          `authors`

          | Column | Holds |
          |---|---|
          | `id` | a number, unique to each author |
          | `name` | the author name |
          | `country` | where they are from |

          Six authors, twelve books. Splitting them up this way means an author country is written down once rather than repeated on every book they wrote, and correcting it is one edit instead of several.
        hint: 'The same two lines as the very first level, with the other table name.'
        max: '3/1'
        sql: true
        start: |
          -- Look at the authors table
        sol: |
          SELECT *
          FROM authors;

      - name: One Country
        obj: 'List the `name` and `country` of every author from `USA`.'
        expl: 'Nothing new: this is the filtering you already know, pointed at the second table. Worth doing once so that `authors` feels like an ordinary table rather than a special one, because every clause you have learned works on it exactly the same way.'
        hint: 'A `WHERE` on `country`, with the value in quotes.'
        max: '4/1'
        sql: true
        start: |
          SELECT name, country
          FROM authors;
        sol: |
          SELECT name, country
          FROM authors
          WHERE country = 'USA';

      - name: The Linking Column
        obj: 'List the `id` and `name` of every author.'
        expl: 'Look at the two numbers side by side. Every book carries an `author_id`, and every author has an `id`. The book does not repeat the author name, it points at the row that holds it. That pointer is called a **foreign key**, and it is the whole idea behind splitting data across tables.'
        hint: 'Two columns, named in the order the objective gives them.'
        max: '3/1'
        sql: true
        start: |
          SELECT name
          FROM authors;
        sol: |
          SELECT id, name
          FROM authors;

      - name: Following the Pointer by Hand
        obj: 'List the `title` of every book whose `author_id` is 4.'
        expl: 'This is what following the pointer looks like when you do it yourself: read the id out of one table, then type it into a query against the other. It works, and it is the thing every later idea in this chapter replaces. Notice what is wrong with it before you are shown the fix.'
        hint: 'A `WHERE` on `author_id`, with a plain number and no quotes.'
        max: '4/1'
        sql: true
        start: |
          SELECT title
          FROM books;
        sol: |
          SELECT title
          FROM books
          WHERE author_id = 4;

      - name: Finding the Id First
        obj: 'List the `id` of the author named `Toni Morrison`.'
        expl: 'The other half of doing it by hand: a query whose answer is the number the previous level needed. Two queries, run one after the other, with a human copying a value between them. Once you can see it as two queries, the next step is to stop being the part in the middle.'
        hint: 'One column, one condition on `name`.'
        max: '4/1'
        sql: true
        start: |
          SELECT id
          FROM authors;
        sol: |
          SELECT id
          FROM authors
          WHERE name = 'Toni Morrison';

      - name: The Answer to Another Question
        obj: 'List the `title` of every book by `Toni Morrison`, finding her `id` with a query inside the query instead of typing `4`.'
        expl: 'A query in brackets can stand where a value would. The inner one runs first, produces a single number, and the outer one uses it. The result is the same rows as before, but the `4` is gone, and with it the bug that appears the day the ids change and nothing tells you.'
        hint: 'Put the whole inner query in brackets on the right of the `=`.'
        max: '5/1'
        sql: true
        start: |
          SELECT title
          FROM books;
        sol: |
          SELECT title
          FROM books
          WHERE author_id = (SELECT id FROM authors WHERE name = 'Toni Morrison');
        checks:
          has:
            - '(?i)=\s*\(\s*SELECT'
          msg: 'Find the id with a subquery in brackets rather than typing the number.'

      - name: Several Ids at Once
        obj: 'List the `title` of every book by an author from `USA`, using `IN` with a subquery.'
        expl: 'The last subquery had to return exactly one value, because `=` compares against one. `IN` compares against a list, so the inner query is free to return as many rows as it likes. This is the shape most subqueries take, and it answers questions that are genuinely awkward any other way.'
        hint: 'The inner query selects `id` from `authors` with a `WHERE` on `country`.'
        max: '5/1'
        sql: true
        start: |
          SELECT title
          FROM books;
        sol: |
          SELECT title
          FROM books
          WHERE author_id IN (SELECT id FROM authors WHERE country = 'USA');
        checks:
          has:
            - '(?i)IN\s*\(\s*SELECT'
          msg: 'Match against the list the inner query returns, with `IN (SELECT ...)`.'

      - name: Authors With No Books
        obj: 'List the `name` of every author who has no books at all, using `NOT IN`.'
        expl: 'Reverse the test and you can ask about absence, which is a question one table alone cannot answer. Be careful with `NOT IN` in real work: if the inner query returns even one `NULL`, the whole condition becomes unknown and you get no rows back at all. Here `author_id` is filled in on every book, so it is safe.'
        hint: 'The inner query returns every `author_id` in `books`.'
        max: '5/1'
        sql: true
        start: |
          SELECT name
          FROM authors;
        sol: |
          SELECT name
          FROM authors
          WHERE id NOT IN (SELECT author_id FROM books);
        checks:
          has:
            - '(?i)NOT\s+IN'
          msg: 'Ask for the authors whose id is `NOT IN` the list of book authors.'

      - name: Naming a Table
        obj: 'List the `title` and `year` of every book, giving `books` the alias `b` and writing the columns as `b.title` and `b.year`.'
        expl: 'A table can be given a short name for the length of one query, and a column can be written with the table in front of it. Neither changes the result here, which is exactly why it is worth practising now: the moment two tables are in play and both have an `id`, saying which one you mean stops being optional.'
        hint: '`FROM books AS b`, then put `b.` in front of each column.'
        max: '3/1'
        sql: true
        start: |
          SELECT title, year
          FROM books;
        sol: |
          SELECT b.title, b.year
          FROM books AS b;
        checks:
          has:
            - '(?i)\bAS\s+b\b'
            - '(?i)b\.title'
          msg: 'Alias the table with `AS b` and qualify both columns with `b.`.'

      - name: Putting It Together
        obj: 'List the `title` and `year` of every book by a Japanese author published after 1980, newest first.'
        expl: 'A subquery reaching into the other table, an ordinary condition beside it, and a sort. This is a real question answered without a single `JOIN`, which is the point of the chapter: the join in the next one is a clearer way to write something you can already do, not a new power.'
        hint: 'The subquery goes on the `author_id`, and the year condition sits beside it under `AND`.'
        max: '7/1'
        sql: true
        start: |
          SELECT title, year
          FROM books
          ORDER BY year DESC;
        sol: |
          SELECT title, year
          FROM books
          WHERE author_id IN (SELECT id FROM authors WHERE country = 'Japan')
            AND year > 1980
          ORDER BY year DESC;
        checks:
          has:
            - '(?i)IN\s*\(\s*SELECT'
          msg: 'Reach the author country with a subquery rather than typing the ids.'

  - name: Joining and Changing Data
    icon: connection
    levels:
      - name: Two Tables at Once
        obj: 'List the `title` of every book and then the `name` of its author.'
        expl: |
          The `books` table has never held an author name — only an `author_id`, which is a pointer into the other table:

          | Column | Holds |
          |---|---|
          | `id` | a number, unique to each author |
          | `name` | their name |
          | `country` | where they are from |

          Storing the name once and pointing at it is the central idea of a relational database: correct a spelling in one place and every book follows. A `JOIN` is how you put the two back together — `ON` says which columns line up, and the result has the columns of both. Writing `books.title` rather than `title` makes it clear which table each column came from, and becomes compulsory when both tables have a column of that name.
        hint: '`FROM books JOIN authors ON books.author_id = authors.id`.'
        max: '4/1'
        sql: true
        start: |
          SELECT books.title
          FROM books
          -- Bring in the authors table
        sol: |
          SELECT books.title, authors.name
          FROM books
          JOIN authors ON books.author_id = authors.id;
        checks:
          has:
            - '(?i)join'
            - '(?i)\bon\b'
          msg: 'Join the two tables with `JOIN ... ON`.'

      - name: Only What You Need
        obj: 'For every Science Fiction book, show the author `name` and then the book `title`.'
        expl: 'A join and a filter are independent: the `JOIN` decides which rows exist, the `WHERE` decides which of them you keep. Either table can be filtered — `WHERE authors.country = ''Japan''` would work exactly as well — and the columns you select can come from either, in any order you like.'
        hint: 'Keep the join and add a `WHERE` on `books.genre`.'
        max: '5/1'
        sql: true
        start: |
          SELECT authors.name, books.title
          FROM books
          JOIN authors ON books.author_id = authors.id
          -- Science fiction only
        sol: |
          SELECT authors.name, books.title
          FROM books
          JOIN authors ON books.author_id = authors.id
          WHERE books.genre = 'Science Fiction';
        checks:
          has:
            - '(?i)join'
            - '(?i)where'
          msg: 'Join the tables, then filter with `WHERE`.'

      - name: Keeping Every Row
        obj: 'For every author, show their `name` and then the `title` of each of their books — including the authors who have no books at all.'
        expl: 'A plain `JOIN` keeps only rows that found a match, so an author with no books vanishes from the result entirely. `LEFT JOIN` keeps every row of the left-hand table regardless, filling the right-hand columns with `NULL` where there was nothing to match. There is an author in this database with no books, and this is the query that proves it — which is exactly what makes `LEFT JOIN` the tool for finding what is missing.'
        hint: 'Start `FROM authors` and use `LEFT JOIN books`.'
        max: '4/1'
        sql: true
        start: |
          SELECT authors.name, books.title
          FROM authors
          JOIN books ON books.author_id = authors.id;
        sol: |
          SELECT authors.name, books.title
          FROM authors
          LEFT JOIN books ON books.author_id = authors.id;
        checks:
          has:
            - '(?i)left\s+join'
          msg: 'Keep every author with a `LEFT JOIN`.'

      - name: Counting Across Tables
        obj: 'For each author, show their `name` and then how many books they have. Authors with none should appear with a count of 0.'
        expl: 'Joining and grouping compose, and this query is where a detail stops being pedantic. `COUNT(*)` counts *rows*, and an author with no books still produced one row from the `LEFT JOIN` — so they would be reported as having one book. `COUNT(books.id)` counts non-`NULL` values instead, which for that author is zero. Right answer, and the difference is a single column name.'
        hint: 'Group by the author, and count `books.id` rather than `*`.'
        max: '5/1'
        sql: true
        start: |
          SELECT authors.name, COUNT(*)
          FROM authors
          LEFT JOIN books ON books.author_id = authors.id
          GROUP BY authors.id;
        sol: |
          SELECT authors.name, COUNT(books.id)
          FROM authors
          LEFT JOIN books ON books.author_id = authors.id
          GROUP BY authors.id;
        checks:
          has:
            - '(?i)left\s+join'
            - '(?i)group\s+by'
          msg: 'Keep every author with a `LEFT JOIN`, group by the author, and count a column rather than `*`.'

      - name: A Query Inside a Query
        obj: 'List the `title` of every book that is longer than the average number of pages.'
        expl: 'You cannot write `WHERE pages > AVG(pages)`: the average is computed over all the rows, and `WHERE` is deciding one row at a time — the number does not exist yet. A **subquery** in brackets is run first, on its own, and its single value is handed to the comparison. Anywhere a value could go, a query returning one value can go instead.'
        hint: 'Compare `pages` against `(SELECT AVG(pages) FROM books)`.'
        max: '4/1'
        sql: true
        start: |
          SELECT title
          FROM books
          -- Longer than the average
        sol: |
          SELECT title
          FROM books
          WHERE pages > (SELECT AVG(pages) FROM books);
        checks:
          has:
            - '(?i)select[\s\S]*select'
            - '(?i)avg\s*\('
          msg: 'Work out the average in a bracketed subquery rather than typing the number in.'

      - name: Adding a Row
        obj: 'Add a new author to the `authors` table: `id` 7, `name` Octavia Butler, `country` USA.'
        expl: 'Queries read; `INSERT` writes. You name the table, list the columns you are filling, and give a matching list of values — same number, same order. The columns are worth naming even though SQL lets you leave them out: without them the statement depends on the order the table was created in, and silently means something different the day a column is added.'
        hint: "`INSERT INTO authors (id, name, country) VALUES (7, 'Octavia Butler', 'USA');`"
        max: '3/1'
        sql: true
        start: |
          -- Add the new author
        sol: |
          INSERT INTO authors (id, name, country)
          VALUES (7, 'Octavia Butler', 'USA');
        checks:
          has:
            - '(?i)insert\s+into'
          msg: 'Add the row with `INSERT INTO`.'

      - name: Changing a Row
        obj: 'The library bought more copies of `Beloved`. Set that book''s `copies` to 9.'
        expl: '`UPDATE` changes rows that already exist: `SET` says what to change, `WHERE` says which rows to change it on. That `WHERE` is the entire safety mechanism — leave it off and the statement is perfectly valid and updates every row in the table. Selecting the rows first with the same `WHERE` clause, to see what you are about to hit, is a habit worth building now.'
        hint: "`UPDATE books SET copies = 9 WHERE title = 'Beloved';`"
        max: '3/1'
        sql: true
        start: |
          -- Change one book's copies to 9
        sol: |
          UPDATE books
          SET copies = 9
          WHERE title = 'Beloved';
        checks:
          has:
            - '(?i)update'
            - '(?i)where'
          msg: 'Use `UPDATE` with a `WHERE` clause so only that one book changes.'

      - name: Removing Rows
        obj: 'Remove every book published before 1965 from the `books` table.'
        expl: '`DELETE FROM` takes rows out, and the same warning applies with more force: without a `WHERE` clause it empties the table. There is no undo. Every level here starts from a fresh copy of the database, so nothing you do is permanent — but this is the one statement worth being nervous about for the rest of your career.'
        hint: '`DELETE FROM books WHERE year < 1965;`'
        max: '3/1'
        sql: true
        start: |
          -- Delete the books published before 1965
        sol: |
          DELETE FROM books
          WHERE year < 1965;
        checks:
          has:
            - '(?i)delete\s+from'
            - '(?i)where'
          msg: 'Use `DELETE FROM` with a `WHERE` clause so only the old books go.'

      - name: Making a Table
        obj: 'Create a table called `members` with two columns — `id` (INTEGER) and `name` (TEXT), in that order — then add one member: `id` 1, `name` Ada.'
        expl: 'Tables themselves are made with SQL. `CREATE TABLE` names the table and lists its columns, each with a **type** saying what kind of value it holds: `INTEGER`, `REAL`, `TEXT`, or `BLOB` in SQLite. Declaring the type is how the database can reject nonsense later. Two statements are needed here, each ending in its own semicolon — which is what the semicolon has been for all along.'
        hint: 'A `CREATE TABLE members (...)` statement, then an `INSERT INTO members`.'
        max: '4/1'
        sql: true
        start: |
          -- Create the table, then add the first member
        sol: |
          CREATE TABLE members (id INTEGER, name TEXT);
          INSERT INTO members (id, name)
          VALUES (1, 'Ada');
        checks:
          has:
            - '(?i)create\s+table'
            - '(?i)insert'
          msg: 'Create the table with `CREATE TABLE`, then add the row with `INSERT`.'

      - name: The Whole Report
        obj: |
          One report, using everything in this track. For every author country, show the country and then the total `copies` of all books by authors from there. Include only countries with more than 5 copies in total, and put the largest first.
        max: '6/1'
        sql: true
        start: |
          -- Country, total copies. Over 5 only. Largest first.
        sol: |
          SELECT authors.country, SUM(books.copies)
          FROM books
          JOIN authors ON books.author_id = authors.id
          GROUP BY authors.country
          HAVING SUM(books.copies) > 5
          ORDER BY SUM(books.copies) DESC;
        checks:
          has:
            - '(?i)join'
            - '(?i)group\s+by'
            - '(?i)having'
            - '(?i)order\s+by'
          msg: 'The report needs a join, a `GROUP BY`, a `HAVING` and an `ORDER BY`.'
